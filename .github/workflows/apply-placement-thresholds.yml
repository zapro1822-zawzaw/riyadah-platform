name: Fix assessment insert schema

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-v17:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fix assessment save payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('v17.html')
          s = p.read_text(encoding='utf-8')

          old = "await insert('assessments',{student_id:$(\'ast\').value,subject:$(\'asub\').value,assessment_type:'موضعة',placement_threshold:$(\'aplace\').value,mastery:$(\'aplace\').value,score:null,notes:$(\'anote\').value,assessed_at:$(\'adate\').value||new Date().toISOString().slice(0,10),created_by:user.id});"
          new = "await insert('assessments',{student_id:$(\'ast\').value,kind:$(\'asub\').value,title:'رائز الموضعة',mastery:$(\'aplace\').value,score:null,criteria:{placement_threshold:$(\'aplace\').value,notes:$(\'anote\').value||''},assessed_at:$(\'adate\').value||new Date().toISOString().slice(0,10),created_by:user.id});"

          if old not in s:
              # Fallback: replace the complete insert expression inside saveAssessment.
              pattern = r"await insert\('assessments',\{.*?created_by:user\.id\}\);"
              s2, n = re.subn(pattern, new, s, count=1)
              if n != 1:
                  raise SystemExit('assessment insert expression not found; aborting')
              s = s2
          else:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v17.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: align assessment insert with database schema'
          git push