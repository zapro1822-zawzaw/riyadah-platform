<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رَوّاد — إدارة المنصة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f3f6fa;color:#17212b}.top{background:linear-gradient(135deg,#0b2038,#1769d3);color:#fff;padding:20px}.wrap{max-width:1300px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid #dce4ec;border-radius:16px;padding:16px;box-shadow:0 6px 20px #102a4310}.num{font-size:30px;font-weight:900}.muted{color:#66788a}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#1769d3;color:#fff}.danger{background:#fee7e7;color:#9b2020}.success{background:#e7f7f0;color:#08734f}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:10px;border-bottom:1px solid #dce4ec;text-align:right}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(580px,100%)}.field{margin:9px 0}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd5df;border-radius:9px;font:inherit;box-sizing:border-box}.status{padding:12px;border-radius:10px;background:#eef6ff;color:#1558a0}@media(max-width:800px){.grid,.g2{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><div class="toolbar" style="justify-content:space-between"><div><h1 style="margin:0">👨‍💼 لوحة قيادة المدير</h1><div>إدارة كاملة للمنصة والحسابات</div></div><div class="toolbar"><span id="who"></span><button class="btn" onclick="openOriginalPlatform()">🏠 المنصة الأصلية</button><button class="btn danger" onclick="logout()">خروج</button></div></div></div></header><main class="wrap"><div id="status" class="status">جاري فتح لوحة المدير...</div><section id="app" style="display:none"><div class="grid"><div class="card"><div class="muted">إجمالي الحسابات</div><div id="all" class="num">0</div></div><div class="card"><div class="muted">الأساتذة</div><div id="teachers" class="num">0</div></div><div class="card"><div class="muted">المفتشون</div><div id="inspectors" class="num">0</div></div><div class="card"><div class="muted">المعطلون</div><div id="inactive" class="num">0</div></div></div><div class="g2"><section class="card"><div class="toolbar" style="justify-content:space-between"><h2>👥 المستخدمون</h2><button class="btn primary" onclick="createUserForm()">+ إضافة حساب</button></div><div id="users">جاري تحميل المستخدمين...</div></section><section class="card"><h2>🏫 المؤسسات</h2><div id="schools">جاري تحميل المؤسسات...</div></section></div></section></main><div class="modal" id="modal"><div class="modalbox"><div class="toolbar" style="justify-content:space-between"><h2 id="mt"></h2><button class="btn" onclick="closeModal()">✕</button></div><div id="mb"></div></div></div><script>
const U='https://bnqbavlkvrpcbhqxctda.supabase.co',K='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q',S=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let token,me,profiles=[];const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function openOriginalPlatform(){location.href='/platform.html'}
async function main(){try{const {data,error}=await S.auth.getUser();if(error||!data.user){location.replace('/');return}const u=data.user;token=(await S.auth.getSession()).data.session?.access_token;if((u.email||'').toLowerCase()!=='zapro1822@gmail.com'){const q=await S.from('profiles').select('id,full_name,email,role,is_active').eq('id',u.id).maybeSingle();if(q.error||q.data?.role!=='admin'||q.data?.is_active===false){await S.auth.signOut();location.replace('/');return}me=q.data}else me={id:u.id,email:u.email,full_name:'المدير',role:'admin',is_active:true};$('who').textContent='👤 '+(me.full_name||me.email);$('status').style.display='none';$('app').style.display='block';load();}catch(e){$('status').innerHTML='تعذر فتح لوحة المدير: '+esc(e.message)+'<br><button class="btn primary" onclick="location.reload()">إعادة المحاولة</button>'}}
async function api(action,data={}){if(!token)throw Error('انتهت جلسة الدخول');const r=await fetch(U+'/functions/v1/admin-users',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'فشل طلب الإدارة');return j}
async function load(){try{const d=await api('list');profiles=d.users||[];$('all').textContent=profiles.length;$('teachers').textContent=profiles.filter(x=>x.role==='teacher').length;$('inspectors').textContent=profiles.filter(x=>x.role==='inspector').length;$('inactive').textContent=profiles.filter(x=>x.is_active===false).length;$('users').innerHTML=profiles.map(p=>`<div class="card" style="margin:8px 0"><b>${esc(p.full_name||'—')}</b><div>${esc(p.email||'')} · ${p.role==='admin'?'مدير':p.role==='inspector'?'مفتش':'أستاذ'} · ${p.is_active?'🟢 مفعل':'🔴 معطل'}</div>${p.id!==me.id?`<button class="btn ${p.is_active?'danger':'success'}" onclick="toggle('${p.id}',${p.is_active})">${p.is_active?'تعطيل':'تفعيل'}</button>`:''}</div>`).join('')||'لا توجد حسابات';}catch(e){$('users').innerHTML='<div class="status">تم فتح لوحة المدير، لكن تعذر تحميل قائمة الحسابات: '+esc(e.message)+'</div>'}try{const q=await S.from('schools').select('name,region,district').order('created_at',{ascending:false});$('schools').innerHTML=(q.data||[]).map(s=>`<div class="card" style="margin:8px 0"><b>${esc(s.name)}</b><div class="muted">${esc(s.region||'')} ${esc(s.district||'')}</div></div>`).join('')||'لا توجد مؤسسات';}catch(e){$('schools').textContent='تعذر تحميل المؤسسات'}}
async function toggle(id,a){if(!confirm(a?'تعطيل الحساب؟':'تفعيل الحساب؟'))return;try{await api('set_active',{userId:id,isActive:!a});load()}catch(e){alert(e.message)}}function modal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function createUserForm(){modal('إضافة حساب',`<div class="field"><label>الاسم الكامل</label><input id="n"></div><div class="field"><label>البريد الإلكتروني</label><input id="e" type="email"></div><div class="field"><label>كلمة المرور</label><input id="p" type="password"></div><div class="field"><label>الصفة</label><select id="r"><option value="teacher">أستاذ(ة)</option><option value="inspector">مفتش(ة)</option></select></div><div class="field"><label>المؤسسة</label><input id="s"></div><button class="btn primary" onclick="createUser()">إنشاء الحساب</button>`)}async function createUser(){try{await api('create',{name:$('n').value.trim(),email:$('e').value.trim(),password:$('p').value,role:$('r').value,school:$('s').value.trim()});closeModal();load();alert('تم إنشاء الحساب بنجاح')}catch(e){alert(e.message)}}async function logout(){await S.auth.signOut();location.replace('/')}main();
</script></body></html>
