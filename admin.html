<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رَوّاد — لوحة المدير</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f3f6fa;color:#17212b}.top{background:linear-gradient(135deg,#0b2038,#1769d3);color:#fff;padding:20px}.wrap{max-width:1300px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid #dce4ec;border-radius:16px;padding:16px;box-shadow:0 6px 20px #102a4310}.num{font-size:30px;font-weight:900}.muted{color:#66788a}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#1769d3;color:white}.danger{background:#fee7e7;color:#9b2020}.success{background:#e7f7f0;color:#08734f}.light{background:#f1f5f9;color:#17212b}.hidden{display:none}.error{background:#fff0f0;color:#9b2020;padding:12px;border-radius:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:10px;border-bottom:1px solid #dce4ec;text-align:right}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{background:white;border-radius:18px;padding:20px;width:min(580px,100%)}.field{margin:9px 0}.field label{display:block;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd5df;border-radius:9px;font:inherit;box-sizing:border-box}@media(max-width:800px){.grid,.grid2{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><div class="toolbar" style="justify-content:space-between"><div><h1 style="margin:0">👨‍💼 لوحة قيادة المدير</h1><div>إدارة الأساتذة والمفتشين والحسابات</div></div><div class="toolbar"><span id="who"></span><button class="btn light" onclick="location.href='/'">المنصة</button><button class="btn danger" onclick="logout()">خروج</button></div></div></div></header><main class="wrap"><div id="guard" class="card">جاري فتح لوحة المدير…</div><section id="content" class="hidden"><div class="grid"><div class="card"><div class="muted">إجمالي الحسابات</div><div id="nAll" class="num">0</div></div><div class="card"><div class="muted">الأساتذة</div><div id="nTeachers" class="num">0</div></div><div class="card"><div class="muted">المفتشون</div><div id="nInspectors" class="num">0</div></div><div class="card"><div class="muted">الحسابات المعطلة</div><div id="nInactive" class="num">0</div></div></div><div class="grid2"><section class="card"><div class="toolbar" style="justify-content:space-between"><h2>👥 المستخدمون</h2><button class="btn primary" onclick="openCreate()">+ إضافة أستاذ/مفتش</button></div><div id="apiStatus" class="muted">جاري تحميل المستخدمين…</div><div class="tablewrap"><table class="table"><thead><tr><th>الاسم</th><th>البريد</th><th>الصفة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="users"></tbody></table></div></section><section class="card"><h2>🏫 المؤسسات</h2><div id="schools" class="muted">جاري التحميل…</div><button class="btn primary" onclick="openSchool()">+ إضافة مؤسسة</button></section></div></section></main><div class="modal" id="modal"><div class="modalbox"><div class="toolbar" style="justify-content:space-between"><h2 id="mt"></h2><button class="btn light" onclick="closeModal()">✕</button></div><div id="mb"></div></div></div><script>
const URL='https://bnqbavlkvrpcbhqxctda.supabase.co',KEY='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q',sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let token=null,me=null,profiles=[],schools=[];const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('انتهت مهلة الاتصال')),ms))]);
async function boot(){try{const r=await timeout(sb.auth.getSession(),6000);const s=r.data?.session;if(!s){location.replace('/');return}token=s.access_token;const u=s.user;let p=null;try{const q=await timeout(sb.from('profiles').select('id,full_name,email,role,is_active,school_name').eq('id',u.id).maybeSingle(),5000);p=q.data}catch(e){}if((u.email||'').toLowerCase()==='zapro1822@gmail.com'){p=p||{id:u.id,email:u.email,full_name:'المدير',role:'admin',is_active:true};p.role='admin';p.is_active=true}if(!p||p.role!=='admin'||p.is_active===false){await sb.auth.signOut();location.replace('/');return}me=p;$('who').textContent='👤 '+(p.full_name||p.email||'المدير');$('guard').classList.add('hidden');$('content').classList.remove('hidden');render();loadData()}catch(e){$('guard').innerHTML='<div class="error">تعذر فتح لوحة المدير: '+esc(e.message)+'</div><button class="btn primary" onclick="location.reload()">إعادة المحاولة</button>'}}
function render(){$('nAll').textContent=profiles.length;$('nTeachers').textContent=profiles.filter(x=>x.role==='teacher').length;$('nInspectors').textContent=profiles.filter(x=>x.role==='inspector').length;$('nInactive').textContent=profiles.filter(x=>x.is_active===false).length;$('users').innerHTML=profiles.length?profiles.map(p=>`<tr><td>${esc(p.full_name||'—')}</td><td dir="ltr">${esc(p.email||'')}</td><td>${p.role==='admin'?'مدير':p.role==='inspector'?'مفتش':'أستاذ'}</td><td>${p.is_active?'🟢 مفعل':'🔴 معطل'}</td><td>${p.id!==me.id?`<button class="btn ${p.is_active?'danger':'success'}" onclick="toggleUser('${p.id}',${p.is_active})">${p.is_active?'تعطيل':'تفعيل'}</button>`:'حسابك'}</td></tr>`).join(''):'<tr><td colspan="5">لم يتم تحميل المستخدمين بعد.</td></tr>'}
async function admin(action,data={}){if(!token)throw Error('انتهت الجلسة');const r=await timeout(fetch(URL+'/functions/v1/admin-users',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action,...data})}),10000);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'فشل طلب الإدارة');return j}
async function loadData(){try{const d=await admin('list');profiles=d.users||[];$('apiStatus').textContent='تم تحميل المستخدمين';render()}catch(e){$('apiStatus').innerHTML='<span class="error">تعذر تحميل قائمة المستخدمين، لكن لوحة المدير مفتوحة: '+esc(e.message)+'</span>'}try{const r=await timeout(sb.from('schools').select('id,name,code,director_name,region,district').order('created_at',{ascending:false}),7000);schools=r.data||[];$('schools').innerHTML=schools.length?schools.map(s=>`<div class="card"><b>${esc(s.name)}</b><div class="muted">${esc(s.region||'')} ${esc(s.district||'')}</div></div>`).join(''):'لا توجد مؤسسات';}catch(e){$('schools').textContent='تعذر تحميل المؤسسات'}}
async function toggleUser(id,a){if(!confirm(a?'تعطيل الحساب؟':'تفعيل الحساب؟'))return;try{await admin('set_active',{userId:id,isActive:!a});await loadData()}catch(e){alert(e.message)}}function modal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function openCreate(){modal('إضافة حساب جديد',`<div class="field"><label>الاسم الكامل</label><input id="n"></div><div class="field"><label>البريد</label><input id="e" type="email"></div><div class="field"><label>كلمة المرور</label><input id="pw" type="password"></div><div class="field"><label>الصفة</label><select id="r"><option value="teacher">أستاذ(ة)</option><option value="inspector">مفتش(ة)</option></select></div><div class="field"><label>المؤسسة/المديرية</label><input id="sc"></div><button class="btn primary" onclick="createUser()">إنشاء</button>`)}async function createUser(){try{await admin('create',{name:$('n').value.trim(),email:$('e').value.trim(),password:$('pw').value,role:$('r').value,school:$('sc').value.trim()});closeModal();await loadData();alert('تم إنشاء الحساب')}catch(e){alert(e.message)}}function openSchool(){modal('إضافة مؤسسة',`<div class="field"><label>اسم المؤسسة</label><input id="sn"></div><button class="btn primary" onclick="createSchool()">حفظ</button>`)}async function createSchool(){try{await admin('create_school',{name:$('sn').value.trim()});closeModal();await loadData()}catch(e){alert(e.message)}}async function logout(){await sb.auth.signOut();location.replace('/')}boot();</script></body></html>
