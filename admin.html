<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رَوّاد — لوحة المدير</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--nav:#0b2038;--blue:#1769d3;--green:#168a62;--red:#c73535;--bg:#f3f6fa;--card:#fff;--line:#dce4ec;--muted:#66788a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#17212b}.top{background:linear-gradient(135deg,#0b2038,#1769d3);color:#fff;padding:22px}.wrap{max-width:1400px;margin:auto;padding:18px}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 25px #102a4310}.num{font-size:30px;font-weight:900}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.danger{background:#fff0f0;color:#9b2020}.success{background:#e7f7f0;color:#08734f}.light{background:#f3f6fa;color:#17212b}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field input,.field select{padding:11px;border:1px solid #cbd5df;border-radius:10px;font:inherit}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:right}.table th{background:#f7f9fc}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:900}.ok{background:#def7ec;color:#086b4b}.bad{background:#fee7e7;color:#9b2020}.warn{background:#fff5d6;color:#8a5a00}.modal{display:none;position:fixed;inset:0;background:#0f172a99;align-items:center;justify-content:center;padding:14px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:20px;padding:20px;width:min(600px,100%);max-height:92vh;overflow:auto}.notice{padding:11px 13px;border-radius:11px;background:#eef6ff;color:#1558a0}.error{padding:10px;background:#fff0f0;color:#9b2020;border-radius:10px;margin:8px 0;display:none}.successmsg{padding:10px;background:#e7f7f0;color:#08734f;border-radius:10px;margin:8px 0;display:none}@media(max-width:800px){.g4,.g2{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body>
<header class="top"><div class="wrap" style="padding:0"><div class="toolbar" style="justify-content:space-between"><div><h1 style="margin:0">👨‍💼 لوحة قيادة المدير</h1><div style="opacity:.85">إدارة الأساتذة والمفتشين والحسابات</div></div><div class="toolbar"><span id="who"></span><button class="btn light" onclick="location.href='/'">المنصة</button><button class="btn danger" onclick="logout()">خروج</button></div></div></div></header>
<main class="wrap"><div id="guard" class="card">جاري التحقق من صلاحيات المدير…</div><div id="content" style="display:none">
<div class="grid g4"><div class="card"><div class="muted">إجمالي الحسابات</div><div id="nAll" class="num">0</div></div><div class="card"><div class="muted">الأساتذة</div><div id="nTeachers" class="num">0</div></div><div class="card"><div class="muted">المفتشون</div><div id="nInspectors" class="num">0</div></div><div class="card"><div class="muted">حسابات معطلة</div><div id="nInactive" class="num">0</div></div></div>
<div class="grid g2" style="margin-top:14px"><section class="card"><div class="toolbar" style="justify-content:space-between"><h2 style="margin:0">👥 المستخدمون</h2><button class="btn primary" onclick="openCreate()">+ إضافة أستاذ/مفتش</button></div><p class="muted">يمكنك تفعيل أو تعطيل الحساب، تغيير الصفة، وربطه بالمؤسسة.</p><div class="tablewrap"><table class="table"><thead><tr><th>الاسم</th><th>البريد</th><th>الصفة</th><th>المؤسسة</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section class="card"><h2>🏫 المؤسسة</h2><div id="schools"></div><button class="btn primary" onclick="openSchool()">+ إضافة مؤسسة</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>📝 طلبات الولوج</h3><div id="requests"></div></section></div></div></main>
<div class="modal" id="modal"><div class="modalbox"><div class="toolbar" style="justify-content:space-between"><h2 id="modalTitle" style="margin:0"></h2><button class="btn light" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const URL='https://bnqbavlkvrpcbhqxctda.supabase.co',KEY='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q',sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let me=null,profiles=[],schools=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/';return}const {data:p,error}=await sb.from('profiles').select('id,full_name,role,school_name,is_active,requested_role,created_at').eq('id',session.user.id).single();if(error||!p||p.role!=='admin'||!p.is_active){await sb.auth.signOut();location.href='/';return}me=p;$('who').textContent='👤 '+(p.full_name||session.user.email);$('guard').style.display='none';$('content').style.display='block';await refresh()}
async function refresh(){await Promise.all([loadProfiles(),loadSchools(),loadRequests()]);renderStats();renderUsers();renderSchools();renderRequests()}
async function loadProfiles(){let r=await callAdmin('list');profiles=r.users||[]}
async function loadSchools(){let r=await sb.from('schools').select('id,name,code,director_name,region,district,created_at').order('created_at',{ascending:false});schools=r.data||[]}
async function loadRequests(){let r=await sb.from('access_requests').select('id,user_id,requested_role,status,created_at').eq('status','pending').order('created_at',{ascending:false});window.requests=r.data||[]}
function renderStats(){$('nAll').textContent=profiles.length;$('nTeachers').textContent=profiles.filter(x=>x.role==='teacher').length;$('nInspectors').textContent=profiles.filter(x=>x.role==='inspector').length;$('nInactive').textContent=profiles.filter(x=>!x.is_active).length}
function renderUsers(){$('users').innerHTML=profiles.map(p=>`<tr><td><b>${esc(p.full_name||'—')}</b></td><td dir="ltr">${esc(p.email||'')}</td><td>${p.role==='admin'?'👨‍💼 مدير':p.role==='inspector'?'👩‍🏫 مفتش':'👨‍🏫 أستاذ'}</td><td>${esc(p.school_name||'—')}</td><td>${p.is_active?'<span class="badge ok">مفعل</span>':'<span class="badge bad">معطل</span>'}</td><td><div class="toolbar">${p.id!==me.id?`<button class="btn ${p.is_active?'danger':'success'}" onclick="toggleUser('${p.id}',${p.is_active})">${p.is_active?'تعطيل':'تفعيل'}</button><button class="btn light" onclick="editUser('${p.id}')">تعديل</button>`:'<span class="badge warn">حسابك</span>'}</div></td></tr>`).join('')||'<tr><td colspan="6">لا توجد حسابات.</td></tr>'}
function renderSchools(){$('schools').innerHTML=schools.length?schools.map(s=>`<div class="card" style="margin:8px 0"><b>${esc(s.name)}</b><div class="muted">${esc(s.region||'')} ${esc(s.district||'')}</div></div>`).join(''):'<div class="notice">لا توجد مؤسسة مسجلة بعد.</div>'}
function renderRequests(){$('requests').innerHTML=window.requests?.length?window.requests.map(r=>`<div class="card" style="margin:8px 0"><b>${r.requested_role==='inspector'?'مفتش':'أستاذ'}</b><div class="muted">${new Date(r.created_at).toLocaleString('ar-MA')}</div><div class="toolbar" style="margin-top:7px"><button class="btn success" onclick="review('${r.id}','approved')">قبول</button><button class="btn danger" onclick="review('${r.id}','rejected')">رفض</button></div></div>`).join(''):'<div class="muted">لا توجد طلبات معلقة.</div>'}
async function callAdmin(action,payload={}){const {data:{session}}=await sb.auth.getSession();const r=await fetch(URL+'/functions/v1/admin-users',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...payload})});const j=await r.json();if(!r.ok)throw Error(j.error||'فشل الطلب');return j}
function openCreate(){modal('إضافة حساب جديد',`<div class="notice">لن نرسل رسالة تأكيد؛ سيُنشأ الحساب مباشرة من طرف المدير، لذلك لا تتأثر العملية بحد البريد التجريبي في Supabase.</div><div id="formError" class="error"></div><div class="field"><label>الاسم الكامل *</label><input id="fName"></div><div class="field"><label>البريد الإلكتروني *</label><input id="fEmail" type="email"></div><div class="field"><label>كلمة المرور المؤقتة *</label><input id="fPass" type="password" placeholder="8 أحرف على الأقل"></div><div class="field"><label>الصفة</label><select id="fRole"><option value="teacher">أستاذ(ة)</option><option value="inspector">مفتش(ة)</option></select></div><div class="field"><label>المؤسسة / المديرية</label><input id="fSchool"></div><button class="btn primary" onclick="createUser()">إنشاء الحساب</button>`)}
async function createUser(){let name=$('fName').value.trim(),email=$('fEmail').value.trim(),password=$('fPass').value,role=$('fRole').value,school=$('fSchool').value.trim();if(!name||!email||password.length<8){$('formError').textContent='أكمل البيانات وتأكد أن كلمة المرور 8 أحرف على الأقل.';$('formError').style.display='block';return}try{await callAdmin('create',{name,email,password,role,school});closeModal();await refresh();alert('تم إنشاء الحساب بنجاح. يمكن للمستخدم الدخول فوراً.')}catch(e){$('formError').textContent=e.message;$('formError').style.display='block'}}
async function toggleUser(id,active){if(!confirm(active?'تعطيل هذا الحساب؟':'تفعيل هذا الحساب؟'))return;try{await callAdmin('set_active',{userId:id,isActive:!active});await refresh()}catch(e){alert(e.message)}}
function editUser(id){let p=profiles.find(x=>x.id===id);if(!p)return;modal('تعديل حساب',`<div class="field"><label>الاسم</label><input id="eName" value="${esc(p.full_name||'')}"></div><div class="field"><label>الصفة</label><select id="eRole"><option value="teacher" ${p.role==='teacher'?'selected':''}>أستاذ</option><option value="inspector" ${p.role==='inspector'?'selected':''}>مفتش</option><option value="admin" ${p.role==='admin'?'selected':''}>مدير</option></select></div><div class="field"><label>المؤسسة</label><input id="eSchool" value="${esc(p.school_name||'')}"></div><button class="btn primary" onclick="saveUser('${id}')">حفظ</button>`)}
async function saveUser(id){try{await callAdmin('update_profile',{userId:id,full_name:$('eName').value.trim(),role:$('eRole').value,school_name:$('eSchool').value.trim()});closeModal();await refresh()}catch(e){alert(e.message)}}
function openSchool(){modal('إضافة مؤسسة',`<div class="field"><label>اسم المؤسسة *</label><input id="sName"></div><div class="field"><label>الرمز</label><input id="sCode"></div><div class="field"><label>المدير</label><input id="sDir"></div><div class="field"><label>الجهة</label><input id="sReg"></div><div class="field"><label>المديرية</label><input id="sDist"></div><button class="btn primary" onclick="createSchool()">حفظ المؤسسة</button>`)}
async function createSchool(){try{await callAdmin('create_school',{name:$('sName').value.trim(),code:$('sCode').value.trim(),director_name:$('sDir').value.trim(),region:$('sReg').value.trim(),district:$('sDist').value.trim()});closeModal();await refresh()}catch(e){alert(e.message)}}
async function review(id,status){try{await callAdmin('review_request',{requestId:id,status});await refresh()}catch(e){alert(e.message)}}
async function logout(){await sb.auth.signOut();location.href='/'}boot();
</script></body></html>
