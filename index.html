<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2038"><title>رَوّاد — الولوج الآمن</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:radial-gradient(circle at 20% 10%,#1f5f9f,#0b2038 55%,#061522);min-height:100vh;color:#17212b}.gate{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(470px,100%);background:#fff;border-radius:26px;padding:28px;box-shadow:0 25px 80px #0008}.brand{display:flex;align-items:center;gap:13px;margin-bottom:20px}.logo{width:58px;height:58px;border-radius:18px;background:#1769d3;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:1000}.brand h1{margin:0;font-size:25px}.muted{color:#66788a}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field input,.field select{width:100%;padding:12px;border:1px solid #cbd5df;border-radius:11px;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:12px;font:inherit;font-weight:850;cursor:pointer}.primary{background:#1769d3;color:#fff}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.tab{padding:10px;border:0;border-radius:10px;background:#f1f5f9;font-weight:800;cursor:pointer}.tab.active{background:#1769d3;color:#fff}.error{display:none;background:#fff0f0;color:#9b2020;padding:10px;border-radius:11px;margin:10px 0;font-weight:700}.success{display:none;background:#e7f7f0;color:#08734f;padding:10px;border-radius:11px;margin:10px 0;font-weight:700}.small{font-size:12px;line-height:1.7;margin-top:13px}.loading{display:none;text-align:center;padding:10px;color:#1558a0}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.link{flex:1;text-decoration:none;text-align:center;background:#eef6ff;color:#1558a0;padding:9px;border-radius:10px;font-weight:800}</style></head><body><div class="gate"><div class="card"><div class="brand"><div class="logo">ر</div><div><h1>رَوّاد V15 Ultimate</h1><div class="muted">منصة القيادة التربوية الذكية</div></div></div><div class="tabs"><button id="loginTab" class="tab active">تسجيل الدخول</button><button id="signupTab" class="tab">طلب حساب</button></div><div id="loginPane"><div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">🔐 تسجيل الدخول</button></div><div id="signupPane" style="display:none"><div class="field"><label>الاسم الكامل</label><input id="signupName" autocomplete="name"></div><div class="field"><label>البريد الإلكتروني</label><input id="signupEmail" type="email" autocomplete="email"></div><div class="field"><label>كلمة المرور</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل"></div><div class="field"><label>الصفة المطلوبة</label><select id="signupRole"><option value="teacher">أستاذ(ة)</option><option value="inspector">مفتش(ة)</option></select></div><div class="field"><label>المؤسسة / المديرية</label><input id="signupSchool"></div><button id="signupBtn" class="btn primary">👤 إرسال طلب الحساب</button><div class="small muted">سيحتاج الحساب إلى التفعيل من المدير حسب الصفة المطلوبة.</div></div><div id="error" class="error"></div><div id="success" class="success"></div><div id="loading" class="loading">جاري الاتصال…</div><div class="links"><a class="link" href="/admin.html">لوحة المدير</a><a class="link" href="/inspector.html">لوحة المفتش</a></div><div class="small muted">حساب مستقل لكل مستخدم، مع حفظ الجلسة للولوج من الهاتف أو الحاسوب.</div></div></div><script>
const SUPABASE_URL='https://bnqbavlkvrpcbhqxctda.supabase.co';const SUPABASE_KEY='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);function msg(id,t){$(id).textContent=t;$(id).style.display=t?'block':'none'}function busy(v){$('loading').style.display=v?'block':'none';$('loginBtn').disabled=v;$('signupBtn').disabled=v}function pane(login){$('loginPane').style.display=login?'block':'none';$('signupPane').style.display=login?'none':'block';$('loginTab').classList.toggle('active',login);$('signupTab').classList.toggle('active',!login);msg('error','');msg('success','')}$('loginTab').onclick=()=>pane(true);$('signupTab').onclick=()=>pane(false);
async function timeout(p,ms){let t;return Promise.race([p,new Promise((_,reject)=>t=setTimeout(()=>reject(new Error('انتهت مهلة الاتصال. تحقق من الإنترنت ثم حاول مرة أخرى.')),ms))]).finally(()=>clearTimeout(t))}
function roleFromUser(user){const m=user?.user_metadata||{};if(m.role==='admin'||m.requested_role==='admin')return 'admin';if(m.role==='inspector'||m.requested_role==='inspector')return 'inspector';if(m.role==='teacher'||m.requested_role==='teacher')return 'teacher';if((user?.email||'').toLowerCase()==='zapro1822@gmail.com')return 'admin';return null}
async function getProfile(user,session){try{const q=await timeout(sb.from('profiles').select('id,full_name,email,role,is_active,school_name').eq('id',user.id).maybeSingle(),7000);if(q.error)throw q.error;return q.data}catch(e){return null}}
async function route(session){if(!session?.user)throw new Error('لم يتم إنشاء جلسة دخول.');const user=session.user;let profile=await getProfile(user,session);let role=profile?.role||roleFromUser(user);let active=profile?.is_active;/* Existing admin account is allowed even if its legacy profile row is incomplete. */if((user.email||'').toLowerCase()==='zapro1822@gmail.com'&&(role==='admin'||!profile)){role='admin';active=true}if(!role){throw new Error('تم تسجيل الدخول بنجاح، لكن لم يتم تحديد صلاحية الحساب. اطلب من المدير تفعيل الحساب.')}if(active===false){await sb.auth.signOut();throw new Error('الحساب موجود لكنه غير مفعل من المدير.')}busy(false);if(role==='admin')location.replace('/admin.html');else if(role==='inspector')location.replace('/inspector.html');else location.replace('/teacher.html')}
$('loginBtn').onclick=async()=>{msg('error','');const email=$('loginEmail').value.trim().toLowerCase(),password=$('loginPassword').value;if(!email||!password)return msg('error','أدخل البريد الإلكتروني وكلمة المرور.');busy(true);try{const result=await timeout(sb.auth.signInWithPassword({email,password}),15000);if(result.error)throw result.error;if(!result.data?.session)throw new Error('لم تُنشأ جلسة الدخول.');await route(result.data.session)}catch(error){busy(false);let text=error?.message||'خطأ غير معروف';if(error?.status===429||error?.code==='over_request_rate_limit')text='تم تجاوز عدد محاولات الدخول مؤقتًا. انتظر بضع دقائق ثم حاول مرة واحدة.';if(error?.code==='invalid_credentials')text='البريد الإلكتروني أو كلمة المرور غير صحيحة.';msg('error','تعذر تسجيل الدخول: '+text)}};
$('signupBtn').onclick=async()=>{msg('error','');msg('success','');const name=$('signupName').value.trim(),email=$('signupEmail').value.trim().toLowerCase(),password=$('signupPassword').value,role=$('signupRole').value,school=$('signupSchool').value.trim();if(!name||!email||password.length<8)return msg('error','أكمل البيانات وتأكد من كلمة المرور (8 أحرف على الأقل).');busy(true);try{const result=await timeout(sb.auth.signUp({email,password,options:{data:{full_name:name,requested_role:role,school_name:school}}}),15000);if(result.error)throw result.error;if(result.data?.session)await route(result.data.session);else{busy(false);msg('success','تم إرسال طلب الحساب. إذا كان تأكيد البريد مفعلًا، تحقق من بريدك ثم سجل الدخول.')}}catch(error){busy(false);msg('error','تعذر إنشاء الحساب: '+(error?.message||'خطأ غير معروف'))}};
$('loginPassword').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};(async()=>{try{const r=await timeout(sb.auth.getSession(),7000);if(r.data?.session)await route(r.data.session)}catch(e){busy(false)}})();
</script></body></html>
