,e.message)}}$('lb').onclick=login;$('sb').onclick=signup;$('lp').onkeydown=e=>{if(e.key==='Enter')login()};(async()=>{let r=await s.auth.getSession();if(r.data?.session)try{await go(r.data.session)}catch(e){}})();</script></body></html>
