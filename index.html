ail"></div><div class="field"><label>كلمة المرور</label><input id="sp" type="password" minlength="8"></div><div class="field"><label>الصفة المطلوبة</label><select id="sr"><option value="teacher">أستاذ(ة)</option><option value="inspector">مفتش(ة)</option><option value="parent">ولي أمر</option></select></div><button id="sb" class="btn">👤 إرسال طلب الحساب</button></div><div id="err" class="err"></div><div id="ok" class="ok"></div></div><script>const U='https://bnqbavlkvrpcbhqxctda.supabase.co',K='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q',s=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=x=>document.getElementById(x);function msg(i,t){$(i).textContent=t;$(i).style.display=t?'block':'none'}function pane(v){$('login').style.display=v?'block':'none';$('signup').style.display=v?'none':'block';$('lt').classList.toggle('active',v);$('st').classList.toggle('active',!v);msg('err','');msg('ok','')}$('lt').onclick=()=>pane(1);$('st').onclick=()=>pane(0);async function route(session){let u=session.user,p=(await s.from('profiles').select('role,is_active').eq('id',u.id).maybeSingle()).data,role=p?.role||u.user_metadata?.requested_role;if(u.email?.toLowerCase()==='zapro1822@gmail.com')role='admin';if(!role)throw Error('الحساب لا يتوفر على صلاحية.');if(p?.is_active===false)throw Error('الحساب غير مفعل.');location.replace(role==='admin'?'/manager.html':'/v17.html')}async function login(){try{msg('err','');let r=await s.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value});if(r.error)throw r.error;await route(r.data.session)}catch(e){msg('err',e.message)}}async function signup(){try{msg('err','');let r=await s.auth.signUp({email:$('se').value.trim(),password:$('sp').value,options:{data:{full_name:$('sn').value.trim(),requested_role:$('sr').value}}});if(r.error)throw r.error;if(r.data.session)await route(r.data.session);else msg('ok','تم إرسال طلب الحساب. تحقق من البريد إذا لزم الأمر.')}catch(e){msg('err
