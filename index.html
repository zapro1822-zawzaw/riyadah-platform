<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رُوّاد V8 | مؤسسات الريادة</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#182338}.app{display:flex;min-height:100vh}.side{width:260px;background:#0d1830;color:#fff;position:fixed;inset:0 0 0 auto;padding:18px;overflow:auto}.logo{font-size:26px;font-weight:800;margin-bottom:20px}.logo small{display:block;font-size:11px;color:#aab8d6;margin-top:5px}.nav button{width:100%;border:0;background:transparent;color:#dce5f8;text-align:right;padding:10px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#24385f;color:#fff}.main{margin-right:260px;width:calc(100% - 260px);padding:20px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-size:25px;font-weight:800}.muted{color:#68758a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 8px 24px #1020400a}.metric{font-size:28px;font-weight:800;margin-top:8px}.btn{border:1px solid #d9e0ea;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:#2457d6;color:#fff;border-color:#2457d6}.danger{color:#b4232d}.actions{display:flex;gap:7px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e6eaf0;text-align:right}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;background:#eef2f7}.ok{background:#e8f7ee;color:#14733a}.warn{background:#fff3dc;color:#8b5b00}.bad{background:#ffe8eb;color:#a51f2a}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{font-size:12px;color:#526075;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #d6dce6;border-radius:8px;background:#fff}.field textarea{min-height:90px}.modal{display:none;position:fixed;inset:0;background:#07112699;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.box{background:#fff;border-radius:15px;max-width:800px;width:100%;max-height:90vh;overflow:auto;padding:18px}.drop{border:2px dashed #b6c2d7;border-radius:12px;padding:35px;text-align:center;cursor:pointer}.mind{min-height:300px;background:#f8fafc;border:1px dashed #bac5d8;border-radius:12px;padding:18px}.node{display:inline-block;padding:8px 11px;margin:4px;border:1px solid #9bb1f3;background:#edf2ff;border-radius:8px}.root{font-weight:800;font-size:17px}.bar{height:9px;background:#e8edf4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2457d6}.notice{padding:10px;border-radius:9px;background:#eef4ff;margin:7px 0}@media(max-width:850px){.side{display:none}.main{margin:0;width:100%;padding:12px}.grid{grid-template-columns:1fr 1fr}.two,.form{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="logo">رُوّاد<small>منصة رقمية لمؤسسات الريادة — V8</small></div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><div><div id="title" class="title"></div><div class="muted">مركز قيادة الأستاذ والتتبع الفردي للتعلمات</div></div><div class="actions"><button class="btn" onclick="backup()">💾 نسخة احتياطية</button><button class="btn" onclick="restoreInput.click()">↩ استرجاع</button><input id="restoreInput" type="file" hidden accept="application/json" onchange="restore(this)"></div></div><div id="view"></div></main></div><div id="modal" class="modal"><div class="box"><div class="top"><h2 id="mt"></h2><button class="btn" onclick="closeModal()">✕</button></div><div id="mb"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const KEY='riyadah-v8';let D=JSON.parse(localStorage.getItem(KEY)||'null')||{school:{year:'2026/2027'},learners:[],groups:[],placement:[],math:[],tracking:[],fluency:[],support:[],inspector:[],maps:[]};let page='dashboard',mapHtml='';
const NAV=[['dashboard','🏠 لوحة القيادة'],['learners','👨‍🎓 المتعلمون والملفات'],['placement','📝 رائز الموضعة — الخامس'],['math','➗ TaRL الرياضيات — الخامس'],['tracking','📊 شبكات التتبع'],['fluency','📖 شبكات الطلاقة'],['support','🎯 الدعم المكثف والممتد'],['mindmap','🧠 مولد الخرائط من PPTX'],['reports','📈 التقارير والتقدم'],['inspector','👩‍🏫 المفتشة المؤطرة'],['settings','⚙️ المؤسسة']];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);const save=()=>{localStorage.setItem(KEY,JSON.stringify(D));render()};const lname=id=>D.learners.find(x=>x.id===id)?.name||'—';const gname=id=>D.groups.find(x=>x.id===id)?.name||'غير مصنف';
function go(p){page=p;render()}function render(){nav.innerHTML=NAV.map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');title.textContent=NAV.find(n=>n[0]===page)[1];view.innerHTML=V[page]()}function openModal(t,b){mt.textContent=t;mb.innerHTML=b;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}
function level(v){return v==='A'?'ok':v==='C'?'bad':''}function avg(a,f,m){return Math.round((+a+ +f+ +m)/3)}function latest(id){return D.placement.filter(x=>x.l===id).slice(-1)[0]}
const V={
dashboard:()=>{let av=D.learners.map(l=>{let x=latest(l.id);return x?avg(x.ar,x.fr,x.ma):0}).filter(Boolean);let A=av.length?Math.round(av.reduce((a,b)=>a+b,0)/av.length):0;return `<div class="grid"><div class="card">المتعلمون<div class="metric">${D.learners.length}</div></div><div class="card">التحكم العام<div class="metric">${A}%</div></div><div class="card">روائز مسجلة<div class="metric">${D.placement.length}</div></div><div class="card">تعثرات رياضيات<div class="metric">${D.math.filter(x=>x.v!=='متحكم').length}</div></div></div><div class="two"><div class="card"><h3>مسار العمل</h3><div class="notice">1. الموضعة الفردية → 2. تشكيل مجموعات TaRL → 3. تصديق اللبنات → 4. التتبع → 5. إعادة التقييم → 6. قياس الأثر.</div><div class="actions"><button class="btn primary" onclick="addLearner()">➕ متعلم</button><button class="btn" onclick="go('placement')">📝 رائز</button><button class="btn" onclick="go('math')">➗ اللبنات</button><button class="btn" onclick="go('mindmap')">🧠 خريطة</button></div></div><div class="card"><h3>تحتاج إلى تدخل</h3>${D.learners.map(l=>{let x=latest(l.id);return x&&avg(x.ar,x.fr,x.ma)<50?`<p><span class="pill bad">${esc(l.name)} — ${avg(x.ar,x.fr,x.ma)}%</span></p>`:''}).join('')||'<span class="muted">لا توجد تنبيهات</span>'}</div></div>`},
learners:()=>`<div class="card"><div class="actions"><button class="btn primary" onclick="addLearner()">➕ إضافة متعلم</button><button class="btn" onclick="downloadLearners()">📥 Excel/CSV</button></div><table class="table"><tr><th>#</th><th>اسم المتعلم</th><th>الفوج</th><th>آخر متوسط</th><th>إجراء</th></tr>${D.learners.map((l,i)=>{let x=latest(l.id),a=x?avg(x.ar,x.fr,x.ma):0;return `<tr><td>${i+1}</td><td>${esc(l.name)}</td><td>${esc(gname(l.g))}</td><td><span class="pill ${a>=75?'ok':a>=50?'warn':'bad'}">${a}%</span></td><td><button class="btn" onclick="profile('${l.id}')">ملف فردي</button> <button class="btn danger" onclick="deleteLearner('${l.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan=5>لا توجد بيانات</td></tr>'}</table></div>`,
placement:()=>`<div class="card"><h3>رائز الموضعة والأداء — المستوى الخامس</h3><p class="muted">مطابق لحقول الشبكة المرفوعة: العربية (مستوى موضعة + فهم A/C)، الفرنسية (مستوى موضعة + Compréhension A/C)، الرياضيات (مستوى موضعة + مسألة A/C). fileciteturn1file0</p><button class="btn primary" onclick="addPlacement()">➕ إدخال نتيجة</button> <button class="btn" onclick="downloadPlacement()">📥 تحميل الشبكة</button><table class="table"><tr><th>المتعلم</th><th>العربية</th><th>الفرنسية</th><th>الرياضيات</th><th>المتوسط</th><th>نوع</th></tr>${D.placement.map(x=>`<tr><td>${esc(lname(x.l))}</td><td>${x.ar} / ${x.arPerf}</td><td>${x.fr} / ${x.frPerf}</td><td>${x.ma} / ${x.maPerf}</td><td>${avg(x.ar,x.fr,x.ma)}%</td><td>${x.t}</td></tr>`).join('')||'<tr><td colspan=6>لا توجد نتائج</td></tr>'}</table></div>`,
math:()=>`<div class="two"><div class="card"><h3>شبكة TaRL للرياضيات — الخامس</h3><p class="muted">مسار 1 ومسار 2 مع أعمدة الرائز البدئي، اللبنات، والرائز البعدي، كما في النماذج المرفوعة. fileciteturn1file2 fileciteturn1file3</p><button class="btn primary" onclick="addMath()">➕ تصديق لبنة</button><button class="btn" onclick="downloadMath()">📥 تحميل</button>${['مسار 1','مسار 2'].map(p=>`<h4>${p}</h4><table class="table"><tr><th>المتعلم</th><th>اللبنة</th><th>البدئي</th><th>التحكم</th><th>البعدي</th></tr>${D.math.filter(x=>x.p===p).map(x=>`<tr><td>${esc(lname(x.l))}</td><td>${esc(x.b)}</td><td>${x.pre}</td><td><span class="pill ${x.v==='متحكم'?'ok':x.v==='في طور التحكم'?'warn':'bad'}">${x.v}</span></td><td>${x.post}</td></tr>`).join('')||'<tr><td colspan=5>فارغ</td></tr>'}</table>`).join('')}</div><div class="card"><h3>مؤشرات تلقائية</h3>${D.groups.map(g=>{let n=D.learners.filter(l=>l.g===g.id).length;return `<p><b>${esc(g.name)}</b> — ${n} متعلم</p>`}).join('')||'<span class="muted">أنشئ الأفواج من الإعدادات/الملف</span>'}</div></div>`,
tracking:()=>networkPage('tracking','📊 شبكات التتبع'),fluency:()=>networkPage('fluency','📖 شبكات الطلاقة'),
support:()=>`<div class="two"><div class="card"><h3>🎯 خطة الدعم</h3><div class="form"><div class="field"><label>التاريخ</label><input id="supDate" type="date"></div><div class="field"><label>المرحلة</label><select id="supStage"><option>الدعم المكثف</option><option>الدعم الممتد</option><option>دعم فردي</option></select></div><div class="field"><label>المتعلم/الفوج</label><select id="supLearner"><option value="">فوج</option>${D.learners.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>الهدف</label><input id="supGoal"></div><div class="field" style="grid-column:1/-1"><label>النشاط والملاحظة</label><textarea id="supNote"></textarea></div></div><button class="btn primary" onclick="saveSupport()">حفظ</button></div><div class="card"><h3>السجل</h3>${D.support.map(x=>`<div class="notice">${esc(x.date)} — ${esc(x.stage)} — ${esc(lname(x.l))} — ${esc(x.goal)}</div>`).join('')||'<span class="muted">فارغ</span>'}</div></div>`,
mindmap:()=>`<div class="two"><div class="card"><h3>🧠 توليد خريطة ذهنية تلقائيًا من PPTX</h3><div class="drop" onclick="pptInput.click()">📤 اضغط لرفع درس PowerPoint (.pptx)<input id="pptInput" type="file" hidden accept=".pptx" onchange="generateMap(this)"><p class="muted">يستخرج عناوين ونصوص الشرائح ويحولها إلى بنية رئيسية وفروع.</p></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="downloadMap()">📥 تحميل HTML</button><button class="btn" onclick="printMap()">🖨️ طباعة</button></div></div><div class="card"><h3>المعاينة</h3><div id="mind" class="mind"><span class="muted">لم يتم رفع درس بعد.</span></div></div></div>`,
reports:()=>{let pre=D.placement.filter(x=>x.t==='قبلي'),post=D.placement.filter(x=>x.t==='بعدي');let avgSet=a=>a.length?Math.round(a.reduce((s,x)=>s+avg(x.ar,x.fr,x.ma),0)/a.length):0;let A=avgSet(pre),B=avgSet(post);return `<div class="grid"><div class="card">القبلي<div class="metric">${A}%</div></div><div class="card">البعدي<div class="metric">${B}%</div></div><div class="card">نمو الأثر<div class="metric">${B-A}%</div></div><div class="card">شبكات التتبع<div class="metric">${D.tracking.length}</div></div></div><div class="card"><h3>تحليل فردي</h3><table class="table"><tr><th>المتعلم</th><th>قبلي</th><th>بعدي</th><th>التغير</th><th>التوجيه</th></tr>${D.learners.map(l=>{let p=D.placement.filter(x=>x.l===l.id&&x.t==='قبلي').slice(-1)[0],q=D.placement.filter(x=>x.l===l.id&&x.t==='بعدي').slice(-1)[0],a=p?avg(p.ar,p.fr,p.ma):0,b=q?avg(q.ar,q.fr,q.ma):0;return `<tr><td>${esc(l.name)}</td><td>${a}%</td><td>${b}%</td><td>${b-a}%</td><td>${b<50?'دعم مكثف':b<75?'دعم ممتد':'استمرار ومواكبة'}</td></tr>`}).join('')}</table><button class="btn primary" onclick="downloadReport()">📥 تحميل التقرير</button></div>`},
inspector:()=>`<div class="two"><div class="card"><h3>👩‍🏫 المواكبة والتأطير</h3><div class="form"><div class="field"><label>التاريخ</label><input id="insDate" type="date"></div><div class="field"><label>اسم المفتشة المؤطرة</label><input id="insName"></div><div class="field" style="grid-column:1/-1"><label>الملاحظة</label><textarea id="insNote"></textarea></div><div class="field" style="grid-column:1/-1"><label>التوصية/الإجراء</label><textarea id="insAction"></textarea></div></div><button class="btn primary" onclick="saveInspector()">حفظ</button></div><div class="card"><h3>السجل</h3>${D.inspector.map(x=>`<div class="notice">${esc(x.date)} — ${esc(x.name)}<br>${esc(x.action)}</div>`).join('')||'<span class="muted">فارغ</span>'}</div></div>`,
settings:()=>`<div class="card"><h3>🏫 بيانات المؤسسة</h3><div class="form"><div class="field"><label>الأكاديمية</label><input id="academy" value="${esc(D.school.academy)}"></div><div class="field"><label>المديرية</label><input id="directorate" value="${esc(D.school.directorate)}"></div><div class="field"><label>المؤسسة</label><input id="school" value="${esc(D.school.school)}"></div><div class="field"><label>الأستاذ(ة)</label><input id="teacher" value="${esc(D.school.teacher)}"></div><div class="field"><label>الموسم الدراسي</label><input id="year" value="${esc(D.school.year)}"></div></div><button class="btn primary" onclick="saveSettings()">حفظ</button> <button class="btn" onclick="newGroup()">➕ إنشاء فوج</button> <button class="btn danger" onclick="resetAll()">مسح البيانات</button><hr><h3>الأفواج</h3>${D.groups.map(g=>`<p><b>${esc(g.name)}</b> — ${D.learners.filter(l=>l.g===g.id).length} متعلم</p>`).join('')||'<span class="muted">لا توجد أفواج</span>'}</div>`};
function networkPage(k,t){return `<div class="card"><h3>${t}</h3><button class="btn primary" onclick="addNetwork('${k}')">➕ تسجيل مؤشر</button><button class="btn" onclick="downloadNetwork('${k}')">📥 تحميل</button><table class="table"><tr><th>المتعلم</th><th>المجال</th><th>المؤشر</th><th>التاريخ</th><th>المستوى</th></tr>${D[k].map(x=>`<tr><td>${esc(lname(x.l))}</td><td>${esc(x.domain)}</td><td>${esc(x.indicator)}</td><td>${esc(x.date)}</td><td><span class="pill ${x.v==='متحكم'?'ok':x.v==='في طور التحكم'?'warn':'bad'}">${x.v}</span></td></tr>`).join('')||'<tr><td colspan=5>لا توجد بيانات</td></tr>'}</table></div>`}
function addLearner(){openModal('إضافة متعلم',`<div class="form"><div class="field"><label>اسم المتعلم</label><input id="newName"></div><div class="field"><label>الفوج</label><select id="newGroup"><option value="">غير مصنف</option>${D.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div></div><button class="btn primary" onclick="saveLearner()">حفظ</button>`)}function saveLearner(){if(!newName.value.trim())return alert('اكتب اسم المتعلم');D.learners.push({id:uid(),name:newName.value.trim(),g:newGroup.value});closeModal();save()}function deleteLearner(i){if(confirm('حذف المتعلم وبياناته المرتبطة؟')){D.learners=D.learners.filter(x=>x.id!==i);['placement','math','tracking','fluency','support'].forEach(k=>D[k]=D[k].filter(x=>x.l!==i));save()}}
function profile(i){let l=D.learners.find(x=>x.id===i);openModal('الملف الفردي',`<h3>${esc(l.name)}</h3><p>الفوج: ${esc(gname(l.g))}</p><h4>الرائز</h4>${D.placement.filter(x=>x.l===i).map(x=>`<p>${x.t}: العربية ${x.ar}% — الفرنسية ${x.fr}% — الرياضيات ${x.ma}% — المتوسط ${avg(x.ar,x.fr,x.ma)}%</p>`).join('')||'لا توجد نتائج'}<h4>لبنات الرياضيات</h4>${D.math.filter(x=>x.l===i).map(x=>`<p>${esc(x.p)} — ${esc(x.b)} — ${x.v}</p>`).join('')||'لا توجد بيانات'}<h4>الدعم</h4>${D.support.filter(x=>x.l===i).map(x=>`<p>${esc(x.date)} — ${esc(x.goal)}</p>`).join('')||'لا توجد جلسات'}`)}
function addPlacement(){openModal('إدخال رائز المستوى الخامس',`<div class="form"><div class="field"><label>المتعلم</label><select id="pl"><option value="">اختر</option>${D.learners.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>نوع الاختبار</label><select id="pt"><option>رائز الموضعة</option><option>قبلي</option><option>بعدي</option></select></div><div class="field"><label>العربية — مستوى موضعة/نقطة</label><input id="par" type="number" min="0" max="100" value="0"></div><div class="field"><label>العربية — فهم A/C</label><select id="pap"><option>A</option><option>C</option></select></div><div class="field"><label>الفرنسية — مستوى موضعة/نقطة</label><input id="pfr" type="number" min="0" max="100" value="0"></div><div class="field"><label>الفرنسية — Compréhension A/C</label><select id="pfp"><option>A</option><option>C</option></select></div><div class="field"><label>الرياضيات — مستوى موضعة/نقطة</label><input id="pma" type="number" min="0" max="100" value="0"></div><div class="field"><label>الرياضيات — مسألة A/C</label><select id="pmp"><option>A</option><option>C</option></select></div></div><button class="btn primary" onclick="savePlacement()">حفظ</button>`)}function savePlacement(){if(!pl.value)return alert('اختر المتعلم');D.placement.push({l:pl.value,t:pt.value,ar:+par.value,arPerf:pap.value,fr:+pfr.value,frPerf:pfp.value,ma:+pma.value,maPerf:pmp.value,date:new Date().toISOString().slice(0,10)});closeModal();save()}
function addMath(){openModal('تصديق لبنة الرياضيات — المستوى الخامس',`<div class="form"><div class="field"><label>المتعلم</label><select id="ml">${D.learners.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>المسار</label><select id="mp"><option>مسار 1</option><option>مسار 2</option></select></div><div class="field"><label>اللبنة</label><input id="mbb" placeholder="اللبنة 1"></div><div class="field"><label>الرائز البدئي</label><select id="mPre"><option>A</option><option>C</option></select></div><div class="field"><label>التحكم</label><select id="mVal"><option>متحكم</option><option>في طور التحكم</option><option>غير متحكم</option></select></div><div class="field"><label>الرائز البعدي</label><select id="mPost"><option>A</option><option>C</option></select></div></div><button class="btn primary" onclick="saveMath()">حفظ</button>`)}function saveMath(){D.math.push({l:ml.value,p:mp.value,b:mbb.value||'لبنة',pre:mPre.value,v:mVal.value,post:mPost.value});closeModal();save()}
function addNetwork(k){openModal('إضافة مؤشر',`<div class="form"><div class="field"><label>المتعلم</label><select id="nl">${D.learners.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input id="nd" type="date"></div><div class="field"><label>المجال</label><input id="nDom"></div><div class="field"><label>المؤشر</label><input id="nInd"></div><div class="field"><label>المستوى</label><select id="nVal"><option>متحكم</option><option>في طور التحكم</option><option>غير متحكم</option></select></div></div><button class="btn primary" onclick="saveNetwork('${k}')">حفظ</button>`)}function saveNetwork(k){D[k].push({l:nl.value,date:nd.value,domain:nDom.value,indicator:nInd.value,v:nVal.value});closeModal();save()}
function saveSupport(){D.support.push({date:supDate.value,stage:supStage.value,l:supLearner.value,goal:supGoal.value,note:supNote.value});save();alert('تم حفظ جلسة الدعم')}
function newGroup(){openModal('إنشاء فوج TaRL',`<div class="field"><label>اسم الفوج</label><input id="gName"></div><button class="btn primary" onclick="saveGroup()">حفظ</button>`)}function saveGroup(){if(!gName.value.trim())return;D.groups.push({id:uid(),name:gName.value.trim()});closeModal();save()}
function saveInspector(){D.inspector.push({date:insDate.value,name:insName.value,note:insNote.value,action:insAction.value});save();alert('تم حفظ المواكبة')}
function saveSettings(){D.school={academy:academy.value,directorate:directorate.value,school:school.value,teacher:teacher.value,year:year.value};save();alert('تم الحفظ')}
function resetAll(){if(confirm('سيتم حذف كل البيانات من هذا المتصفح. هل أنت متأكد؟')){localStorage.removeItem(KEY);location.reload()}}
function downloadFile(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function csv(rows){return rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n')}
function downloadLearners(){downloadFile('المتعلمون.csv',csv([['الاسم','الفوج'],...D.learners.map(l=>[l.name,gname(l.g)])]),'text/csv;charset=utf-8')}function downloadPlacement(){downloadFile('رائز_الموضعة_الخامس.csv',csv([['المتعلم','النوع','العربية','فهم','الفرنسية','Compréhension','الرياضيات','مسألة'],...D.placement.map(x=>[lname(x.l),x.t,x.ar,x.arPerf,x.fr,x.frPerf,x.ma,x.maPerf])]),'text/csv;charset=utf-8')}function downloadMath(){downloadFile('TaRL_رياضيات_الخامس.csv',csv([['المتعلم','المسار','اللبنة','البدئي','التحكم','البعدي'],...D.math.map(x=>[lname(x.l),x.p,x.b,x.pre,x.v,x.post])]),'text/csv;charset=utf-8')}function downloadNetwork(k){downloadFile(k+'.csv',csv([['المتعلم','التاريخ','المجال','المؤشر','المستوى'],...D[k].map(x=>[lname(x.l),x.date,x.domain,x.indicator,x.v])]),'text/csv;charset=utf-8')}function downloadReport(){let rows=[['المتعلم','قبلي','بعدي','التغير','التوجيه']];D.learners.forEach(l=>{let p=D.placement.filter(x=>x.l===l.id&&x.t==='قبلي').slice(-1)[0],q=D.placement.filter(x=>x.l===l.id&&x.t==='بعدي').slice(-1)[0],a=p?avg(p.ar,p.fr,p.ma):0,b=q?avg(q.ar,q.fr,q.ma):0;rows.push([l.name,a,b,b-a,b<50?'دعم مكثف':b<75?'دعم ممتد':'استمرار'])});downloadFile('تقرير_الريادة.csv',csv(rows),'text/csv;charset=utf-8')}
function backup(){downloadFile('riyadah-v8-backup.json',JSON.stringify(D,null,2),'application/json')}function restore(input){let r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();alert('تم الاسترجاع')}catch(e){alert('ملف غير صالح')}};r.readAsText(input.files[0])}
async function generateMap(input){let f=input.files[0];if(!f)return;$('mind').innerHTML='<p>جارٍ تحليل الدرس…</p>';try{let z=await JSZip.loadAsync(f),files=Object.keys(z.files).filter(x=>/^ppt\/slides\/slide\d+\.xml$/.test(x)).sort((a,b)=>+a.match(/slide(\d+)/)[1]-+b.match(/slide(\d+)/)[1]);let title=f.name.replace(/\.pptx$/i,'');let out='<div class="node root">'+esc(title)+'</div><ul>';for(let file of files){let xml=await z.file(file).async('text'),doc=new DOMParser().parseFromString(xml,'text/xml'),txt=[...doc.getElementsByTagNameNS('*','t')].map(x=>x.textContent.trim()).filter(Boolean);if(txt.length)out+='<li><span class="node"><b>'+esc(txt[0])+'</b></span><ul>'+txt.slice(1).map(t=>'<li><span class="node">'+esc(t)+'</span></li>').join('')+'</ul></li>'}out+='</ul>';mapHtml=out;$('mind').innerHTML=out;D.maps.push({date:new Date().toISOString(),file:f.name,slides:files.length});localStorage.setItem(KEY,JSON.stringify(D))}catch(e){$('mind').innerHTML='<p class="pill bad">تعذر قراءة الملف. تأكد أنه PPTX صالح.</p>'}}
function downloadMap(){if(!mapHtml)return alert('ارفع درس PPTX أولاً');downloadFile('خريطة_ذهنية.html','<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><style>body{font-family:Tahoma;padding:30px}.node{display:inline-block;padding:8px;margin:4px;border:1px solid #9bb1f3;background:#edf2ff;border-radius:8px}li{margin:10px}</style>'+mapHtml+'</html>','text/html;charset=utf-8')}function printMap(){if(!mapHtml)return alert('أنشئ الخريطة أولاً');let w=window.open('','_blank');w.document.write('<html lang="ar" dir="rtl"><body style="font-family:Tahoma;padding:30px">'+mapHtml+'</body></html>');w.document.close();w.print()}
render();
