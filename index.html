nt-weight:800}</style></head><body><div class="gate"><div class="card"><div class="brand"><div class="logo">ر</div><div><h1>رَوّاد V15 Ultimate</h1><div class="muted">منصة القيادة التربوية الذكية</div></div></div><div class="tabs"><button id="loginTab" class="tab active">تسجيل الدخول</button><button id="signupTab" class="tab">طلب حساب</button></div><div id="loginPane"><div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">🔐 تسجيل الدخول</button></div><div id="signupPane" style="display:none"><div class="field"><label>الاسم الكامل</label><input id="signupName" autocomplete="name"></div><div class="field"><label>البريد الإلكتروني</label><input id="signupEmail" type="email" autocomplete="email"></div><div class="field"><label>كلمة المرور</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل"></div><div class="field"><label>الصفة المطلوبة</label><select id="signupRole"><option value="teacher">أستاذ(ة)</option><option value="inspector">مفتش(ة)</option></select></div><div class="field"><label>المؤسسة / المديرية</label><input id="signupSchool"></div><button id="signupBtn" class="btn primary">👤 إرسال طلب الحساب</button><div class="small muted">سيحتاج الحساب إلى التفعيل من المدير حسب الصفة المطلوبة.</div></div><div id="error" class="error"></div><div id="success" class="success"></div><div id="loading" class="loading">جاري الاتصال…</div><div class="links"><a class="link" href="/admin.html">لوحة المدير</a><a class="link" href="/inspector.html">لوحة المفتش</a></div><div class="small muted">حساب مستقل لكل مستخدم، مع حفظ الجلسة للولوج من الهاتف أو الحاسوب.</div></div></div><script>
const URL='https://bnqbavlkvrpcbhqxctda.supabase.co',KEY='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q',sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);const sleep=ms=>new Promise(r=>setTimeout(r,ms));function msg(id,t){$(id).textContent=t;$(id).style.display=t?'block':'none'}function busy(v){$('loading').style.display=v?'block':'none';$('loginBtn').disabled=v;$('signupBtn').disabled=v}function pane(login){$('loginPane').style.display=login?'block':'none';$('signupPane').style.display=login?'none':'block';$('loginTab').classList.toggle('active',login);$('signupTab').classList.toggle('active',!login);msg('error','');msg('success','')}$('loginTab').onclick=()=>pane(true);$('signupTab').onclick=()=>pane(false);
