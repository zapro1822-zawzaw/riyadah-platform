<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2038">
<title>رَوّاد — الولوج الآمن</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:radial-gradient(circle at 20% 10%,#1f5f9f,#0b2038 55%,#061522);min-height:100vh;color:#17212b}.gate{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(480px,100%);background:#fff;border-radius:26px;padding:28px;box-shadow:0 25px 80px #0008}.brand{display:flex;align-items:center;gap:13px;margin-bottom:20px}.logo{width:58px;height:58px;border-radius:18px;background:#1769d3;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:1000}.brand h1{margin:0;font-size:25px}.muted{color:#66788a}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field input,.field select{width:100%;padding:12px;border:1px solid #cbd5df;border-radius:11px;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:12px;font:inherit;font-weight:850;cursor:pointer}.primary{background:#1769d3;color:#fff}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.tab{padding:10px;border:0;border-radius:10px;background:#f1f5f9;font-weight:800;cursor:pointer}.tab.active{background:#1769d3;color:#fff}.error{display:none;background:#fff0f0;color:#9b2020;padding:10px;border-radius:11px;margin:10px 0;font-weight:700}.success{display:none;background:#e7f7f0;color:#08734f;padding:10px;border-radius:11px;margin:10px 0;font-weight:700}.small{font-size:12px;line-height:1.7;margin-top:13px}.loading{display:none;text-align:center;padding:10px;color:#1558a0}.appframe{position:fixed;inset:0;border:0;width:100%;height:100%;background:#f3f6fa}.sync{position:fixed;right:14px;bottom:14px;background:#102a43;color:#fff;border-radius:999px;padding:7px 11px;font-size:12px;display:none;z-index:20}.sync.ok{background:#08734f}.sync.err{background:#9b2020}
</style>
</head>
<body>
<div id="gate" class="gate"><div class="card">
<div class="brand"><div class="logo">ر</div><div><h1>رَوّاد V15 Ultimate</h1><div class="muted">منصة القيادة التربوية الذكية</div></div></div>
<div class="tabs"><button id="loginTab" class="tab active">تسجيل الدخول</button><button id="signupTab" class="tab">إنشاء حساب</button></div>
<div id="loginPane">
<div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="email" placeholder="example@email.com"></div>
<div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div>
<button id="loginBtn" class="btn primary">🔐 تسجيل الدخول</button>
</div>
<div id="signupPane" style="display:none">
<div class="field"><label>الاسم الكامل</label><input id="signupName" autocomplete="name" placeholder="الاسم والنسب"></div>
<div class="field"><label>البريد الإلكتروني</label><input id="signupEmail" type="email" autocomplete="email" placeholder="example@email.com"></div>
<div class="field"><label>كلمة المرور</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل"></div>
<div class="field"><label>الصفة</label><select id="signupRole"><option value="teacher">أستاذ(ة)</option><option value="inspector">مفتش(ة)</option></select></div>
<div class="field"><label>المؤسسة / المديرية (اختياري)</label><input id="signupSchool" placeholder="اسم المؤسسة أو المديرية"></div>
<button id="signupBtn" class="btn primary">👤 إنشاء الحساب</button>
</div>
<div id="error" class="error"></div><div id="success" class="success"></div><div id="loading" class="loading">جاري الاتصال بالخادم…</div>
<div class="small muted">حسابك مستقل ومحفوظ في Supabase، وبيانات المنصة مرتبطة بحسابك السحابي. يمكنك الولوج من أي هاتف أو حاسوب.</div>
</div></div>
<div id="sync" class="sync">☁️ جاري المزامنة…</div>
<script>
const SUPABASE_URL='https://bnqbavlkvrpcbhqxctda.supabase.co';
const SUPABASE_KEY='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const DATA_KEY='riyadah_v14_ultimate';
const AUTH_KEY='riyadah_v15_auth_v1';
const SESSION_KEY='riyadah_v15_session_v1';
const $=id=>document.getElementById(id);
let currentUser=null,currentProfile=null,frame=null,syncTimer=null,lastCloudHash='';
function msg(id,text){$(id).textContent=text;$(id).style.display=text?'block':'none'}
function busy(v){$('loading').style.display=v?'block':'none';$('loginBtn').disabled=v;$('signupBtn').disabled=v}
function pane(mode){const login=mode==='login';$('loginPane').style.display=login?'block':'none';$('signupPane').style.display=login?'none':'block';$('loginTab').classList.toggle('active',login);$('signupTab').classList.toggle('active',!login);msg('error','');msg('success','')}
$('loginTab').onclick=()=>pane('login');$('signupTab').onclick=()=>pane('signup');
function syncBadge(text,cls=''){const e=$('sync');e.textContent=text;e.className='sync '+cls;e.style.display='block';clearTimeout(window.__syncHide);window.__syncHide=setTimeout(()=>e.style.display='none',1600)}
async function hashData(v){const b=new TextEncoder().encode(v);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function getCloud(){if(!currentUser)return null;const {data,error}=await sb.from('user_data').select('data,updated_at').eq('user_id',currentUser.id).maybeSingle();if(error)throw error;return data?.data||null}
async function pushCloud(data){if(!currentUser)return;const json=JSON.stringify(data);const h=await hashData(json);if(h===lastCloudHash)return;const {error}=await sb.from('user_data').upsert({user_id:currentUser.id,data,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;lastCloudHash=h;syncBadge('☁️ تمت المزامنة','ok')}
function iframeLocal(){try{return frame?.contentWindow?.localStorage?.getItem(DATA_KEY)}catch{return null}}
function setIframeLocal(data){try{const w=frame.contentWindow;w.localStorage.setItem(DATA_KEY,JSON.stringify(data));w.localStorage.removeItem(AUTH_KEY);w.sessionStorage.setItem(SESSION_KEY,JSON.stringify({username:currentProfile?.full_name||currentUser?.email||'مستخدم',expires:Date.now()+86400000,role:currentProfile?.role||'teacher',cloudUserId:currentUser.id}));}catch(e){console.error(e)}}
function applyRole(){if(!frame?.contentDocument)return;const role=currentProfile?.role||'teacher';const nav=[...frame.contentDocument.querySelectorAll('#nav button[data-v]')];if(role==='teacher'){nav.filter(b=>b.dataset.v==='settings').forEach(b=>b.style.display='');}
if(role==='inspector'){nav.forEach(b=>{b.style.display=['dashboard','classes','students','assess','support','tracking','math','fluency','mindmap','lesson','reports','inspector','settings'].includes(b.dataset.v)?'':'none'});}
if(role==='admin'){nav.forEach(b=>b.style.display='');}
const pill=frame.contentDocument.querySelector('#userPill');if(pill)pill.innerHTML=`<span class="badge ok">👤 ${currentProfile?.full_name||currentUser?.email||'مستخدم'} — ${role==='admin'?'مدير':role==='inspector'?'مفتش':'أستاذ'}</span>`;
const logoutBtn=[...frame.contentDocument.querySelectorAll('button')].find(b=>b.textContent.includes('خروج'));if(logoutBtn){logoutBtn.onclick=()=>sb.auth.signOut();logoutBtn.setAttribute('title','تسجيل الخروج من الحساب السحابي')}
}
async function startCloudSync(){clearInterval(syncTimer);syncTimer=setInterval(async()=>{if(!currentUser||!frame?.contentDocument)return;try{const raw=iframeLocal();if(!raw)return;const h=await hashData(raw);if(h!==lastCloudHash)await pushCloud(JSON.parse(raw));}catch(e){console.error(e);syncBadge('⚠️ تعذر مزامنة البيانات','err')}},2000)}
async function openApp(session){if(!session){$('gate').style.display='grid';return}busy(true);try{currentUser=session.user;const {data:profile,error:pe}=await sb.from('profiles').select('id,full_name,role,school_name,is_active').eq('id',session.user.id).maybeSingle();if(pe)throw pe;if(profile&&!profile.is_active){await sb.auth.signOut();throw Error('هذا الحساب غير مفعل حالياً.')}currentProfile=profile||{id:session.user.id,full_name:session.user.email,role:'teacher'};let cloud=await getCloud();if(!cloud){cloud={school:{name:currentProfile.school_name||'',teacher:currentProfile.full_name||'',year:'2026/2027'},levels:[],classes:[],students:[],assess:[],tracking:[],math:{},fluency:[],groups:[],inspectorNotes:'',links:{classroom:'',canva:'',massar:''}};await pushCloud(cloud)}else lastCloudHash=await hashData(JSON.stringify(cloud));frame=document.createElement('iframe');frame.className='appframe';frame.id='appFrame';frame.src='/app.html';frame.onload=async()=>{setIframeLocal(cloud);frame.contentWindow.location.reload();setTimeout(()=>{applyRole();startCloudSync()},900)};document.body.appendChild(frame);$('gate').style.display='none';}catch(e){console.error(e);msg('error',e.message||'تعذر تحميل الحساب')}finally{busy(false)}}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session)openApp(session)}
$('loginBtn').onclick=async()=>{msg('error','');msg('success','');const email=$('loginEmail').value.trim(),password=$('loginPassword').value;if(!email||!password)return msg('error','أدخل البريد الإلكتروني وكلمة المرور.');busy(true);const {data,error}=await sb.auth.signInWithPassword({email,password});busy(false);if(error)return msg('error','تعذر تسجيل الدخول: '+error.message);await openApp(data.session)};
$('signupBtn').onclick=async()=>{msg('error','');msg('success','');const name=$('signupName').value.trim(),email=$('signupEmail').value.trim(),password=$('signupPassword').value,role=$('signupRole').value,school=$('signupSchool').value.trim();if(!name||!email||password.length<8)return msg('error','أكمل البيانات وتأكد أن كلمة المرور 8 أحرف على الأقل.');busy(true);const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,role,school_name:school}}});busy(false);if(error)return msg('error','تعذر إنشاء الحساب: '+error.message);if(data.session){msg('success','تم إنشاء الحساب. جاري الدخول…');await openApp(data.session)}else msg('success','تم إنشاء الحساب. افتح رسالة التأكيد في بريدك الإلكتروني ثم سجّل الدخول.');};
$('loginPassword').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('signupPassword').onkeydown=e=>{if(e.key==='Enter')$('signupBtn').click()};
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){clearInterval(syncTimer);syncTimer=null;currentUser=null;currentProfile=null;if(frame)frame.remove();frame=null;$('gate').style.display='grid';$('loginPassword').value=''}});boot();
</script>
</body></html>
