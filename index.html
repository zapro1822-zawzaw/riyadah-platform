iv class="tabs"><button id="loginTab" class="tab active">تسجيل الدخول</button><button id="signupTab" class="tab">طلب حساب</button></div><div id="loginPane"><div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">🔐 تسجيل الدخول</button></div><div id="signupPane" style="display:none"><div class="field"><label>الاسم الكامل</label><input id="signupName" autocomplete="name"></div><div class="field"><label>البريد الإلكتروني</label><input id="signupEmail" type="email" autocomplete="email"></div><div class="field"><label>كلمة المرور</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل"></div><div class="field"><label>الصفة المطلوبة</label><select id="signupRole"><option value="teacher">أستاذ(ة)</option><option value="inspector">مفتش(ة)</option><option value="parent">ولي أمر</option></select></div><div class="field"><label>المؤسسة</label><input id="signupSchool"></div><button id="signupBtn" class="btn primary">👤 إرسال طلب الحساب</button></div><div id="error" class="error"></div><div id="success" class="success"></div><div id="loading" class="loading">جاري الاتصال…</div><div class="small muted">رَوّاد V16 يعمل بالسحابة ويعرض الواجهة حسب صلاحية الحساب.</div></div></div><script>const U='https://bnqbavlkvrpcbhqxctda.supabase.co',K='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q',sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);function msg(id,t){$(id).textContent=t;$(id).style.display=t?'block':'none'}function busy(v){$('loading').style.display=v?'block':'none';$('loginBtn').disabled=v;$('signupBtn').disabled=v}function pane(login){$('loginPane').style.display=login?'block':'none';$('signupPane').style.display=login?'none':'block';$('loginTab').classList.toggle('active',login);$('signupTab').classList.toggle('active',!login);msg('error','');msg('success','')}$('loginTab').onclick=()=>pane(true);$('signupTab').onclick=()=>pane(false);async function timeout(p,ms){let t;return Promise.race([p,new Promise((_,reject)=>t=setTimeout(()=>reject(new Error('انتهت مهلة الاتصال.')),ms))]).finally(()=>clearTimeout(t))}async function route(session){if(!session?.user)throw Error('لم تنشأ جلسة.');const u=session.user;let p=null;try{p=(await timeout(sb.from('profiles').select('role,is_active').eq('id',u.id).maybeSingle(),7000)).data||null}catch(e){}let role=p?.role||u.user_metadata?.requested_role;if(u.email?.toLowerCase()==='zapro1822@gmail.com')role='admin';if(!role)throw Error('تم الدخول لكن الحساب لم يحصل بعد على صلاحية.');if(p?.is_active===false){await sb.auth.signOut({scope:'local'});throw Error('الحساب غير مفعل.')}busy(false);location.replace('/v16.html')}$('loginBtn').onclick=async()=>{const email=$('loginEmail').value.trim().toLowerCase(),password=$('loginPassword').value;if(!email||!password)return msg('error','أدخل البريد وكلمة المرور.');busy(true);try{const r=await timeout(sb.auth.signInWithPassword({email,password}),15000);if(r.error)throw r.error;await route(r.data.session)}catch(e){busy(false);msg('error','تعذر تسجيل الدخول: '+(e?.message||'خطأ غير معروف'))}};$('signupBtn').onclick=async()=>{const name=$('signupName').value.trim(),email=$('signupEmail').value.trim().toLowerCase(),password=$('signupPassword').value,role=$('signupRole').value,school=$('signupSchool').value.trim();if(!name||!email||password.length<8)return msg('error','أكمل البيانات وكلمة المرور 8 أحرف على الأقل.');busy(true);try{const r=await timeout(sb.auth.signUp({email,password,options:{data:{full_name:name,requested_role:role,school_name:school}}}),15000);if(r.error)throw r.error;if(r.data.session)await route(r.data.session);else{busy(false);msg('success','تم إرسال الطلب. تحقق من البريد إذا كان تأكيد البريد مفعلاً.')}}catch(e){busy(false);msg('error','تعذر إنشاء الحساب: '+(e?.message||'خطأ غير معروف'))}};$('loginPassword').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};(async()=>{try{const r=await timeout(sb.auth.getSession(),7000);if(r.data?.session)await route(r.data.session)}catch(e){}})();</script></body></html>
