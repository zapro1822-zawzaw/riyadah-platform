<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رَوّاد V13 Ultimate</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#68738a;--line:#e4e8f0;--accent:#3157d5;--accent2:#6d4ee8;--good:#1c9b65;--warn:#d18b00;--bad:#d94343}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Arabic",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:260px;background:#111827;color:#fff;padding:20px;position:sticky;top:0;height:100vh}.brand{font-size:24px;font-weight:800;margin-bottom:4px}.version{font-size:12px;color:#aab4c8;margin-bottom:22px}.nav button{display:block;width:100%;text-align:right;background:transparent;color:#dce3f0;padding:12px;border-radius:10px;margin:5px 0}.nav button.active,.nav button:hover{background:#26334d}.main{flex:1;padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.title h1{margin:0;font-size:27px}.title p{margin:5px 0;color:var(--muted)}.btn{padding:10px 14px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700}.btn.alt{background:#eef1fb;color:#24345f}.btn.danger{background:#fff0f0;color:#b42323}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 14px #1c2b4d0b}.stat .n{font-size:28px;font-weight:800}.muted{color:var(--muted);font-size:13px}.section{margin-top:18px}.section h2{font-size:19px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:6px;min-width:180px;flex:1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--accent)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:right;font-size:13px}th{background:#f7f8fc}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700}.good{background:#e7f7ef;color:#08794b}.warn{background:#fff5d9;color:#8a5b00}.bad{background:#ffe9e9;color:#a92323}.hide{display:none}.hero{padding:22px;border-radius:18px;background:linear-gradient(135deg,#182c63,#4932a7);color:#fff}.hero h2{margin:0 0 8px}.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fbfcff;padding:18px;min-height:360px}.mind{display:flex;flex-direction:column;align-items:center;gap:15px;min-width:850px}.rootnode{padding:14px 24px;border-radius:50px;background:#243c91;color:white;font-weight:800;box-shadow:0 8px 25px #243c9130}.branches{display:flex;justify-content:center;gap:18px;align-items:flex-start;width:100%}.branch{width:220px}.node{background:white;border:2px solid #cfd7ef;border-radius:13px;padding:11px;text-align:center;font-weight:700;position:relative}.sub{margin-top:8px;padding:8px;border:1px dashed #cdd3df;border-radius:9px;background:#fff;color:#4d5870;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.notice{padding:12px;border-radius:10px;background:#f0f4ff;color:#29428d}.empty{padding:35px;text-align:center;color:var(--muted)}.check{display:flex;gap:8px;align-items:center}.progress{height:9px;background:#edf0f6;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}@media(max-width:900px){.side{width:78px;padding:12px}.brand{font-size:0}.brand:after{content:"ر";font-size:25px}.version,.nav span{display:none}.nav button{text-align:center}.main{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.field{min-width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand">رَوّاد</div><div class="version">V13 Ultimate • School Riyada</div>
<div class="nav" id="nav"></div>
</aside>
<main class="main">
<div class="top"><div class="title"><h1 id="pageTitle">لوحة القيادة</h1><p>نظام قيادة تربوية للدعم والتتبع والتقويم</p></div><div class="row"><button class="btn alt" onclick="backup()">نسخة احتياطية</button><button class="btn" onclick="window.print()">طباعة</button></div></div>
<div id="view"></div>
</main></div>
<script>
const KEY='riyadah_v13';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{levels:['الأول','الثاني','الثالث','الرابع','الخامس','السادس'],classes:[],learners:[],assessments:[],maps:[],skills:{math:['اللبنة 1','اللبنة 2','اللبنة 3','اللبنة 4','اللبنة 5']},settings:{school:'',teacher:'',year:''}};
const navItems=[['dash','لوحة القيادة'],['learners','المتعلمون'],['levels','المستويات والأقسام'],['assessment','الرائز والتشخيص'],['support','الدعم وTaRL'],['math','شبكات الرياضيات'],['fluency','الطلاقة والتتبع'],['mind','الخريطة الذهنية'],['reports','التقارير'],['settings','الإعدادات']];
let page='dash';
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function initNav(){document.getElementById('nav').innerHTML=navItems.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span></button>`).join('');}
function go(p){page=p;document.getElementById('pageTitle').textContent=navItems.find(x=>x[0]===p)[1];initNav();render();}
function render(){let v=document.getElementById('view');v.innerHTML='';({dash,learners,levels,assessment,support,math,fluency,mind,reports,settings}[page])(v);}
function dash(v){
let total=db.learners.length,ass=db.assessments.length,levels=db.levels.length;
v.innerHTML=`<div class="hero"><h2>مرحباً بك في رَوّاد V13 Ultimate</h2><div>منصة واحدة لتدبير المتعلمين، التشخيص، الدعم، التتبع، والخريطة الذهنية.</div></div>
<div class="grid section">${[['المتعلمون',total],['المستويات',levels],['عمليات التقويم',ass],['المجموعات',groupCount()]].map(x=>`<div class="card stat"><div class="muted">${x[0]}</div><div class="n">${x[1]}</div></div>`).join('')}</div>
<div class="grid section"><div class="card" style="grid-column:span 2"><h2>🎯 أولويات اليوم</h2>${priorities()}</div><div class="card" style="grid-column:span 2"><h2>📊 نظرة سريعة</h2>${progressSummary()}</div></div>`;
}
function priorities(){if(!db.learners.length)return '<div class="empty">أضف المتعلمين ونتائج الرائز ليظهر التشخيص الذكي هنا.</div>';let weak=weakLearners();return weak.length?weak.slice(0,6).map(x=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)">🔴 ${esc(x.name)} — يحتاج دعماً (${x.score}% تحكم)</div>`).join(''):'<div class="notice">🟢 لا توجد تعثرات مسجلة حالياً.</div>'}
function progressSummary(){let a=db.assessments;if(!a.length)return '<div class="empty">لا توجد نتائج بعد.</div>';let avg=Math.round(a.reduce((s,x)=>s+(+x.control||0),0)/a.length);return `<div class="muted">متوسط التحكم المسجل</div><div style="font-size:34px;font-weight:800">${avg}%</div><div class="progress"><i style="width:${avg}%"></i></div>`}
function groupCount(){return new Set(db.learners.map(x=>x.group).filter(Boolean)).size}
function learners(v){v.innerHTML=`<div class="card"><div class="row"><div class="field"><label>اسم المتعلم(ة)</label><input id="lname"></div><div class="field"><label>المستوى</label><select id="llevel">${db.levels.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>الفوج</label><input id="lclass"></div><button class="btn" onclick="addLearner()">إضافة</button></div></div>
<div class="card section"><h2>ملف المتعلمين</h2><table><thead><tr><th>#</th><th>الاسم والنسب</th><th>المستوى</th><th>الفوج</th><th>المجموعة</th><th>الإجراء</th></tr></thead><tbody>${db.learners.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.level)}</td><td>${esc(x.cls)}</td><td>${x.group?`<span class="pill ${x.group==='A'?'bad':x.group==='B'?'warn':'good'}">${x.group}</span>`:'—'}</td><td><button class="btn danger" onclick="delLearner(${i})">حذف</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا يوجد متعلمون.</td></tr>'}</tbody></table></div>`}
function addLearner(){let name=document.getElementById('lname').value.trim();if(!name)return alert('اكتب اسم المتعلم');db.learners.push({id:Date.now(),name,level:document.getElementById('llevel').value,cls:document.getElementById('lclass').value,group:''});save();render()}
function delLearner(i){if(confirm('حذف المتعلم؟')){db.learners.splice(i,1);save();render()}}
function levels(v){v.innerHTML=`<div class="grid"><div class="card" style="grid-column:span 2"><h2>إضافة مستوى</h2><div class="row"><input id="newlevel" placeholder="مثلاً: المستوى السابع / CE2" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:9px"><button class="btn" onclick="addLevel()">إضافة</button></div><p class="muted">يمكنك إضافة أي مستوى دون تقييد المنصة بمستويات ثابتة.</p></div><div class="card" style="grid-column:span 2"><h2>إضافة قسم</h2><div class="row"><input id="cname" placeholder="اسم القسم" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:9px"><select id="clevel" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:9px">${db.levels.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button class="btn" onclick="addClass()">إضافة</button></div></div></div>
<div class="card section"><h2>المستويات</h2>${db.levels.map((x,i)=>`<span class="pill" style="margin:4px;background:#eef1fb;color:#334">${esc(x)} ${i>5?`<button onclick="db.levels.splice(${i},1);save();render()" style="background:none">×</button>`:''}</span>`).join('')}</div>
<div class="card section"><h2>الأقسام</h2><table><tr><th>القسم</th><th>المستوى</th></tr>${db.classes.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.level)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">لا توجد أقسام.</td></tr>'}</table></div>`}
function addLevel(){let x=document.getElementById('newlevel').value.trim();if(x&&!db.levels.includes(x)){db.levels.push(x);save();render()}}
function addClass(){let n=document.getElementById('cname').value.trim();if(n){db.classes.push({name:n,level:document.getElementById('clevel').value});save();render()}}
function assessment(v){let names=db.learners;v.innerHTML=`<div class="card"><h2>إدخال نتائج الرائز — المستوى الخامس وما بعده</h2><div class="notice">الشبكة الرسمية التي اعتمدناها تتضمن الاسم والنسب، مستوى الموضعة، الفهم، الفرنسية/Compréhension، الرياضيات/مسألة، ومستوى الأداء A أو C. هنا يتم إدخال البيانات رقمياً مع الحفاظ على هذه المفاهيم.</div><div class="row section"><div class="field"><label>المتعلم</label><select id="aname">${names.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>نوع الاختبار</label><select id="atype"><option>رائز الموضعة</option><option>الرائز القبلي</option><option>الرائز البعدي</option><option>تقويم تكويني</option></select></div><div class="field"><label>المادة</label><select id="asub"><option>اللغة العربية</option><option>اللغة الفرنسية</option><option>الرياضيات</option></select></div><div class="field"><label>مستوى التحكم %</label><input id="acontrol" type="number" min="0" max="100"></div><div class="field"><label>مستوى الأداء</label><select id="aperf"><option>A</option><option>C</option></select></div><button class="btn" onclick="addAssessment()">حفظ</button></div></div>
<div class="card section"><h2>سجل النتائج</h2><table><tr><th>المتعلم</th><th>الاختبار</th><th>المادة</th><th>التحكم</th><th>A/C</th></tr>${db.assessments.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td>${esc(x.subject)}</td><td>${x.control}%</td><td>${x.perf}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد نتائج.</td></tr>'}</table></div>`}
function addAssessment(){let id=+document.getElementById('aname').value;let l=db.learners.find(x=>x.id===id);if(!l)return alert('أضف متعلماً أولاً');let control=Math.max(0,Math.min(100,+document.getElementById('acontrol').value||0));db.assessments.push({learner:id,name:l.name,type:document.getElementById('atype').value,subject:document.getElementById('asub').value,control,perf:document.getElementById('aperf').value,date:new Date().toISOString()});save();autoGroups();render()}
function autoGroups(){db.learners.forEach(l=>{let a=db.assessments.filter(x=>x.learner===l.id);if(!a.length)return;let s=a.reduce((q,x)=>q+x.control,0)/a.length;l.group=s<50?'A':s<75?'B':'C'})}
function weakLearners(){return db.learners.map(l=>{let a=db.assessments.filter(x=>x.learner===l.id);let s=a.length?a.reduce((q,x)=>q+x.control,0)/a.length:100;return{name:l.name,score:Math.round(s)}}).filter(x=>x.score<70).sort((a,b)=>a.score-b.score)}
function support(v){let groups={A:[],B:[],C:[]};db.learners.forEach(l=>{if(l.group)groups[l.group].push(l)});v.innerHTML=`<div class="grid">${Object.entries(groups).map(([g,arr])=>`<div class="card"><h2>المجموعة ${g}</h2><div class="muted">${g==='A'?'استدراك التعثرات':g==='B'?'تثبيت المكتسبات':'تعميق وتحدي'}</div><h3>${arr.length} متعلم</h3>${arr.map(x=>`<div style="padding:7px;border-bottom:1px solid var(--line)">${esc(x.name)}</div>`).join('')||'<div class="empty">لا يوجد متعلمون.</div>'}</div>`).join('')}</div><div class="card section"><h2>دورة الدعم الذكية</h2><div class="row">${['تشخيص','تجميع','خطة دعم','نشاط علاجي','تتبع','تقويم بعدي','إعادة التجميع'].map((x,i)=>`<div class="card" style="flex:1;min-width:130px;text-align:center"><b>${i+1}</b><br>${x}</div>`).join('')}</div></div>`}
function math(v){let rows=db.learners;v.innerHTML=`<div class="card"><h2>شبكة تتبع تحقق أهداف مراحل دورة الدعم TaRL للرياضيات</h2><div class="notice">تم اعتماد بنية الشبكات الخاصة بالمستوى الخامس: الرائز البدئي/البعدي، اللبنة 2، اللبنة 3، اللبنة 4، اللبنة 5، الملاحظات، ونسبة التحكم في اللبنة. ويمكن تعديل اللبنات من الإعدادات.</div><div class="row section"><div class="field"><label>المدرسة</label><input id="mschool" value="${esc(db.settings.school)}"></div><div class="field"><label>الأستاذ</label><input id="mteacher" value="${esc(db.settings.teacher)}"></div><div class="field"><label>الفوج</label><input id="mgroup"></div></div><table><tr><th>#</th><th>الاسم والنسب</th><th>الرائز البدئي</th>${db.skills.math.map(x=>`<th>${esc(x)}</th>`).join('')}<th>الرائز البعدي</th><th>ملاحظات</th></tr>${rows.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.name)}</td><td><input type="number" min="0" max="100" data-m="${l.id}-pre" style="width:65px"></td>${db.skills.math.map((x,j)=>`<td><input type="number" min="0" max="100" data-m="${l.id}-${j}" style="width:65px"></td>`).join('')}<td><input type="number" min="0" max="100" data-m="${l.id}-post" style="width:65px"></td><td><input data-m="${l.id}-note" style="width:110px"></td></tr>`).join('')||'<tr><td colspan="9" class="empty">أضف المتعلمين أولاً.</td></tr>'}</table><button class="btn section" onclick="saveMath()">حفظ الشبكة وتصدير CSV</button></div>`}
function saveMath(){db.settings.school=document.getElementById('mschool').value;db.settings.teacher=document.getElementById('mteacher').value;save();let headers=['الرقم','الاسم والنسب','الرائز البدئي',...db.skills.math,'الرائز البعدي','ملاحظات'];let csv='\\ufeff'+headers.join(';')+'\\n'+db.learners.map((l,i)=>[i+1,l.name,...['pre',0,1,2,3,4,'post'].map(k=>document.querySelector(`[data-m="${l.id}-${k}"]`)?.value||''),document.querySelector(`[data-m="${l.id}-note"]`)?.value||''].join(';')).join('\\n');downloadBlob(csv,'شبكة-الرياضيات-م5.csv','text/csv;charset=utf-8');alert('تم حفظ الشبكة وتصديرها.')}
function fluency(v){v.innerHTML=`<div class="card"><h2>شبكات الطلاقة والتتبع</h2><div class="row"><div class="field"><label>المتعلم</label><select id="fname">${db.learners.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>عدد الكلمات/الوحدات الصحيحة</label><input id="fwords" type="number"></div><div class="field"><label>الزمن بالثواني</label><input id="ftime" type="number"></div><div class="field"><label>الأخطاء</label><input id="ferr" type="number"></div><button class="btn" onclick="addFluency()">حفظ</button></div></div><div class="card section"><table><tr><th>المتعلم</th><th>الصحيح</th><th>الزمن</th><th>الأخطاء</th><th>المؤشر</th></tr>${(db.fluency||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.words}</td><td>${x.time}s</td><td>${x.err}</td><td>${Math.max(0,x.words-x.err)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد قياسات.</td></tr>'}</table></div>`}
function addFluency(){db.fluency=db.fluency||[];db.fluency.push({name:document.getElementById('fname').value,words:+document.getElementById('fwords').value||0,time:+document.getElementById('ftime').value||0,err:+document.getElementById('ferr').value||0});save();render()}
async function mind(v){v.innerHTML=`<div class="card"><h2>🗺️ مولد الخريطة الذهنية التفاعلية</h2><div class="notice">حمّل ملف PPTX. سيحاول المحرك استخراج عنوان الدرس، العناوين الرئيسية والفرعية حسب ترتيب الشرائح وبروز النص، ثم يبني خريطة مختصرة. لا تتم ترجمة النص؛ لغة الملف هي لغة الخريطة والتصدير.</div><div class="toolbar"><input id="pptx" type="file" accept=".pptx"><button class="btn" onclick="makeMap()">توليد الخريطة تلقائياً</button><button class="btn alt" onclick="exportMap('svg')">SVG</button><button class="btn alt" onclick="exportMap('html')">HTML</button><button class="btn alt" onclick="exportMap('txt')">TXT</button></div><div id="mapArea" class="mapwrap"><div class="empty">لم يتم تحميل درس بعد.</div></div></div>`}
async function makeMap(){let f=document.getElementById('pptx').files[0];if(!f)return alert('اختر ملف PPTX أولاً');let zip=await JSZip.loadAsync(await f.arrayBuffer());let files=Object.keys(zip.files).filter(x=>/^ppt\\/slides\\/slide\\d+\\.xml$/.test(x));files.sort((a,b)=>parseInt(a.match(/\\d+/)[0])-parseInt(b.match(/\\d+/)[0]));let slides=[];for(let p of files){let xml=await zip.files[p].async('text');let doc=new DOMParser().parseFromString(xml,'application/xml');let paras=[...doc.getElementsByTagName('a:p')].map(p=>({text:[...p.getElementsByTagName('a:t')].map(t=>t.textContent).join('').trim(),level:parseInt(p.getAttribute('lvl')||'0'),size:Math.max(...[...p.getElementsByTagName('a:rPr')].map(r=>parseInt(r.getAttribute('sz')||'0')),0)})).filter(x=>x.text);slides.push(paras)}let title=slides.flat().find(x=>x.size>=3000)?.text||f.name.replace(/\\.pptx$/i,'');let all=slides.flat();let candidates=all.filter(x=>x.text!==title);let main=[];for(let i=0;i<candidates.length;i++){let x=candidates[i];if(x.level<=0 || x.size>=2200){if(!main.some(m=>m.text===x.text))main.push({text:shorten(x.text,55),subs:[]});}else if(main.length){let s=shorten(x.text,70);if(s&&!main[main.length-1].subs.includes(s))main[main.length-1].subs.push(s)}}if(!main.length)main=[{text:'محتوى الدرس',subs:candidates.slice(0,8).map(x=>shorten(x.text,60))}];main=main.slice(0,8).map(x=>({...x,subs:x.subs.slice(0,5)}));db.maps.push({name:f.name,title,main,lang:detectLang(title+' '+all.map(x=>x.text).join(' ')),date:new Date().toISOString()});save();renderMap(main,title)}
function shorten(s,n){s=s.replace(/\\s+/g,' ').trim();return s.length>n?s.slice(0,n).replace(/[،,:؛\\- ]+$/,'')+'…':s}
function detectLang(s){return /[\\u0600-\\u06ff]/.test(s)?'ar':/[À-ÿ]/.test(s)?'fr':'en'}
function renderMap(main,title){document.getElementById('mapArea').innerHTML=`<div class="mind" id="mindSvg"><div class="rootnode" contenteditable>${esc(title)}</div><div class="branches">${main.map((m,i)=>`<div class="branch"><div class="node" contenteditable>${esc(m.text)}</div>${m.subs.map(s=>`<div class="sub" contenteditable>${esc(s)}</div>`).join('')}</div>`).join('')}</div></div>`}
function currentMap(){let x=db.maps.at(-1);return x}
function exportMap(type){let m=currentMap();if(!m)return alert('ولّد خريطة أولاً');let lang=m.lang==='ar'?'ar':m.lang==='fr'?'fr':'en';let title=m.title, text=[title,...m.main.flatMap(x=>[x.text,...x.subs.map(s=>'  - '+s)])].join('\\n');if(type==='txt'){downloadBlob(new Blob([new TextEncoder().encode(text)]),'carte-mentale.txt','text/plain;charset=utf-8');return}let body=`<!doctype html><html lang="${lang}" dir="${lang==='ar'?'rtl':'ltr'}"><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial;padding:35px}h1{text-align:center}section{display:inline-block;vertical-align:top;width:220px;margin:10px;padding:14px;border:2px solid #ccd5ef;border-radius:14px}li{margin:8px}</style><h1>${esc(title)}</h1>${m.main.map(x=>`<section><h2>${esc(x.text)}</h2><ul>${x.subs.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>`).join('')}`;body+='</html>';downloadBlob(body,'carte-mentale.html','text/html;charset=utf-8');}
function reports(v){let avg=db.assessments.length?Math.round(db.assessments.reduce((s,x)=>s+x.control,0)/db.assessments.length):0;let pre=db.assessments.filter(x=>/قبلي|موضعة|بدئي/.test(x.type)).reduce((s,x)=>s+x.control,0),post=db.assessments.filter(x=>/بعدي/.test(x.type)).reduce((s,x)=>s+x.control,0);v.innerHTML=`<div class="grid"><div class="card stat"><div class="muted">متوسط التحكم</div><div class="n">${avg}%</div></div><div class="card stat"><div class="muted">متعثرون</div><div class="n">${weakLearners().length}</div></div><div class="card stat"><div class="muted">المجموعات</div><div class="n">${groupCount()}</div></div><div class="card stat"><div class="muted">خرائط منشأة</div><div class="n">${db.maps.length}</div></div></div><div class="card section"><h2>تقرير الأثر</h2><p>القبلي المسجل: ${pre?Math.round(pre/Math.max(1,db.assessments.filter(x=>/قبلي|موضعة|بدئي/.test(x.type)).length)):0}% — البعدي المسجل: ${post?Math.round(post/Math.max(1,db.assessments.filter(x=>/بعدي/.test(x.type)).length)):0}%</p><button class="btn" onclick="exportJSON()">تصدير تقرير البيانات JSON</button></div>`}
function settings(v){v.innerHTML=`<div class="card"><h2>إعدادات المؤسسة</h2><div class="row"><div class="field"><label>المؤسسة</label><input id="sschool" value="${esc(db.settings.school)}"></div><div class="field"><label>الأستاذ(ة)</label><input id="steacher" value="${esc(db.settings.teacher)}"></div><div class="field"><label>الموسم الدراسي</label><input id="syear" value="${esc(db.settings.year)}"></div><button class="btn" onclick="saveSettings()">حفظ</button></div></div><div class="card section"><h2>لبنات الرياضيات</h2><p class="muted">عدّل أسماء اللبنات بما يطابق الشبكة المعتمدة في مؤسستك.</p><div class="row">${db.skills.math.map((x,i)=>`<input id="sk${i}" value="${esc(x)}" style="padding:9px;border:1px solid var(--line);border-radius:8px;flex:1">`).join('')}<button class="btn" onclick="saveSkills()">حفظ</button></div></div><div class="card section"><h2>البيانات</h2><button class="btn alt" onclick="backup()">تصدير نسخة احتياطية</button> <label class="btn alt">استرجاع <input type="file" accept=".json" onchange="restore(this)" hidden></label> <button class="btn danger" onclick="resetDB()">مسح بيانات المؤسسة</button></div>`}
function saveSettings(){db.settings.school=document.getElementById('sschool').value;db.settings.teacher=document.getElementById('steacher').value;db.settings.year=document.getElementById('syear').value;save();alert('تم الحفظ')}
function saveSkills(){db.skills.math=db.skills.math.map((_,i)=>document.getElementById('sk'+i).value.trim()||('اللبنة '+(i+1)));save();alert('تم الحفظ')}
function backup(){downloadBlob(JSON.stringify(db,null,2),'riyadah-v13-backup.json','application/json;charset=utf-8')}
function exportJSON(){backup()}
function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();alert('تم الاسترجاع')}catch(e){alert('ملف غير صالح')}};r.readAsText(f)}
function resetDB(){if(confirm('سيتم حذف بيانات المؤسسة الحالية. هل أنت متأكد؟')){localStorage.removeItem(KEY);location.reload()}}
function downloadBlob(data,name,type){let blob=data instanceof Blob?data:new Blob([data],{type});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
initNav();render();
</script></body></html>
