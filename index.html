<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>رُوّاد V7</title>
<style>
:root{--b:#f5f7fb;--c:#fff;--t:#172033;--m:#687386;--p:#2457d6;--l:#e4e8ef}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Tahoma,Arial}.app{display:flex;min-height:100vh}.side{width:255px;background:#101a32;color:white;position:fixed;right:0;top:0;bottom:0;padding:18px}.brand{font-size:24px;font-weight:bold;margin-bottom:18px}.brand small{display:block;font-size:11px;color:#aeb9d4;margin-top:4px}.nav button{width:100%;padding:11px;margin:3px 0;border:0;border-radius:9px;text-align:right;background:transparent;color:#dce4f8;cursor:pointer}.nav button:hover,.nav .on{background:#253760;color:#fff}.main{margin-right:255px;width:calc(100% - 255px);padding:22px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.h1{font-size:26px;font-weight:bold}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:17px;margin-top:15px;box-shadow:0 8px 25px #1d35570d}.num{font-size:28px;font-weight:bold;margin-top:8px}.btn{padding:9px 13px;border:1px solid var(--l);background:#fff;border-radius:8px;cursor:pointer}.primary{background:var(--p);color:white;border-color:var(--p)}.danger{color:#b4232d;background:#fff1f2}.actions{display:flex;gap:7px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--l);text-align:right}.pill{padding:4px 8px;border-radius:99px;font-size:12px;background:#eef2f7}.good{background:#e7f7ed;color:#14733a}.bad{background:#ffe9eb;color:#a51f2a}.warn{background:#fff4dd;color:#936000}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;margin-bottom:5px;color:#4b5563}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #d7dce5;border-radius:8px}.field textarea{min-height:90px}.modal{display:none;position:fixed;inset:0;background:#07112699;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.on{display:flex}.box{background:white;max-width:720px;width:100%;max-height:90vh;overflow:auto;border-radius:15px;padding:18px}.mind{min-height:380px;background:#f8fafc;border:1px dashed #bcc8db;border-radius:12px;padding:18px}.node{display:inline-block;padding:8px 11px;border:1px solid #9fb4f8;background:#eef3ff;border-radius:9px;margin:3px}.root{font-weight:bold}.drop{padding:35px;border:2px dashed #b7c3d8;border-radius:12px;text-align:center;cursor:pointer}@media(max-width:850px){.side{display:none}.main{margin:0;width:100%;padding:12px}.grid{grid-template-columns:1fr 1fr}.g2,.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">رُوّاد<small>منصة مؤسسات الريادة</small></div><div id="nav" class="nav"></div></aside>
<main class="main"><div class="top"><div><div id="title" class="h1">لوحة القيادة</div><div class="muted">مركز قيادة الأستاذ</div></div><div class="actions"><button class="btn" onclick="backup()">💾 نسخة احتياطية</button><button class="btn" onclick="document.querySelector('#restore').click()">↩️ استرجاع</button><input id="restore" type="file" hidden accept=".json" onchange="restore(this)"></div></div><div id="view"></div></main></div>
<div id="modal" class="modal"><div class="box"><div class="actions" style="justify-content:space-between"><h2 id="mt"></h2><button class="btn" onclick="closeM()">✕</button></div><div id="mb"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const K='riyadah_v7';let D=JSON.parse(localStorage.getItem(K)||'null')||{school:{},learners:[],groups:[],assessments:[],blocks:[],tracking:[],fluency:[],support:[],inspector:[],maps:[]};let P='dashboard',mapHTML='';
const N=[['dashboard','🏠 لوحة القيادة'],['learners','👨‍🎓 المتعلمون'],['groups','👥 الأفواج وTaRL'],['assessment','📝 الروائز — الخامس'],['math','➗ لبنات الرياضيات'],['tracking','📊 شبكات التتبع'],['fluency','📖 الطلاقة'],['support','🎯 الدعم المكثف'],['mindmap','🧠 خريطة من PPTX'],['reports','📈 التقارير'],['inspector','👩‍🏫 المفتشة المؤطرة'],['settings','⚙️ المؤسسة']];
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const id=()=>crypto.randomUUID(); const save=()=>{localStorage.setItem(K,JSON.stringify(D));render()}; const name=i=>D.learners.find(x=>x.id===i)?.name||'—'; const group=i=>D.groups.find(x=>x.id===i)?.name||'غير مصنف';
function nav(){navEl.innerHTML=N.map(x=>`<button class="${P==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){P=p;render()} function avg(a,b,c){return Math.round((+a+ +b+ +c)/3)}
function control(l){let a=D.assessments.filter(x=>x.l==l.id).slice(-1)[0];return a?avg(a.a,a.f,a.m):0}
function render(){nav();title.textContent=N.find(x=>x[0]==P)[1];view.innerHTML=V[P]()}
function modal(t,b){mt.textContent=t;mb.innerHTML=b;modalEl.classList.add('on')}function closeM(){modalEl.classList.remove('on')}
const V={
dashboard:()=>`<div class="grid"><div class="card">المتعلمون<div class="num">${D.learners.length}</div></div><div class="card">التحكم العام<div class="num">${D.learners.length?Math.round(D.learners.reduce((s,l)=>s+control(l),0)/D.learners.length):0}%</div></div><div class="card">الروائز<div class="num">${D.assessments.length}</div></div><div class="card">تعثرات اللبنات<div class="num">${D.blocks.filter(x=>x.v!='متحكم').length}</div></div></div><div class="g2"><div class="card"><h3>إجراءات سريعة</h3><div class="actions"><button class="btn primary" onclick="learner()">➕ متعلم</button><button class="btn" onclick="go('assessment')">📝 رائز</button><button class="btn" onclick="go('mindmap')">🧠 خريطة PPTX</button><button class="btn" onclick="go('reports')">📈 تقرير</button></div></div><div class="card"><h3>تنبيهات</h3>${D.learners.filter(l=>control(l)&&control(l)<50).map(l=>`<p><span class="pill bad">${esc(l.name)} — يحتاج دعماً</span></p>`).join('')||'<div class="muted">لا توجد تنبيهات</div>'}</div></div>`,
learners:()=>`<div class="card"><div class="actions"><button class="btn primary" onclick="learner()">➕ إضافة متعلم</button><button class="btn" onclick="csvLearners()">📥 تحميل CSV</button></div><table class="table"><tr><th>الاسم</th><th>الفوج</th><th>التحكم</th><th>إجراء</th></tr>${D.learners.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(group(l.g))}</td><td>${control(l)}%</td><td><button class="btn" onclick="profile('${l.id}')">ملف</button> <button class="btn danger" onclick="del('${l.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan=4>لا توجد بيانات</td></tr>'}</table></div>`,
groups:()=>`<div class="g2"><div class="card"><h3>الأفواج</h3><button class="btn primary" onclick="newGroup()">➕ فوج</button>${D.groups.map(g=>`<p><b>${esc(g.name)}</b> — ${D.learners.filter(l=>l.g==g.id).length} متعلم</p>`).join('')||'<div class="muted">لا توجد أفواج</div>'}</div><div class="card"><h3>⚡ اقتراح TaRL</h3><p class="muted">يقترح توزيع المتعلمين حسب أحدث نتائجهم، ويمكنك تعديله يدويًا.</p><button class="btn success" onclick="autoGroup()">توزيع تلقائي</button></div></div>`,
assessment:()=>`<div class="card"><h3>الرائز — المستوى الخامس</h3><p class="muted">تسجيل رائز قبلي/بعدي وربطه بملف المتعلم. البنية مهيأة للعربية والفرنسية والرياضيات، وتُحفظ النتائج محليًا.</p><button class="btn primary" onclick="assessment()">➕ تسجيل</button> <button class="btn" onclick="csvAssessment()">📥 تحميل</button><table class="table"><tr><th>المتعلم</th><th>النوع</th><th>العربية</th><th>الفرنسية</th><th>الرياضيات</th><th>المتوسط</th></tr>${D.assessments.map(a=>`<tr><td>${esc(name(a.l))}</td><td>${a.t}</td><td>${a.a}%</td><td>${a.f}%</td><td>${a.m}%</td><td><b>${avg(a.a,a.f,a.m)}%</b></td></tr>`).join('')||'<tr><td colspan=6>لا توجد نتائج</td></tr>'}</table></div>`,
math:()=>`<div class="g2"><div class="card"><h3>شبكات تصديق اللبنات — الخامس</h3><button class="btn primary" onclick="block()">➕ تسجيل لبنة</button><button class="btn" onclick="csvBlocks()">📥 تحميل</button>${D.blocks.map(b=>`<p>${esc(name(b.l))} — ${esc(b.path)} — ${esc(b.b)} — <span class="pill ${b.v=='متحكم'?'good':b.v=='في طور التحكم'?'warn':'bad'}">${b.v}</span></p>`).join('')||'<div class="muted">لا توجد بيانات</div>'}</div><div class="card"><h3>توجيه الدعم</h3><p class="muted">اللبنات غير المتحكم فيها تظهر هنا لتسهيل تشكيل مجموعات الدعم.</p></div></div>`,
tracking:()=>net('شبكات التتبع','tracking'),fluency:()=>net('شبكات الطلاقة','fluency'),
support:()=>`<div class="g2"><div class="card"><h3>🎯 الدعم المكثف</h3><div class="form"><div class="field"><label>التاريخ</label><input id="sd" type="date"></div><div class="field"><label>الفوج</label><select id="sg">${D.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label>الهدف/النشاط</label><textarea id="sa"></textarea></div></div><button class="btn primary" onclick="support()">حفظ</button></div><div class="card"><h3>السجل</h3>${D.support.map(x=>`<p>${esc(x.d)} — ${esc(x.t)}</p>`).join('')||'<div class="muted">فارغ</div>'}</div></div>`,
mindmap:()=>`<div class="g2"><div class="card"><h3>🧠 توليد تلقائي من PPTX</h3><div class="drop" onclick="ppt.click()">اضغط لرفع درس PPTX<input id="ppt" type="file" accept=".pptx" hidden onchange="makeMap(this)"><p class="muted">يستخرج نصوص الشرائح تلقائيًا ويحولها إلى فروع.</p></div><input id="mapTitle" placeholder="عنوان الخريطة" style="width:100%;padding:10px;margin-top:10px;border:1px solid #ddd;border-radius:8px"><div class="actions" style="margin-top:10px"><button class="btn" onclick="downloadMap()">📥 تحميل الخريطة</button><button class="btn" onclick="window.print()">🖨️ طباعة</button></div></div><div class="card"><h3>المعاينة التفاعلية</h3><div id="mind" class="mind"><div class="muted">ارفع PPTX للبدء.</div></div></div></div>`,
reports:()=>`<div class="card"><h3>📈 التقرير</h3><p>المتعلمون: <b>${D.learners.length}</b></p><p>التحكم العام: <b>${D.learners.length?Math.round(D.learners.reduce((s,l)=>s+control(l),0)/D.learners.length):0}%</b></p><p>الروائز: <b>${D.assessments.length}</b></p><p>لبنات تحتاج دعمًا: <b>${D.blocks.filter(x=>x.v!='متحكم').length}</b></p><button class="btn primary" onclick="report()">📥 تحميل التقرير</button> <button class="btn" onclick="window.print()">🖨️ طباعة</button></div>`,
inspector:()=>`<div class="g2"><div class="card"><h3>👩‍🏫 المفتشة المؤطرة</h3><div class="form"><div class="field"><label>الاسم</label><input id="in"></div><div class="field"><label>التاريخ</label><input id="idate" type="date"></div><div class="field" style="grid-column:1/-1"><label>الملاحظة/التوصية</label><textarea id="ino"></textarea></div></div><button class="btn primary" onclick="saveInspector()">حفظ</button></div><div class="card"><h3>سجل المواكبة</h3>${D.inspector.map(x=>`<p>${esc(x.d)} — ${esc(x.n)}</p>`).join('')||'<div class="muted">لا توجد ملاحظات</div>'}</div></div>`,
settings:()=>`<div class="card"><h3>🏫 المؤسسة</h3><div class="form"><div class="field"><label>الأكاديمية</label><input id="ac" value="${esc(D.school.academy)}"></div><div class="field"><label>المديرية</label><input id="di" value="${esc(D.school.directorate)}"></div><div class="field"><label>المؤسسة</label><input id="sc" value="${esc(D.school.school)}"></div><div class="field"><label>الموسم</label><input id="yr" value="${esc(D.school.year||'2026/2027')}"></div><div class="field"><label>الأستاذ</label><input id="te" value="${esc(D.school.teacher)}"></div></div><button class="btn primary" onclick="settings()">حفظ</button> <button class="btn danger" onclick="reset()">مسح البيانات</button></div>`
};
function net(t,k){return `<div class="card"><h3>${t}</h3><button class="btn primary" onclick="network('${k}')">➕ تسجيل</button><button class="btn" onclick="csvNet('${k}')">📥 تحميل</button><table class="table"><tr><th>المتعلم</th><th>المجال</th><th>المؤشر</th><th>المستوى</th></tr>${D[k].map(x=>`<tr><td>${esc(name(x.l))}</td><td>${esc(x.d)}</td><td>${esc(x.i)}</td><td>${esc(x.v)}</td></tr>`).join('')||'<tr><td colspan=4>لا توجد بيانات</td></tr>'}</table></div>`}
function learner(){modal('إضافة متعلم',`<div class="form"><div class="field"><label>اسم المتعلم</label><input id="ln"></div><div class="field"><label>الفوج</label><select id="lg"><option value="">غير مصنف</option>${D.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div></div><button class="btn primary" onclick="saveLearner()">حفظ</button>`)}
function saveLearner(){let n=ln.value.trim();if(!n)return alert('اكتب اسم المتعلم');D.learners.push({id:id(),name:n,g:lg.value});closeM();save()}
function del(i){if(confirm('حذف المتعلم وبياناته؟')){D.learners=D.learners.filter(x=>x.id!=i);save()}}
function profile(i){let l=D.learners.find(x=>x.id==i);modal('ملف المتعلم',`<h3>${esc(l.name)}</h3><p>الفوج: ${esc(group(l.g))}</p><p>التحكم: <b>${control(l)}%</b></p><h4>الروائز</h4>${D.assessments.filter(x=>x.l==i).map(a=>`<p>${a.t}: ${a.a}% / ${a.f}% / ${a.m}%</p>`).join('')||'لا توجد نتائج'}<h4>اللبنات</h4>${D.blocks.filter(x=>x.l==i).map(b=>`<p>${esc(b.b)}: ${esc(b.v)}</p>`).join('')||'لا توجد بيانات'}`)}
function newGroup(){modal('فوج جديد',`<div class="field"><label>اسم الفوج</label><input id="gn"></div><button class="btn primary" onclick="saveGroup()">حفظ</button>`)}function saveGroup(){if(gn.value.trim()){D.groups.push({id:id(),name:gn.value.trim()});closeM();save()}}
function autoGroup(){if(!D.groups.length)D.groups=[{id:id(),name:'دعم أساسي'},{id:id(),name:'في طور التحكم'},{id:id(),name:'متحكم'}];D.learners.forEach(l=>{let c=control(l);l.g=c<50?D.groups[0].id:c<75?D.groups[1].id:D.groups[2].id});save();alert('تم اقتراح توزيع المتعلمين.')}
function assessment(){modal('رائز المستوى الخامس',`<div class="form"><div class="field"><label>المتعلم</label><select id="al">${D.learners.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>النوع</label><select id="at"><option>قبلي</option><option>بعدي</option></select></div><div class="field"><label>العربية</label><input id="aa" type="number" min=0 max=100 value=0></div><div class="field"><label>الفرنسية</label><input id="af" type="number" min=0 max=100 value=0></div><div class="field"><label>الرياضيات</label><input id="am" type="number" min=0 max=100 value=0></div></div><button class="btn primary" onclick="saveAssessment()">حفظ</button>`)}
function saveAssessment(){D.assessments.push({l:al.value,t:at.value,a:+aa.value,f:+af.value,m:+am.value});closeM();save()}
function block(){modal('تصديق لبنة رياضيات — الخامس',`<div class="form"><div class="field"><label>المتعلم</label><select id="bl">${D.learners.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>المسار</label><select id="bp"><option>المسار الأول</option><option>المسار الثاني</option></select></div><div class="field"><label>اللبنة</label><input id="bb"></div><div class="field"><label>التحكم</label><select id="bv"><option>متحكم</option><option>في طور التحكم</option><option>غير متحكم</option></select></div></div><button class="btn primary" onclick="saveBlock()">حفظ</button>`)}
function saveBlock(){D.blocks.push({l:bl.value,path:bp.value,b:bb.value,v:bv.value});closeM();save()}
function network(k){modal('إضافة شبكة',`<div class="form"><div class="field"><label>المتعلم</label><select id="nl">${D.learners.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>المجال</label><input id="nd"></div><div class="field"><label>المؤشر</label><input id="ni"></div><div class="field"><label>المستوى</label><select id="nv"><option>متحكم</option><option>في طور التحكم</option><option>غير متحكم</option></select></div></div><button class="btn primary" onclick="saveNet('${k}')">حفظ</button>`)}
function saveNet(k){D[k].push({l:nl.value,d:nd.value,i:ni.value,v:nv.value});closeM();save()}
function support(){D.support.push({d:sd.value,t:sa.value+' — '+group(sg.value)});save();alert('تم الحفظ')}
function saveInspector(){D.inspector.push({d:idate.value,n:in.value+' — '+ino.value});closeM();save()}
function settings(){D.school={academy:ac.value,directorate:di.value,school:sc.value,year:yr.value,teacher:te.value};save();alert('تم الحفظ')}
function reset(){if(confirm('حذف كل البيانات المحلية؟')){localStorage.removeItem(K);location.reload()}}
function dl(n,s,type='text/csv;charset=utf-8'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type}));a.download=n;a.click()}
function CSV(rows){return rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\n')}
function csvLearners(){dl('learners.csv',CSV([['الاسم','الفوج'],...D.learners.map(l=>[l.name,group(l.g)])]))}
function csvAssessment(){dl('assessment-level5.csv',CSV([['المتعلم','النوع','العربية','الفرنسية','الرياضيات'],...D.assessments.map(a=>[name(a.l),a.t,a.a,a.f,a.m])]))}
function csvBlocks(){dl('math-blocks-level5.csv',CSV([['المتعلم','المسار','اللبنة','التحكم'],...D.blocks.map(b=>[name(b.l),b.path,b.b,b.v])]))}
function csvNet(k){dl(k+'.csv',CSV([['المتعلم','المجال','المؤشر','المستوى'],...D[k].map(x=>[name(x.l),x.d,x.i,x.v])]))}
function report(){dl('riyadah-report.csv',CSV([['المؤشر','القيمة'],['المتعلمون',D.learners.length],['التحكم العام',D.learners.length?Math.round(D.learners.reduce((s,l)=>s+control(l),0)/D.learners.length)+'%':'0%'],['الروائز',D.assessments.length],['تعثرات اللبنات',D.blocks.filter(x=>x.v!='متحكم').length]]))}
function backup(){dl('riyadah-backup.json',JSON.stringify(D,null,2),'application/json')}
function restore(el){let r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save()}catch(e){alert('الملف غير صالح')}};r.readAsText(el.files[0])}
async function makeMap(el){let f=el.files[0];if(!f)return;mind.innerHTML='<p>جارٍ تحليل الملف…</p>';try{let z=await JSZip.loadAsync(f),fs=Object.keys(z.files).filter(x=>/^ppt\/slides\/slide\d+\.xml$/.test(x)).sort((a,b)=>+a.match(/slide(\d+)/)[1]-+b.match(/slide(\d+)/)[1]);let title=mapTitle.value.trim()||f.name.replace(/\.pptx$/i,'');let out='<div class="node root">'+esc(title)+'</div><ul>';for(let i=0;i<fs.length;i++){let x=await z.file(fs[i]).async('text'),d=new DOMParser().parseFromString(x,'text/xml'),ts=[...d.getElementsByTagNameNS('*','t')].map(n=>n.textContent.trim()).filter(Boolean);if(ts.length){out+='<li><span class="node"><b>'+esc(ts[0])+'</b></span><ul>'+ts.slice(1).map(t=>'<li><span class="node">'+esc(t)+'</span></li>').join('')+'</ul></li>'}}out+='</ul>';mapHTML=out;mind.innerHTML=out;D.maps.push({title,slides:fs.length});localStorage.setItem(K,JSON.stringify(D))}catch(e){mind.innerHTML='<p>تعذر قراءة PPTX. استعمل ملف PowerPoint بصيغة .pptx.</p>'}}
