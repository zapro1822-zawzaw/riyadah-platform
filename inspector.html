<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رَوّاد — لوحة المفتش</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--nav:#0b2038;--blue:#1769d3;--bg:#f3f6fa;--card:#fff;--line:#dce4ec;--muted:#66788a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#17212b}.top{background:linear-gradient(135deg,#0b2038,#1769d3);color:#fff;padding:22px}.wrap{max-width:1400px;margin:auto;padding:18px}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 25px #102a4310}.num{font-size:30px;font-weight:900}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.light{background:#f3f6fa;color:#17212b}.primary{background:var(--blue);color:#fff}.danger{background:#fff0f0;color:#9b2020}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:right}.table th{background:#f7f9fc}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:900}.ok{background:#def7ec;color:#086b4b}.warn{background:#fff5d6;color:#8a5a00}@media(max-width:800px){.g4,.g2{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><header class="top"><div class="wrap" style="padding:0"><div class="toolbar" style="justify-content:space-between"><div><h1 style="margin:0">👩‍🏫 لوحة قيادة المفتش(ة)</h1><div style="opacity:.85">المواكبة والتتبع والتقويم التربوي</div></div><div class="toolbar"><span id="who"></span><button class="btn light" onclick="location.href='/app.html'">مساحة العمل</button><button class="btn danger" onclick="logout()">خروج</button></div></div></div></header><main class="wrap"><div id="msg" class="card">جاري تحميل لوحة المفتش…</div><div id="content" style="display:none"><div class="grid g4"><div class="card"><div class="muted">الأساتذة</div><div id="teachers" class="num">0</div></div><div class="card"><div class="muted">المؤسسات</div><div id="schools" class="num">0</div></div><div class="card"><div class="muted">المتعلمون</div><div id="students" class="num">0</div></div><div class="card"><div class="muted">الروائز</div><div id="assess" class="num">0</div></div></div><div class="grid g2" style="margin-top:14px"><section class="card"><h2>👨‍🏫 الأساتذة</h2><div class="tablewrap"><table class="table"><thead><tr><th>الأستاذ</th><th>المؤسسة</th><th>الحالة</th></tr></thead><tbody id="teacherRows"></tbody></table></div></section><section class="card"><h2>🏫 المؤسسات</h2><div id="schoolRows"></div></section></div><section class="card" style="margin-top:14px"><div class="toolbar" style="justify-content:space-between"><h2 style="margin:0">📈 مؤشرات المواكبة</h2><button class="btn primary" onclick="load()">تحديث</button></div><div id="indicatorBox" style="margin-top:12px"></div></section></div></main><script>
const URL='https://bnqbavlkvrpcbhqxctda.supabase.co',KEY='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q',sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function boot(){let {data:{session}}=await sb.auth.getSession();if(!session){location.href='/';return}let {data:p}=await sb.from('profiles').select('id,full_name,role,is_active').eq('id',session.user.id).single();if(!p||p.role!=='inspector'||!p.is_active){await sb.auth.signOut();location.href='/';return}$('who').textContent='👤 '+(p.full_name||session.user.email);$('msg').style.display='none';$('content').style.display='block';await load()}
async function load(){let [p,s,c,st,a]=await Promise.all([sb.from('profiles').select('id,full_name,role,school_name,is_active').eq('role','teacher'),sb.from('schools').select('id,name,region,district'),sb.from('classes').select('id'),sb.from('students').select('id'),sb.from('assessments').select('id,kind,score')]);let teachers=p.data||[],schools=s.data||[];$('teachers').textContent=teachers.length;$('schools').textContent=schools.length;$('students').textContent=st.data?.length||0;$('assess').textContent=a.data?.length||0;$('teacherRows').innerHTML=teachers.map(x=>`<tr><td><b>${esc(x.full_name||'—')}</b></td><td>${esc(x.school_name||'—')}</td><td>${x.is_active?'<span class="badge ok">مفعل</span>':'<span class="badge warn">معطل</span>'}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد بيانات.</td></tr>';$('schoolRows').innerHTML=schools.map(x=>`<div class="card" style="margin:7px 0"><b>${esc(x.name)}</b><div class="muted">${esc(x.region||'')} — ${esc(x.district||'')}</div></div>`).join('')||'<div class="muted">لا توجد مؤسسات.</div>';let pre=(a.data||[]).filter(x=>x.kind==='pre'),post=(a.data||[]).filter(x=>x.kind==='post'),avgPre=pre.length?pre.reduce((n,x)=>n+(+x.score||0),0)/pre.length:0,avgPost=post.length?post.reduce((n,x)=>n+(+x.score||0),0)/post.length:0;$('indicatorBox').innerHTML=`<div class="grid g4"><div class="card"><div class="muted">متوسط القبلي</div><div class="num">${avgPre.toFixed(1)}%</div></div><div class="card"><div class="muted">متوسط البعدي</div><div class="num">${avgPost.toFixed(1)}%</div></div><div class="card"><div class="muted">التغير</div><div class="num">${(avgPost-avgPre).toFixed(1)}</div></div><div class="card"><div class="muted">الأقسام</div><div class="num">${c.data?.length||0}</div></div></div>`}
async function logout(){await sb.auth.signOut();location.href='/'}boot();</script></body></html>
