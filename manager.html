<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رَوّاد V16 — الإدارة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;background:#f3f6fa;color:#17212b}.top{background:linear-gradient(135deg,#0b2038,#1769d3);color:#fff;padding:18px}.wrap{max-width:1300px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #102a4314;border:1px solid #dce4ec}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:850;cursor:pointer}.primary{background:#1769d3;color:#fff}.light{background:#edf2f7}.danger{background:#fee7e7;color:#9b2020}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select{font:inherit;padding:10px;border:1px solid #cbd5df;border-radius:10px}.num{font-size:30px;font-weight:950}.muted{color:#66788a}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e3e8ed;text-align:right;white-space:nowrap}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.form{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1 style="margin:0">👑 رَوّاد V16 — مركز الإدارة</h1><div>إدارة المؤسسة والحسابات والصلاحيات</div></div></header><main class="wrap"><div class="card"><button class="btn primary" onclick="location.href='/v16.html'">🏠 فتح المنصة الكاملة</button> <button class="btn danger" onclick="logout()">🚪 خروج</button><span id="status" class="muted" style="margin-right:10px">جاري التحقق…</span></div><div class="grid"><div class="card"><div class="muted">الحسابات</div><div id="all" m('profiles').select('role,is_active').eq('id',me.id).maybeSingle();if(me.email?.toLowerCase()!=='zapro1822@gmail.com'&&(!p.data||p.data.role!=='admin'||!p.data.is_active)){location.replace('/');return}$('status').textContent='تم التحقق: '+me.email;await load()}async function load(){try{const d=await api({action:'list'}),u=d.users||[];$('all').textContent=u.length;$('teachers').textContent=u.filter(x=>x.profile?.role==='teacher').length;$('inspectors').textContent=u.filter(x=>x.profile?.role==='inspector').length;let m=await sb.from('platform_modules').select('id',{count:'exact',head:true});$('modules').textContent=m.count||0;$('users').innerHTML=u.map(x=>`<tr><td>${esc(x.profile?.full_name||'—')}</td><td>${esc(x.email)}</td><td><select onchange="role('${x.id}',this.value)" ${x.id===me.id?'disabled':''}><option value="teacher" ${x.profile?.role==='teacher'?'selected':''}>أستاذ</option><option value="inspector" ${x.profile?.role==='inspector'?'selected':''}>مفتش</option><option value="admin" ${x.profile?.role==='admin'?'selected':''}>مدير</option></select></td><td>${x.profile?.is_active===false?'🔴 غير مفعل':'🟢 مفعل'}</td><td>${x.id===me.id?'—':`<button class="btn ${x.profile?.is_active===false?'primary':'danger'}" onclick="status('${x.id}',${x.profile?.is_active===false})">${x.profile?.is_active===false?'تفعيل':'تعطيل'}</button>`}</td></tr>`).join('')}catch(e){$('users').innerHTML='<tr><td colspan="5">'+esc(e.message)+'</td></tr>'}}async function createTeacher(e){e.preventDefault();try{await api({action:'create_teacher',email:$('email').value,full_name:$('name').value,password:$('pass').value,phone:$('phone').value});alert('تم إنشاء الحساب وتفعيله');e.target.reset();await load()}catch(x){alert(x.message)}}async function status(id,on){try{await api({action:'set_status',user_id:id,is_active:on});await load()}catch(e){alert(e.message)}}async function role(id,v){if(v==='admin'){alert('تغيير الدور إلى مدير محصور في الإدارة المركزية.');await load();return}try{await api({action:'set_role',user_id:id,role:v});await load()}catch(e){alert(e.message)}}async function logout(){await sb.auth.signOut({scope:'local'});location.replace('/')}main()</script></body></html>
