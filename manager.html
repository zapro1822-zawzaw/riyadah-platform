<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رَوّاد — المدير</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f3f6fa;color:#17212b}.top{background:linear-gradient(135deg,#0b2038,#1769d3);color:#fff;padding:22px}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #102a4314}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:#1769d3;color:#fff}.danger{background:#fee7e7;color:#9b2020}.muted{color:#66788a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.num{font-size:30px;font-weight:950}</style></head><body><header class="top"><div class="wrap"><h1>👨‍💼 لوحة قيادة المدير</h1><div>رَوّاد — الإدارة المركزية</div></div></header><main class="wrap"><div class="card"><h2>الوصول السريع</h2><button class="btn primary" onclick="openPlatform()">🏠 فتح المنصة الأصلية</button> <button class="btn danger" onclick="logout()">🚪 خروج</button><p class="muted" id="status">جاري التحقق من الحساب…</p></div><div class="grid"><div class="card"><div class="muted">إجمالي الحسابات</div><div class="num" id="all">—</div></div><div class="card"><div class="muted">الأساتذة</div><div class="num" id="teachers">—</div></div><div class="card"><div class="muted">المفتشون</div><div class="num" id="inspectors">—</div></div></div></main><script>const U='https://bnqbavlkvrpcbhqxctda.supabase.co',K='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q',sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}});function openPlatform(){location.href='/platform.html?open=1'}async function logout(){await sb.auth.signOut({scope:'local'});location.replace('/')}async function main(){try{const r=await sb.auth.getUser();if(r.error||!r.data?.user){location.replace('/');return}document.getElementById('status').textContent='تم التحقق من الحساب: '+(r.data.user.email||'');const q=await sb.from('profiles').select('role,is_active');if(!q.error&&q.data){document.getElementById('all').textContent=q.data.length;document.getElementById('teachers').textContent=q.data.filter(x=>x.role==='teacher').length;document.getElementById('inspectors').textContent=q.data.filter(x=>x.role==='inspector').length}}catch(e){document.getElementById('status').textContent='تم تسجيل الدخول، ويمكن فتح المنصة مباشرة.'}}main();</script></body></html>
