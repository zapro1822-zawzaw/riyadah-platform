<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رَوّاد | خريطة PPTX</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>:root{--n:#102a43;--b:#1687d9;--g:#49aa4d;--o:#ef9218;--c:#2aa7d9;--p:#d73587;--v:#7a48b8;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Tahoma,Arial;color:#172535}.top{background:linear-gradient(135deg,#102a43,#1769d3);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.top b{font-size:21px}.wrap{max-width:1500px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px}.card{background:#fff;border:1px solid #d9e2ea;border-radius:17px;padding:15px;box-shadow:0 8px 25px #17324d12}.field{display:grid;gap:5px;margin:8px 0}.field input,.field select{padding:9px;border:1px solid #cbd7e1;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:#eaf3fb;color:#155987;margin:2px}.primary{background:var(--n);color:#fff}.drop{border:2px dashed #79acd2;padding:20px;text-align:center;border-radius:13px;background:#eef7ff}.status{padding:9px;border-radius:9px;background:#f2f6f9;margin:8px 0;font-size:13px}.ok{background:#e8f8ed;color:#16683a}.err{background:#ffeded;color:#a31f1f}.map{overflow:auto;border:1px solid #d8e2ea;border-radius:14px}.canvas{width:1200px;height:800px;position:relative;background:radial-gradient(circle,#eaf7ff,#fff 55%);overflow:hidden}.canvas svg{position:absolute;inset:0}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:285px;min-height:125px;border:3px solid #4aa9d8;border-radius:50%;background:#dff1fb;display:grid;place-items:center;text-align:center;padding:25px;font-size:24px;font-weight:950;z-index:3;white-space:pre-wrap}.branch{position:absolute;transform:translate(-50%,-50%);width:300px;min-height:145px;border:3px solid;border-radius:20px;padding:12px 15px;background:#fff;z-index:4;box-shadow:0 6px 18px #17324d18}.branch h3{margin:0 0 4px;font-size:19px}.branch ul{margin:5px 0;padding-right:18px;font-size:13px;line-height:1.45}.b1{border-color:var(--g);background:#f0faed}.b2{border-color:var(--o);background:#fff7e7}.b3{border-color:var(--c);background:#edfaff}.b4{border-color:var(--p);background:#fff0f7}.b5{border-color:var(--v);background:#f6effc}.num{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:50%;color:#fff;margin-left:6px}.b1 .num{background:var(--g)}.b2 .num{background:var(--o)}.b3 .num{background:var(--c)}.b4 .num{background:var(--p)}.b5 .num{background:var(--v)}.edit:focus{outline:3px solid #79b8e855}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}.meta div{background:#f5f9fc;border:1px solid #dbe4eb;border-radius:9px;padding:7px;text-align:center;font-size:12px}.meta b{display:block}.foot{position:absolute;left:25px;right:25px;bottom:15px;text-align:center;background:#eaf6fb;border:1px solid #add7e8;border-radius:11px;padding:8px;font-size:12px;font-weight:800}.slides{max-height:260px;overflow:auto}.slide{border:1px solid #dde5eb;border-radius:9px;padding:7px;margin:5px 0;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,1fr)}}@media print{body{background:#fff}.top,.no-print{display:none}.wrap{padding:0}.card{box-shadow:none;border:0}.map{border:0}.canvas{transform:scale(.8);transform-origin:top right}}</style></head><body><header class="top"><div><b>🧠 رَوّاد — مولد الخريطة الذهنية من PPTX</b><div>نموذج مؤسسات الريادة: العربية • الرياضيات • الفرنسية</div></div><button class="btn" onclick="location.href='v22.html'">↩ رَوّاد</button></header><main class="wrap"><div class="grid"><aside class="card"><div class="drop" id="drop">اسحب ملف PPTX هنا<br><input id="file" type="file" accept=".pptx" style="margin-top:8px"></div><div id="status" class="status">لم يتم تحميل مورد.</div><div class="field"><label>المستوى</label><input id="level" placeholder="المستوى: الرابع"></div><div class="field"><label>المادة</label><input id="subject" placeholder="الرياضيات / اللغة العربية / Français"></div><div class="field"><label>المسار</label><input id="path" placeholder="المسار: الأول"></div><div class="field"><label>عنوان الدرس</label><input id="title" placeholder="يُستخرج من الملف"></div><div class="field"><label>الحصة</label><input id="session" placeholder="الحصة: 2 / 6"></div><div class="field"><label>توزيع الزمن</label><input id="time" placeholder="افتتاح 15د | تعلم 30د | ممارسة 15د | اختتام 10د"></div><button class="btn primary" onclick="make()">⚡ إنشاء الخريطة</button><button class="btn" onclick="localStorage.removeItem('rm');location.reload()">مسح</button><div id="slides" class="slides"></div></aside><section class="card"><div class="meta" id="meta"></div><div class="no-print"><button class="btn primary" onclick="save()">💾 حفظ</button><button class="btn" onclick="downloadJSON()">JSON</button><button class="btn" onclick="downloadHTML()">HTML</button><button class="btn" onclick="print()">🖨️ PDF / طباعة</button></div><div class="map"><div id="canvas" class="canvas"><div class="status" style="position:absolute;left:25%;right:25%;top:42%;text-align:center">ارفع PPTX ثم أنشئ الخريطة.</div></div></div></section></div></main><script>let S={slides:[],map:null,lang:'ar'};const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function lang(t){return((t.match(/[\u0600-\u06ff]/g)||[]).length>=(t.match(/[A-Za-zÀ-ÿ]/g)||[]).length)?'ar':'fr'}function pinfo(p){let t=[...p.getElementsByTagNameNS('*','t')].map(x=>x.textContent.trim()).filter(Boolean).join(' ').replace(/\s+/g,' ').trim();if(!t)return null;let q=p.getElementsByTagNameNS('*','pPr')[0],l=q?.getAttribute('lvl');l=l==null?null:+l;let z=[],b=false;[...p.getElementsByTagNameNS('*','rPr'),...p.getElementsByTagNameNS('*','defRPr')].forEach(x=>{if(x.getAttribute('sz'))z.push(+x.getAttribute('sz'));if(x.getAttribute('b')==='1')b=true});return{text:t.slice(0,190),lvl:l,s:z,b}}async function parse(f){let z=await JSZip.loadAsync(f),ns=Object.keys(z.files).filter(x=>/^ppt\/slides\/slide\d+\.xml$/.test(x)).sort((a,b)=>+a.match(/\d+/)-+b.match(/\d+/)),r=[];for(let i=0;i<ns.length;i++){let d=new DOMParser().parseFromString(await z.files[ns[i]].async('text'),'application/xml'),p=[...d.getElementsByTagNameNS('*','p')].map(pinfo).filter(Boolean),mx=Math.max(...p.flatMap(x=>x.s.length?x.s:[0])),ti=p.findIndex(x=>x.lvl===0);if(ti<0)ti=p.findIndex(x=>x.s.includes(mx)&&x.b);if(ti<0)ti=0;let items=p.filter((_,j)=>j!==ti).map(x=>({text:x.text,depth:x.lvl!=null?Math.min(2,Math.max(1,x.lvl+1)):(x.s.length?Math.max(...x.s):0)>=mx*.87||x.b?1:2}));r.push({no:i+1,title:p[ti]?.text||'شريحة '+(i+1),items})}return r}async function load(f){$('status').textContent='جاري تحليل الشرائح…';try{S.slides=await parse(f);let all=S.slides.map(x=>x.title+' '+x.items.map(y=>y.text).join(' ')).join(' ');S.lang=lang(all);$('title').value=S.slides[0]?.title||f.name.replace(/\.pptx$/i,'');$('subject').value=/جمع|طرح|ضرب|قسمة|math|calcul/i.test(all)?'الرياضيات':/lettres|lecture|français/i.test(all)?'اللغة الفرنسية':'اللغة العربية';$('slides').innerHTML=S.slides.map(x=>'<div class="slide"><b>شريحة '+x.no+' — '+esc(x.title)+'</b><br>'+esc(x.items.slice(0,2).map(y=>y.text).join(' • '))+'</div>').join('');$('status').textContent='تم استخراج '+S.slides.length+' شريحة — '+(S.lang==='ar'?'العربية':'Français');$('status').className='status ok'}catch(e){$('status').textContent='خطأ: '+e.message;$('status').className='status err'}}$('file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();let f=e.dataTransfer.files[0];if(f)load(f)};function make(){if(!S.slides.length)return;let n=5,g=Array.from({length:n},()=>[]);S.slides.forEach((x,i)=>g[Math.min(n-1,Math.floor(i*n/S.slides.length))].push(x));S.map={title:$('title').value||S.slides[0].title,level:$('level').value,subject:$('subject').value,path:$('path').value,session:$('session').value,time:$('time').value,lang:S.lang,branches:g.map((a,i)=>({title:a[0]?.title||'المحور '+(i+1),items:[...new Set(a.flatMap(x=>x.items.map(y=>y.text)))].slice(0,7)}))};draw()}let pos=[['50%','12%'],['11%','34%'],['11%','69%'],['89%','34%'],['89%','69%']];function draw(){let m=S.map,c=$('canvas');c.innerHTML='<svg id="lines"></svg>';let root=document.createElement('div');root.className='center edit';root.contentEditable=true;root.dataset.root=1;root.textContent=m.title;c.appendChild(root);m.branches.forEach((b,i)=>{let d=document.createElement('div');d.className='branch b'+(i+1)+' edit';d.contentEditable=true;d.dataset.i=i;d.style.left=pos[i][0];d.style.top=pos[i][1];d.innerHTML='<h3><span class="num">'+(i+1)+'</span>'+esc(b.title)+'</h3><ul>'+b.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';c.appendChild(d)});let colors=['#49aa4d','#ef9218','#2aa7d9','#d73587','#7a48b8'];m.branches.forEach((b,i)=>{let p=document.createElementNS('http://www.w3.org/2000/svg','path'),x=+pos[i][0].replace('%','')*12,y=+pos[i][1].replace('%','')*8;p.setAttribute('d','M600 400 C600 400 '+(x+600)/2+' '+(y+400)/2+' '+x+' '+y);p.setAttribute('fill','none');p.setAttribute('stroke',colors[i]);p.setAttribute('stroke-width','7');p.setAttribute('stroke-linecap','round');$('lines').appendChild(p)});let f=document.createElement('div');f.className='foot edit';f.contentEditable=true;f.textContent=m.time||'توزيع الزمن: افتتاح الحصة → بناء التعلم → ممارسة موجهة → ممارسة مستقلة → اختتام وتقويم';c.appendChild(f);$('meta').innerHTML=[['المستوى',m.level],['المادة',m.subject],['المسار',m.path],['الحصة',m.session]].map(x=>'<div><b>'+x[0]+'</b>'+esc(x[1]||'—')+'</div>').join('')}function sync(){if(!S.map)return;let c=$('canvas');S.map.title=c.querySelector('[data-root]')?.innerText.trim()||S.map.title;c.querySelectorAll('.branch').forEach((d,i)=>{let h=d.querySelector('h3')?.innerText.replace(/^\d+\s*/,'').trim();S.map.branches[i].title=h||S.map.branches[i].title;S.map.branches[i].items=[...d.querySelectorAll('li')].map(x=>x.innerText.trim()).filter(Boolean)});S.map.time=c.querySelector('.foot')?.innerText.trim()||S.map.time}function save(){sync();localStorage.setItem('rm',JSON.stringify(S.map));$('status').textContent='تم حفظ الخريطة.';$('status').className='status ok'}function blob(s,n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click()}function downloadJSON(){sync();blob(JSON.stringify(S.map,null,2),'mindmap.json','application/json')}function downloadHTML(){sync();let m=S.map,h='<!doctype html><html lang="'+m.lang+'" dir="'+(m.lang==='ar'?'rtl':'ltr')+'"><meta charset="utf-8"><title>'+esc(m.title)+'</title><style>body{font-family:Arial;background:#f5f8fb;padding:25px}.head{text-align:center;background:#dff1fb;border:3px solid #4aa9d8;border-radius:25px;padding:20px}.bs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:20px}.b{padding:16px;border-radius:18px;background:#fff;border:3px solid}.b1{border-color:#49aa4d}.b2{border-color:#ef9218}.b3{border-color:#2aa7d9}.b4{border-color:#d73587}.b5{border-color:#7a48b8}.foot{text-align:center;margin-top:16px;padding:10px;background:#eaf6fb}</style><div class="head"><h1>'+esc(m.title)+'</h1><p>'+esc(m.level)+' | '+esc(m.subject)+' | '+esc(m.path)+' | '+esc(m.session)+'</p></div><div class="bs">'+m.branches.map((b,i)=>'<div class="b b'+(i+1)+'"><h2>'+(i+1)+'. '+esc(b.title)+'</h2><ul>'+b.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>').join('')+'</div><div class="foot">'+esc(m.time||'')+'</div></html>';blob(h,(m.title||'mindmap')+'.html','text/html;charset=utf-8')}function print(){sync();window.print()}try{let x=localStorage.getItem('rm');if(x){S.map=JSON.parse(x);draw()}}catch{}</script></body></html>
