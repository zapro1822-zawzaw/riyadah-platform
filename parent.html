<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رَوّاد V16 — بوابة الآباء</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:system-ui;color:#17212b}.top{background:linear-gradient(135deg,#071a2d,#1769d3);color:#fff;padding:22px}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dce4ec;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 7px 24px #102a4310}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.num{font-size:30px;font-weight:950}.muted{color:#68798a}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer}.primary{background:#1769d3;color:#fff}.danger{background:#fff0f0;color:#9b2020}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1>👨‍👩‍👧 رَوّاد V16</h1><div>بوابة الآباء وأولياء الأمور</div></div></header><main class="wrap"><section class="card"><h2 id="welcome">جاري التحقق…</h2><p class="muted">يمكن لولي الأمر الاطلاع فقط على الأبناء المرتبطين بحسابه.</p><button class="btn danger" onclick="logout()">خروج</button></section><section id="children" class="grid"></section><section class="card"><h2>📊 المتابعة</h2><p class="muted">النتائج، مسارات الدعم، الحضور، الملاحظات والرسائل ستظهر هنا حسب الصلاحيات والبيانات المرتبطة بالابن.</p></section></main><script>const U='https://bnqbavlkvrpcbhqxctda.supabase.co',K='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q',sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function boot(){const r=await sb.auth.getUser();if(r.error||!r.data?.user){location.href='/';return}const u=r.data.user;const p=await sb.from('profiles').select('full_name,role,is_active').eq('id',u.id).maybeSingle();if(p.error||!p.data||p.data.role!=='parent'||!p.data.is_active){await sb.auth.signOut();location.href='/';return}$('welcome').textContent='مرحبا، '+(p.data.full_name||u.email);const q=await sb.from('parent_links').select('student_id,relationship').eq('parent_user_id',u.id);if(q.error){$('children').innerHTML='<div class="card">تعذر تحميل بيانات الأبناء.</div>';return}const ids=(q.data||[]).map(x=>x.student_id);if(!ids.length){$('children').innerHTML='<div class="card"><b>لا يوجد أبناء مرتبطون بالحساب بعد.</b><p class="muted">يتم الربط من طرف المؤسسة.</p></div>';return}const s=await sb.from('students').select('id,first_name,last_name,student_code,class_id').in('id',ids);$('children').innerHTML=(s.data||[]).map(x=>`<article class="card"><div class="muted">التلميذ</div><div class="num">${esc((x.first_name||'')+' '+(x.last_name||''))}</div><p class="muted">${esc(x.student_code||'')} · الملف الدراسي</p></article>`).join('')}async function logout(){await sb.auth.signOut({scope:'local'});location.href='/'}boot().catch(()=>location.href='/');</script></body></html>
