<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2038">
<title>رَوّاد — المنصة الأصلية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b2038;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:#0b2038;color:#fff;font-size:18px;z-index:5;text-align:center;padding:20px}
.appframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f6fa;visibility:hidden}
.error{max-width:520px;line-height:1.8;text-align:center}.btn{border:0;border-radius:10px;padding:10px 16px;background:#1769d3;color:#fff;font-weight:800;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<div id="loading" class="loading"><div>جاري فتح المنصة الأصلية…</div></div>
<script>
const URL='https://bnqbavlkvrpcbhqxctda.supabase.co';
const KEY='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const DATA_KEY='riyadah_v14_ultimate',AUTH_KEY='riyadah_v15_auth_v1',SESSION_KEY='riyadah_v15_session_v1';
let frame=null,user=null,profile=null,lastHash='';
const $=id=>document.getElementById(id);
async function hash(v){const b=new TextEncoder().encode(v),h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function cloudGet(){const r=await sb.from('user_data').select('data').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;return r.data?.data||null}
async function cloudPut(data){const json=JSON.stringify(data),h=await hash(json);if(h===lastHash)return;const r=await sb.from('user_data').upsert({user_id:user.id,data,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(r.error)throw r.error;lastHash=h}
function base(){return{school:{name:profile?.school_name||'',teacher:profile?.full_name||'',year:'2026/2027'},levels:[],classes:[],students:[],assess:[],tracking:[],math:{},fluency:[],groups:[],inspectorNotes:'',links:{classroom:'',canva:'',massar:''}}}
async function boot(data){
 frame=document.createElement('iframe');frame.className='appframe';frame.src='/app.html';document.body.appendChild(frame);
 let first=true;
 frame.onload=async()=>{
  if(first){first=false;try{
   frame.contentWindow.localStorage.setItem(DATA_KEY,JSON.stringify(data));
   frame.contentWindow.localStorage.setItem(AUTH_KEY,JSON.stringify({username:profile?.full_name||user.email,hash:await hash(user.id+':riyadah'),created:new Date().toISOString()}));
   frame.contentWindow.sessionStorage.setItem(SESSION_KEY,JSON.stringify({username:profile?.full_name||user.email,expires:Date.now()+86400000,role:profile.role,cloudUserId:user.id}));
  }catch(e){console.error(e)}
  frame.contentWindow.location.reload();
  return;
  }
  frame.style.visibility='visible';$('loading').style.display='none';syncLoop();
 };
}
function syncLoop(){setInterval(async()=>{try{if(!frame?.contentWindow)return;const raw=frame.contentWindow.localStorage.getItem(DATA_KEY);if(raw){const data=JSON.parse(raw),h=await hash(raw);if(h!==lastHash)await cloudPut(data)}const r=await sb.from('profiles').select('is_active,role').eq('id',user.id).maybeSingle();if(!r.data||!r.data.is_active||(r.data.role!=='admin'&&r.data.role!=='teacher')){await sb.auth.signOut();location.replace('/');}}catch(e){console.error(e)}},2500)}
async function main(){try{const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/');return}user=session.user;const r=await sb.from('profiles').select('id,full_name,role,school_name,is_active').eq('id',user.id).maybeSingle();if(r.error||!r.data||!r.data.is_active||(r.data.role!=='admin'&&r.data.role!=='teacher')){await sb.auth.signOut();location.replace('/');return}profile=r.data;let data=await cloudGet();if(!data){data=base();await cloudPut(data)}else lastHash=await hash(JSON.stringify(data));await boot(data)}catch(e){console.error(e);$('loading').innerHTML='<div class="error">تعذر فتح المنصة الأصلية.<br>'+String(e.message||e)+'<br><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>'}}
sb.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT')location.replace('/')});main();
</script>
</body>
</html>
