const SUPA_URL='https://bnqbavlkvrpcbhqxctda.supabase.co',SUPA_KEY='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q';const sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let user,profile,schoolId,lang='ar',active='dashboard',cache={classes:[],students:[],assessments:[],support:[],explicit:[],tracking:[],fluency:[],math:[],blocks:[],parents:[],messages:[],lessons:[]};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const nav=[['dashboard','📊','لوحة القيادة','Tableau de bord','Dashboard'],['classes','🏫','الأقسام','Classes','Classes'],['students','👥','التلاميذ','Élèves','Students'],['assessments','📝','الروائز والتقويم','Évaluations','Assessments'],['support','🎯','مسارات الدعم','Parcours de soutien','Support paths'],['blocks','🧩','لبنات التعلم والتصديق','Blocs et certification','Learning blocks'],['explicit','🎓','التعليم الصريح','Enseignement explicite','Explicit instruction'],['arabic','ع','العربية','Arabe','Arabic'],['french','Fr','الفرنسية','Français','French'],['math','∑','الرياضيات','Mathématiques','Mathematics'],['fluency','⚡','الطلاقة','Fluidité','Fluency'],['tracking','📈','التتبع','Suivi','Tracking'],['reports','📄','التقارير','Rapports','Reports'],['ai','🤖','مركز الذكاء الاصطناعي','Centre IA','AI Hub'],['resources','📚','الموارد والجذاذات','Ressources','Resources'],['parents','👨‍👩‍👧','بوابة الآباء','Portail parents','Parent portal'],['inspector','🧭','التأطير والمفتشة','Encadrement','Supervision'],['settings','⚙️','الإعدادات','Paramètres','Settings']];
function txt(x){return lang==='ar'?x[2]:lang==='fr'?x[3]:x[4]}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2600)}function cycleLang(){lang=lang==='ar'?'fr':lang==='fr'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';renderNav();render()}
function renderNav(){let items=nav.filter(x=>{if(profile?.role==='parent')return ['dashboard','students','assessments','parents','settings'].includes(x[0]);if(profile?.role==='inspector')return ['dashboard','students','assessments','support','blocks','tracking','reports','inspector','settings'].includes(x[0]);return true});if(user?.id==='b33ae385-7f09-498b-a080-6d07f0a8e502')items.push(['owner','👑','مركز التطوير','Centre propriétaire','Owner development']);$('side').innerHTML=items.map(x=>`<button class="nav ${active===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} ${txt(x)}</button>`).join('')}

async function boot(){let r=await sb.auth.getUser();if(r.error||!r.data?.user){location.href='/';return}user=r.data.user;let p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.error||!p.data||!p.data.is_active){await sb.auth.signOut({scope:'local'});location.href='/';return}profile=p.data;let m=await sb.from('school_memberships').select('school_id,status').eq('user_id',user.id).eq('status','active').limit(1).maybeSingle();schoolId=m.data?.school_id||null;if(!schoolId&&profile.role!=='parent'){let s=await sb.from('schools').select('id').eq('created_by',user.id).limit(1).maybeSingle();schoolId=s.data?.id||null}renderNav();await refresh();render()}

function shell(title,sub,body,actions=''){return `<div class="card"><div class="toolbar" style="justify-content:space-between"><div><h2 style="margin:0">${title}</h2><div class="muted">${sub||''}</div></div>${actions}</div></div>${body}`}
function render(){let p='';if(active==='dashboard')p=dashboard();else if(active==='classes')p=classesPage();else if(active==='students')p=studentsPage();else if(active==='assessments')p=assessmentsPage();else if(active==='support')p=supportPage();else if(active==='blocks')p=blocksPage();else if(active==='explicit')p=explicitPage();else if(['arabic','french','math','fluency','tracking'].includes(active))p=subjectPage(active);else if(active==='reports')p=reportsPage();else if(active==='ai')p=aiPage();else if(active==='resources')p=resourcesPage();else if(active==='parents')p=parentsPage();else if(active==='inspector')p=inspectorPage();else if(active==='settings')p=settingsPage();else if(active==='owner')p=ownerPage();$('page').innerHTML=p}
function dashboard(){let s=cache.students.length,c=cache.classes.length,a=cache.assessments.length,sp=cache.support.length;return shell('مرحبا، '+esc(profile.full_name||user.email),(profile.school_name||'')+' · السنة الدراسية 2026/2027',`<div class="grid stats"><div class="card"><div class="muted">التلاميذ</div><div class="num">${s}</div></div><div class="card"><div class="muted">الأقسام</div><div class="num">${c}</div></div><div class="card"><div class="muted">الروائز</div><div class="num">${a}</div></div><div class="card"><div class="muted">مسارات الدعم</div><div class="num">${sp}</div></div><div class="card"><div class="muted">سيناريوهات التعليم الصريح</div><div class="num">${cache.explicit.length}</div></div></div><div class="grid cols3" style="margin-top:14px">${nav.slice(1,-1).filter(x=>!['arabic','french','math','fluency','tracking'].includes(x[0])).map(x=>`<div class="card module" onclick="go('${x[0]}')"><div class="ico">${x[1]}</div><h3>${txt(x)}</h3><div class="muted small">فتح الوحدة والعمل مباشرة</div></div>`).join('')}</div>`)}
function classesPage(){let rows=cache.classes.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.school_year||'2026/2027')}</td><td>${esc(x.teacher_id||'')}</td><td><button class="btn danger small" onclick="del('classes','${x.id}')">حذف</button></td></tr>`).join('');return shell('🏫 الأقسام','إضافة وتعديل الأقسام في السحابة',`<div class="card"><form onsubmit="saveClass(event)" class="grid cols3"><div class="field"><label>اسم القسم</label><input id="cname" required placeholder="المستوى الخامس 1"></div><div class="field"><label>السنة الدراسية</label><input id="cyear" value="2026/2027"></div><div class="field"><label>الأستاذ</label><input id="cteacher" value="${esc(user.id)}"></div><div><button class="btn primary">➕ حفظ القسم</button></div></form></div><div class="card tablewrap"><table class="table"><thead><tr><th>القسم</th><th>السنة</th><th>الأستاذ</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="muted">لا توجد أقسام بعد</td></tr>'}</tbody></table></div>`)}
async function saveClass(e){e.preventDefault();if(!schoolId)return toast('لا توجد مؤسسة مرتبطة بهذا الحساب');let r=await sb.from('classes').insert({school_id:schoolId,name:$('cname').value.trim(),school_year:$('cyear').value.trim(),teacher_id:$('cteacher').value.trim()||null});if(r.error)return toast(r.error.message);toast('تم حفظ القسم');await refresh();render()}
function studentsPage(){let opts=cache.classes.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');let rows=cache.students.map(x=>`<tr><td>${esc(x.student_code||'')}</td><td><b>${esc(x.first_name)} ${esc(x.last_name)}</b></td><td>${esc(x.gender||'')}</td><td>${esc(cache.classes.find(c=>c.id===x.class_id)?.name||'')}</td><td><button class="btn light small" onclick="studentCard('${x.id}')">الملف</button> <button class="btn danger small" onclick="del('students','${x.id}')">حذف</button></td></tr>`).join('');return shell('👥 التلاميذ','سجل رقمي وملف فردي لكل متعلم',`<div class="card"><form onsubmit="saveStudent(event)" class="grid cols3"><div class="field"><label>الاسم</label><input id="sf" required></div><div class="field"><label>النسب</label><input id="sl" required></div><div class="field"><label>رقم التلميذ</label><input id="scode"></div><div class="field"><label>القسم</label><select id="sclass"><option value="">بدون قسم</option>${opts}</select></div><div class="field"><label>الجنس</label><select id="sg"><option value="">—</option><option>ذكر</option><option>أنثى</option></select></div><div class="field"><label>ملاحظات</label><input id="snotes"></div><div><button class="btn primary">➕ إضافة التلميذ</button></div></form></div><div class="card tablewrap"><table class="table"><thead><tr><th>الرمز</th><th>التلميذ</th><th>الجنس</th><th>القسم</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="muted">لا يوجد تلاميذ</td></tr>'}</tbody></table></div>`)}
async function saveStudent(e){e.preventDefault();let r=await sb.from('students').insert({school_id:schoolId,first_name:$('sf').value.trim(),last_name:$('sl').value.trim(),student_code:$('scode').value.trim()||null,class_id:$('sclass').value||null,gender:$('sg').value||null,notes:$('snotes').value.trim()||null});if(r.error)return toast(r.error.message);toast('تمت إضافة التلميذ');await refresh();render()}
async function studentCard(id){let s=cache.students.find(x=>x.id===id);if(!s)return;let [a,t,sp,f,m]=await Promise.all([sb.from('assessments').select('*').eq('student_id',id).order('assessed_at',{ascending:false}),sb.from('tracking_records').select('*').eq('student_id',id).order('observed_at',{ascending:false}),sb.from('support_paths').select('*').eq('student_id',id).order('created_at',{ascending:false}),sb.from('fluency_records').select('*').eq('student_id',id).order('observed_at',{ascending:false}),sb.from('math_validations').select('*').eq('student_id',id).order('validated_at',{ascending:false})]);openModal(`<h2>📁 الملف الفردي</h2><h3>${esc(s.first_name)} ${esc(s.last_name)}</h3><p class="muted">${esc(s.notes||'لا توجد ملاحظات')}</p><hr><h3>الروائز</h3>${(a.data||[]).map(x=>`<p>${esc(x.title)} — <b>${x.score??'—'}</b> ${esc(x.mastery||'')}</p>`).join('')||'<p class="muted">لا توجد نتائج</p>'}<h3>التتبع</h3>${(t.data||[]).slice(0,10).map(x=>`<p>${esc(x.domain)} · ${esc(x.criterion)} — ${esc(x.mastery||'')}</p>`).join('')||'<p class="muted">لا يوجد</p>'}<h3>الدعم</h3>${(sp.data||[]).map(x=>`<p>${esc(x.subject)} · ${esc(x.pathway)} — ${x.progress||0}%</p>`).join('')||'<p class="muted">لا يوجد</p>'}<h3>الطلاقة</h3>${(f.data||[]).slice(0,5).map(x=>`<p>${x.words_per_minute||0} كلمة/د · ${x.accuracy||0}% · ${esc(x.mastery||'')}</p>`).join('')||'<p class="muted">لا يوجد</p>'}<h3>الرياضيات</h3>${(m.data||[]).slice(0,5).map(x=>`<p>${esc(x.block_name)} — ${esc(x.mastery||'')}</p>`).join('')||'<p class="muted">لا يوجد</p>'}`)}
function assessmentsPage(){let students=cache.students.map(x=>`<option value="${x.id}">${esc(x.first_name)} ${esc(x.last_name)}</option>`).join('');let rows=cache.assessments.slice(0,50).map(x=>`<tr><td>${esc(cache.students.find(s=>s.id===x.student_id)?.first_name||'')}</td><td>${esc(x.title)}</td><td>${esc(x.kind)}</td><td>${x.score??'—'}</td><td>${esc(x.mastery||'')}</td><td><button class="btn danger small" onclick="del('assessments','${x.id}')">حذف</button></td></tr>`).join('');return shell('📝 الروائز والتقويم','تسجيل النتائج وتحليلها وربطها بالملف الفردي',`<div class="card"><form onsubmit="saveAssessment(event)" class="grid cols3"><div class="field"><label>التلميذ</label><select id="astudent" required>${students}</select></div><div class="field"><label>نوع الرائز</label><select id="akind"><option>قبلي</option><option>تكويني</option><option>بعدي</option><option>تشخيصي</option></select></div><div class="field"><label>العنوان</label><input id="atitle" required></div><div class="field"><label>النقطة</label><input id="ascore" type="number" min="0" max="100"></div><div class="field"><label>الإتقان</label><select id="amastery"><option>متحكم</option><option>في طور التحكم</option><option>غير متحكم</option></select></div><div><button class="btn primary">💾 حفظ النتيجة</button></div></form></div><div class="card tablewrap"><table class="table"><thead><tr><th>التلميذ</th><th>الرائز</th><th>النوع</th><th>النقطة</th><th>الإتقان</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">لا توجد نتائج</td></tr>'}</tbody></table></div>`)}
async function saveAssessment(e){e.preventDefault();let r=await sb.from('assessments').insert({school_id:schoolId,student_id:$('astudent').value,class_id:cache.students.find(s=>s.id===$('astudent').value)?.class_id||null,kind:$('akind').value,title:$('atitle').value.trim(),score:$('ascore').value?Number($('ascore').value):null,mastery:$('amastery').value,criteria:{},created_by:user.id});if(r.error)return toast(r.error.message);toast('تم حفظ الرائز');await refresh();render()}
function supportPage(){let st=cache.students.map(x=>`<option value="${x.id}">${esc(x.first_name)} ${esc(x.last_name)}</option>`).join('');let rows=cache.support.map(x=>`<tr><td>${esc(cache.students.find(s=>s.id===x.student_id)?.first_name||'')}</td><td>${esc(x.subject)}</td><td>${esc(x.pathway)}</td><td>${x.progress||0}%</td><td>${esc(x.status)}</td><td><button class="btn danger small" onclick="del('support_paths','${x.id}')">حذف</button></td></tr>`).join('');return shell('🎯 مسارات الدعم','إنشاء وتتبع مسار دعم فردي',`<div class="card"><form onsubmit="saveSupport(event)" class="grid cols3"><div class="field"><label>التلميذ</label><select id="pst" required>${st}</select></div><div class="field"><label>المادة</label><select id="psub"><option>العربية</option><option>الفرنسية</option><option>الرياضيات</option></select></div><div class="field"><label>المسار</label><input id="ppath" required placeholder="مسار القراءة / الحساب..."></div><div class="field"><label>المستوى</label><input id="plevel"></div><div class="field"><label>الأهداف</label><textarea id="pobj"></textarea></div><div class="field"><label>الأنشطة</label><textarea id="pact"></textarea></div><div><button class="btn primary">➕ إنشاء المسار</button></div></form></div><div class="card tablewrap"><table class="table"><thead><tr><th>التلميذ</th><th>المادة</th><th>المسار</th><th>التقدم</th><th>الحالة</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">لا توجد مسارات</td></tr>'}</tbody></table></div>`)}

async function saveCertification(e){e.preventDefault();let r=await sb.from('block_certifications').insert({block_id:$('bblock').value,student_id:$('bst').value,status:$('bstatus').value,score:$('bscore').value?Number($('bscore').value):null,evidence:{},certified_by:user.id,certified_at:new Date().toISOString()});if(r.error)return toast(r.error.message);toast('تم حفظ التصديق')}
function explicitPage(){return shell('🎓 التعليم الصريح','بناء سيناريو كامل من الهدف إلى المعالجة والدعم',`<div class="card"><form onsubmit="saveExplicit(event)" class="grid cols2"><div class="field"><label>المادة</label><select id="esub"><option>العربية</option><option>Français</option><option>الرياضيات</option></select></div><div class="field"><label>اللغة</label><select id="elang"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select></div><div class="field"><label>عنوان الدرس</label><input id="etitle" required></div><div class="field"><label>المدة</label><input id="edur" type="number" value="45"></div><div class="field"><label>الهدف</label><textarea id="eobj"></textarea></div><div class="field"><label>استحضار المكتسبات</label><textarea id="eprior"></textarea></div><div class="field"><label>النمذجة — Je fais</label><textarea id="emod"></textarea></div><div class="field"><label>الممارسة الموجهة — Nous faisons</label><textarea id="eguided"></textarea></div><div class="field"><label>الممارسة المستقلة — Vous faites</label><textarea id="eind"></textarea></div><div class="field"><label>التحقق من الفهم</label><textarea id="echeck"></textarea></div><div class="field"><label>التقويم</label><textarea id="eass"></textarea></div><div class="field"><label>المعالجة والدعم</label><textarea id="erem"></textarea></div><div><button class="btn primary">💾 حفظ في السحابة</button></div></form></div><div class="card tablewrap"><table class="table"><thead><tr><th>العنوان</th><th>المادة</th><th>اللغة</th><th>المدة</th><th></th></tr></thead><tbody>${cache.explicit.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.subject)}</td><td>${esc(x.language)}</td><td>${x.duration_minutes||45}</td><td><button class="btn light small" onclick="printExplicit('${x.id}')">طباعة</button> <button class="btn danger small" onclick="del('explicit_lessons','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">لا توجد سيناريوهات</td></tr>'}</tbody></table></div>`)}
async function saveExplicit(e){e.preventDefault();let r=await sb.from('explicit_lessons').insert({school_id:schoolId,teacher_id:user.id,subject:$('esub').value,title:$('etitle').value.trim(),objective:$('eobj').value,prior_knowledge:$('eprior').value,modeling:$('emod').value,guided_practice:$('eguided').value,independent_practice:$('eind').value,checking_understanding:$('echeck').value,assessment:$('eass').value,remediation:$('erem').value,duration_minutes:Number($('edur').value)||45,language:$('elang').value});if(r.error)return toast(r.error.message);toast('تم حفظ سيناريو التعليم الصريح');await refresh();render()}

async function saveFluency(e){e.preventDefault();let r=await sb.from('fluency_records').insert({school_id:schoolId,class_id:cache.students.find(s=>s.id===$('fst').value)?.class_id||null,student_id:$('fst').value,level:$('flvl').value,words_per_minute:Number($('fwpm').value)||0,accuracy:Number($('facc').value)||0,mastery:$('fmastery').value,created_by:user.id});if(r.error)return toast(r.error.message);toast('تم حفظ قياس الطلاقة');await refresh();render()}
function mathPage(){return shell('➗ الرياضيات — لبنات التصديق','شبكة التصديق الخاصة بالتعلمات الأساسية',`<div class="card"><form onsubmit="saveMath(event)" class="grid cols3"><div class="field"><label>التلميذ</label><select id="mst">${cache.students.map(x=>`<option value="${x.id}">${esc(x.first_name)} ${esc(x.last_name)}</option>`).join('')}</select></div><div class="field"><label>رمز اللبنة</label><input id="mcode" required></div><div class="field"><label>اسم اللبنة</label><input id="mname" required></div><div class="field"><label>الإتقان</label><select id="mmastery"><option>متحكم</option><option>في طور التحكم</option><option>غير متحكم</option></select></div><div class="field"><label>الدليل</label><textarea id="mevidence"></textarea></div><div><button class="btn primary">💾 حفظ التصديق</button></div></form></div><div class="card tablewrap"><table class="table"><thead><tr><th>التلميذ</th><th>اللبنة</th><th>الإتقان</th><th>الدليل</th><th></th></tr></thead><tbody>${cache.math.map(x=>`<tr><td>${esc(cache.students.find(s=>s.id===x.student_id)?.first_name||'')}</td><td>${esc(x.block_name)}</td><td>${esc(x.mastery||'')}</td><td>${esc(x.evidence||'')}</td><td><button class="btn danger small" onclick="del('math_validations','${x.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`)}
async function saveMath(e){e.preventDefault();let r=await sb.from('math_validations').insert({school_id:schoolId,class_id:cache.students.find(s=>s.id===$('mst').value)?.class_id||null,student_id:$('mst').value,block_code:$('mcode').value.trim(),block_name:$('mname').value.trim(),mastery:$('mmastery').value,evidence:$('mevidence').value,created_by:user.id});if(r.error)return toast(r.error.message);toast('تم حفظ التصديق الرياضي');await refresh();render()}
function trackingPage(){return shell('📈 شبكة التتبع','تتبع دقيق حسب المجال والمعيار والإتقان',`<div class="card"><form onsubmit="saveTracking(event)" class="grid cols3"><div class="field"><label>التلميذ</label><select id="tst">${cache.students.map(x=>`<option value="${x.id}">${esc(x.first_name)} ${esc(x.last_name)}</option>`).join('')}</select></div><div class="field"><label>المجال</label><input id="tdomain" required></div><div class="field"><label>المعيار</label><input id="tcrit" required></div><div class="field"><label>الإتقان</label><select id="tmast"><option>متحكم</option><option>في طور التحكم</option><option>غير متحكم</option></select></div><div class="field"><label>القيمة</label><input id="tval" type="number"></div><div class="field"><label>ملاحظات</label><input id="tnote"></div><div><button class="btn primary">حفظ التتبع</button></div></form></div><div class="card tablewrap"><table class="table"><thead><tr><th>التلميذ</th><th>المجال</th><th>المعيار</th><th>الإتقان</th><th>ملاحظات</th><th></th></tr></thead><tbody>${cache.tracking.slice(0,80).map(x=>`<tr><td>${esc(cache.students.find(s=>s.id===x.student_id)?.first_name||'')}</td><td>${esc(x.domain)}</td><td>${esc(x.criterion)}</td><td>${esc(x.mastery||'')}</td><td>${esc(x.notes||'')}</td><td><button class="btn danger small" onclick="del('tracking_records','${x.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`)}
async function saveTracking(e){e.preventDefault();let r=await sb.from('tracking_records').insert({school_id:schoolId,class_id:cache.students.find(s=>s.id===$('tst').value)?.class_id||null,student_id:$('tst').value,domain:$('tdomain').value.trim(),criterion:$('tcrit').value.trim(),mastery:$('tmast').value,value:$('tval').value?Number($('tval').value):null,notes:$('tnote').value,created_by:user.id});if(r.error)return toast(r.error.message);toast('تم حفظ التتبع');await refresh();render()}
function reportsPage(){let mastered=cache.assessments.filter(x=>x.mastery==='متحكم').length,total=cache.assessments.length;let rate=total?Math.round(mastered/total*100):0;return shell('📄 التقارير','لوحات مؤشرات قابلة للطباعة والتصدير',`<div class="grid cols3"><div class="card"><div class="muted">نسبة الإتقان في الروائز</div><div class="num">${rate}%</div></div><div class="card"><div class="muted">التلاميذ في الدعم</div><div class="num">${cache.support.length}</div></div><div class="card"><div class="muted">قياسات الطلاقة</div><div class="num">${cache.fluency.length}</div></div></div><div class="card"><button class="btn primary" onclick="printReport()">🖨️ تقرير المؤسسة — طباعة/PDF</button> <button class="btn light" onclick="downloadAll()">⬇️ JSON</button> <button class="btn light" onclick="downloadCSV('assessments')">📊 CSV</button></div>`)}
function printReport(){let w=window.open('','_blank');w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>تقرير رَوّاد</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px}</style></head><body><h1>رَوّاد — تقرير تربوي</h1><p>السنة الدراسية 2026/2027</p><h2>المؤشرات</h2><p>التلاميذ: ${cache.students.length} — الأقسام: ${cache.classes.length} — الروائز: ${cache.assessments.length} — الدعم: ${cache.support.length}</p><h2>الروائز</h2><table><tr><th>التلميذ</th><th>الرائز</th><th>النقطة</th><th>الإتقان</th></tr>${cache.assessments.map(x=>`<tr><td>${esc(cache.students.find(s=>s.id===x.student_id)?.first_name||'')}</td><td>${esc(x.title)}</td><td>${x.score??''}</td><td>${esc(x.mastery||'')}</td></tr>`).join('')}</table><script>window.print()<\/script></body></html>`);w.document.close()}
function aiPage(){return shell('🤖 مركز الذكاء الاصطناعي','مساعد تربوي مدمج مع سياق المنصة. يعمل فورًا بقوالب ذكية، ويمكن ربط مزود LLM آمنًا من الخادم لاحقًا.',`<div class="card"><form onsubmit="generateAI(event)" class="grid cols2"><div class="field"><label>المهمة</label><select id="ait"><option value="lesson">توليد جذاذة</option><option value="explicit">توليد سيناريو تعليم صريح</option><option value="support">اقتراح مسار دعم</option><option value="analysis">تحليل نتائج رائز</option><option value="mindmap">إنشاء خريطة ذهنية</option><option value="report">صياغة تقرير</option></select></div><div class="field"><label>اللغة</label><select id="ail"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select></div><div class="field full"><label>المعطيات</label><textarea id="aip" required placeholder="مثلاً: المستوى الخامس، الفرنسية، درس les animaux..."></textarea></div><div><button class="btn primary">🧠 توليد الآن</button></div></form></div><div id="aiout" class="card hidden"></div><div class="card"><h3>سجل الطلبات</h3>${(cache.ai||[]).map(x=>`<p><b>${esc(x.module_key)}</b> — ${esc(x.prompt)}</p>`).join('')||'<p class="muted">سيظهر هنا سجل الاستعمال.</p>'}</div>`)}
async function generateAI(e){e.preventDefault();let task=$('ait').value,lang2=$('ail').value,prompt=$('aip').value.trim();let templates={lesson:`جذاذة مقترحة حول: ${prompt}\n1. الهدف\n2. استحضار المكتسبات\n3. تقديم وبناء التعلم\n4. ممارسة موجهة\n5. ممارسة مستقلة\n6. تقويم\n7. دعم ومعالجة`,explicit:`سيناريو التعليم الصريح حول: ${prompt}\nالهدف: تحديد التعلم بدقة.\nJe fais: نمذجة واضحة من طرف الأستاذ.\nNous faisons: ممارسة موجهة مع التحقق من الفهم.\nVous faites: ممارسة مستقلة.\nتقويم ثم معالجة المتعثرين.`,support:`مسار دعم مقترح لـ ${prompt}: تشخيص → تحديد التعثر → هدف قصير → أنشطة متدرجة → ممارسة موجهة → ممارسة مستقلة → تقويم بعدي → قرار الاستمرار أو الخروج من الدعم.`,analysis:`تحليل تربوي أولي لـ ${prompt}: حدد نسبة الإتقان، أكثر المعايير تعثرًا، الفئة المستهدفة، ثم اقترح تدخلًا قصير المدى وقياسًا بعديًا.`,mindmap:`خريطة ذهنية مختصرة لـ ${prompt}:\n• المفهوم المركزي\n• الأفكار الرئيسية\n• المفاهيم الفرعية\n• أمثلة/تطبيقات\n• خلاصة`,report:`تقرير تربوي حول ${prompt}: الوضعية الحالية → المعطيات → أهم الملاحظات → الإجراءات المنجزة → النتائج → التوصيات.`};let result=templates[task];let r=await sb.from('ai_generations').insert({user_id:user.id,module_key:task,prompt,result:{text:result,language:lang2,engine:'Riyadah Smart Templates'},model:'Riyadah-V16-local'});if(r.error)return toast(r.error.message);$('aiout').classList.remove('hidden');$('aiout').innerHTML=`<h3>النتيجة</h3><pre style="white-space:pre-wrap;font:inherit;line-height:1.8">${esc(result)}</pre><button class="btn primary" onclick="downloadText('riyadah-ai.txt',${JSON.stringify(result)})">⬇️ تحميل</button>`;toast('تم التوليد والحفظ في السحابة')}
function resourcesPage(){return shell('📚 الموارد والجذاذات','حفظ الجذاذات والخطط والخرائط الذهنية',`<div class="card"><form onsubmit="saveLesson(event)" class="grid cols2"><div class="field"><label>العنوان</label><input id="ltitle" required></div><div class="field"><label>المادة</label><input id="lsub"></div><div class="field"><label>المستوى</label><input id="llvl"></div><div class="field"><label>المحتوى</label><textarea id="lcontent"></textarea></div><div><button class="btn primary">💾 حفظ المورد</button></div></form></div><div class="card">${cache.lessons.map(x=>`<div style="border-bottom:1px solid #eee;padding:10px"><b>${esc(x.title)}</b><div class="muted">${esc(x.subject_id||'')} · ${esc(x.content?.text||'')}</div></div>`).join('')||'<p class="muted">لا توجد موارد بعد</p>'}</div>`)}
async function saveLesson(e){e.preventDefault();let r=await sb.from('lesson_plans').insert({school_id:schoolId,title:$('ltitle').value.trim(),content:{text:$('lcontent').value,subject:$('lsub').value,level:$('llvl').value},created_by:user.id});if(r.error)return toast(r.error.message);toast('تم حفظ المورد');await refresh();render()}
function parentsPage(){if(profile.role==='parent')return parentPortal();return shell('👨‍👩‍👧 بوابة الآباء','إدارة الربط والتواصل مع الأسر',`<div class="card"><p class="muted">يمكن ربط حساب ولي الأمر بالتلميذ عبر parent_links. بعد الربط يرى ولي الأمر أبناءه فقط.</p><h3>رسالة لولي الأمر</h3><form onsubmit="sendParent(event)" class="grid cols2"><div class="field"><label>معرّف ولي الأمر</label><input id="pmparent" required></div><div class="field"><label>التلميذ</label><select id="pmstudent">${cache.students.map(x=>`<option value="${x.id}">${esc(x.first_name)} ${esc(x.last_name)}</option>`).join('')}</select></div><div class="field"><label>الموضوع</label><input id="pmsub"></div><div class="field"><label>الرسالة</label><textarea id="pmbody" required></textarea></div><div><button class="btn primary">إرسال الرسالة</button></div></form></div>`)}
function parentPortal(){return shell('👨‍👩‍👧 فضاء ولي الأمر','متابعة الأبناء والتواصل مع المدرسة',`<div class="grid cols3">${cache.students.map(s=>`<div class="card"><h3>${esc(s.first_name)} ${esc(s.last_name)}</h3><p class="muted">${esc(s.notes||'')}</p><span class="badge">ملف نشط</span></div>`).join('')||'<div class="card"><p>لا يوجد أبناء مرتبطون بهذا الحساب.</p></div>'}</div><div class="card"><h3>الرسائل</h3>${(cache.messages||[]).map(x=>`<div style="border-bottom:1px solid #eee;padding:10px"><b>${esc(x.subject||'رسالة')}</b><p>${esc(x.body)}</p></div>`).join('')||'<p class="muted">لا توجد رسائل.</p>'}</div>`)}
async function sendParent(e){e.preventDefault();let r=await sb.from('parent_messages').insert({parent_user_id:$('pmparent').value.trim(),teacher_user_id:user.id,student_id:$('pmstudent').value,subject:$('pmsub').value,body:$('pmbody').value});if(r.error)return toast(r.error.message);toast('تم إرسال الرسالة')}
function inspectorPage(){return shell('🧭 التأطير والمفتشة','لوحة قراءة للمؤشرات والمتابعة',`<div class="grid cols3"><div class="card"><b>التلاميذ</b><div class="num">${cache.students.length}</div></div><div class="card"><b>الروائز</b><div class="num">${cache.assessments.length}</div></div><div class="card"><b>مسارات الدعم</b><div class="num">${cache.support.length}</div></div></div><div class="card"><h3>مؤشرات سريعة</h3><p>التقدم في الطلاقة: ${cache.fluency.length} قياسًا.</p><p>التتبع: ${cache.tracking.length} سجلًا.</p><p>التصديق الرياضي: ${cache.math.length} سجلًا.</p></div>`)}
function settingsPage(){return shell('⚙️ الإعدادات والحساب','اللغة، معلومات الحساب، وتكاملات المنصة',`<div class="card"><div class="grid cols2"><div><b>الاسم</b><p>${esc(profile.full_name||'')}</p></div><div><b>الدور</b><p><span class="badge">${esc(profile.role)}</span></p></div><div><b>البريد</b><p>${esc(user.email||'')}</p></div><div><b>المؤسسة</b><p>${esc(profile.school_name||'')}</p></div></div></div><div class="card"><h3>التكاملات</h3><p class="muted">Google Classroom / Canva / مسار يمكن فتحها أو ربطها لاحقًا دون تغيير بنية البيانات.</p><div class="toolbar"><button class="btn light" onclick="window.open('https://classroom.google.com','_blank')">Google Classroom</button><button class="btn light" onclick="window.open('https://www.canva.com','_blank')">Canva</button></div></div>`)}
async function ownerPage(){let s=await sb.from('platform_settings').select('*').eq('id',true).maybeSingle();let modules=await sb.from('platform_modules').select('*').order('sort_order');return shell('👑 مركز التطوير المستقبلي','هذه المنطقة محجوزة لمالك المنصة فقط',`<div class="card"><p>المالك: <b>${esc(s.data?.owner_user_id||'غير مضبوط')}</b></p><p>AI: ${s.data?.ai_enabled?'مفعل':'معطل'} · بوابة الآباء: ${s.data?.parent_portal_enabled?'مفعلة':'معطلة'}</p></div><div class="card"><h3>إدارة الوحدات</h3>${(modules.data||[]).map(x=>`<div class="toolbar" style="justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span>${esc(x.name_ar)}</span><button class="btn ${x.enabled?'primary':'light'} small" onclick="toggleModule('${x.id}',${!x.enabled})">${x.enabled?'مفعلة':'معطلة'}</button></div>`).join('')}</div><div class="card"><h3>إصدارات المنصة</h3><form onsubmit="saveRelease(event)" class="grid cols3"><div class="field"><label>الإصدار</label><input id="rv" value="V16.0.0"></div><div class="field"><label>العنوان</label><input id="rt" value="رَوّاد V16"></div><div class="field"><label>ملاحظات</label><input id="rn"></div><div><button class="btn primary">حفظ الإصدار</button></div></form></div>`)}
async function toggleModule(id,en){let r=await sb.from('platform_modules').update({enabled:en,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);toast('تم تحديث الوحدة');render()}
async function saveRelease(e){e.preventDefault();let r=await sb.from('platform_releases').insert({version:$('rv').value,title:$('rt').value,notes:$('rn').value,status:'draft'});if(r.error)return toast(r.error.message);toast('تم حفظ الإصدار')}
async function del(table,id){if(!confirm('حذف هذا السجل؟'))return;let r=await sb.from(table).delete().eq('id',id);if(r.error)return toast(r.error.message);toast('تم الحذف');await refresh();render()}
async function downloadAll(){let d={version:'V16',exported_at:new Date().toISOString(),profile,classes:cache.classes,students:cache.students,assessments:cache.assessments,support_paths:cache.support,explicit_lessons:cache.explicit,tracking:cache.tracking,fluency:cache.fluency,math_validations:cache.math};downloadText('riyadah-v16-export.json',JSON.stringify(d,null,2))}
function downloadCSV(k){let rows=cache[k]||[];if(!rows.length)return toast('لا توجد بيانات');let keys=Object.keys(rows[0]);let csv=[keys,...rows.map(r=>keys.map(x=>r[x]))].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');downloadText('riyadah-'+k+'.csv',csv)}function downloadText(name,text){let b=new Blob([text],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function openModal(html){$('modalBox').innerHTML=html+`<div style="margin-top:14px"><button class="btn light" onclick="closeModal()">إغلاق</button></div>`;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}async function logout(){await sb.auth.signOut({scope:'local'});location.href='/'}
boot().catch(e=>{console.error(e);toast('تعذر تحميل المنصة: '+e.message)});
</script></body></html>
