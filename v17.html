</style></head><body><header class="top"><div class="bar"><div class="brand"><div class="logo">ر</div><div><h1>رَوّاد V17</h1><div class="muted">منصة مؤسسات الريادة — سحابية ومتعددة الأدوار</div></div></div><div class="toolbar"><button class="btn light" onclick="cycleLang()">عربي / FR / EN</button><button class="btn light" onclick="printPage()">🖨️ طباعة</button><button class="btn danger" onclick="logout()">خروج</button></div></div></header><main class="wrap"><div class="layout"><aside class="side" id="side"></aside><section class="content" id="page"></section></div></main><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><script>
const U='https://bnqbavlkvrpcbhqxctda.supabase.co',K='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q';const sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let user,profile,schoolId,lang='ar',active='dashboard';let C={classes:[],students:[],assessments:[],support:[],tracking:[],fluency:[],math:[],blocks:[],lessons:[],explicit:[],messages:[],parents:[]};const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const NAV=[['dashboard','📊','لوحة القيادة','Tableau de bord','Dashboard'],['classes','🏫','الأقسام','Classes','Classes'],['students','👥','التلاميذ','Élèves','Students'],['assessments','📝','الروائز والتقويم','Évaluations','Assessments'],['support','🎯','TaRL والدعم','TaRL et soutien','TaRL & Support'],['blocks','🧩','اللبنات والإشهاد','Blocs et certification','Learning blocks'],['explicit','🎓','التعليم الصريح','Enseignement explicite','Explicit teaching'],['arabic','ع','العربية','Arabe','Arabic'],['french','Fr','الفرنسية','Français','French'],['math','∑','الرياضيات','Mathématiques','Mathematics'],['fluency','⚡','الطلاقة','Fluidité','Fluency'],['tracking','📈','التتبع','Suivi','Tracking'],['reports','📄','التقارير والتصدير','Rapports','Reports'],['ai','🤖','المساعد الذكي','Assistant IA','AI assistant'],['mindmap','🧠','الخريطة الذهنية','Carte mentale','Mind map'],['resources','📚','الموارد والجذاذات','Ressources','Resources'],['parents','👨‍👩‍👧','بوابة الأسرة','Portail famille','Family portal'],['inspector','🧭','المفتشة والتأطير','Inspection','Inspection'],['settings','⚙️','الإعدادات','Paramètres','Settings']];
function T(x){return lang==='ar'?x[2]:lang==='fr'?x[3]:x[4]}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>$('toast').style.display='none',2500)}function cycleLang(){lang=lang==='ar'?'fr':lang==='fr'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';nav();render()}function go(k){active=k;nav();render()}function nav(){let allow=NAV;if(profile?.role==='parent')allow=NAV.filter(x=>['dashboard','students','assessments','parents','settings'].includes(x[0]));if(profile?.role==='inspector')allow=NAV.filter(x=>['dashboard','students','assessments','support','blocks','tracking','reports','inspector','settings'].includes(x[0]));if(user?.id==='b33ae385-7f09-498b-a080-6d07f0a8e502')allow=[...allow,['owner','👑','مركز التطوير','Centre propriétaire','Owner development']];$('side').innerHTML=allow.map(x=>`<button class="nav ${active===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} ${T(x)}</button>`).join('')}
async function boot(){let r=await sb.auth.getUser();if(r.error||!r.data?.user){location.replace('/');return}user=r.data.user;let p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.error||!p.data||p.data.is_active===false){await sb.auth.signOut({scope:'local'});location.replace('/');return}profile=p.data;let m=await sb.from('school_memberships').select('school_id').eq('user_id',user.id).eq('status','active').limit(1).maybeSingle();schoolId=m.data?.school_id||null;if(!schoolId&&profile.role!=='parent'){let s=await sb.from('schools').select('id').eq('created_by',user.id).limit(1).maybeSingle();schoolId=s.data?.id||null}nav();await refresh();render()}
async function q(table,columns='*',filter=true){if(!schoolId)return[];let z=sb.from(table).select(columns);if(filter)z=z.eq('school_id',schoolId);let r=await z.limit(1000);return r.data||[]}
async function refresh(){if(profile.role==='parent'){let l=await sb.from('parent_links').select('student_id,relationship,status').eq('parent_user_id',user.id).eq('status','active');C.parents=l.data||[];let ids=C.parents.map(x=>x.student_id);C.students=ids.length?(await sb.from('students').select('*').in('id',ids)).data||[]:[];C.assessments=[];return}const tables=['classes','students','assessments','support_paths','tracking_records','fluency_records','math_validations','learning_blocks','lesson_plans','explicit_lessons'];const keys=['classes','students','assessments','support','tracking','fluency','math','blocks','lessons','explicit'];for(let i=0;i<tables.length;i++)C[keys[i]]=await q(tables[i]);if(profile.role==='admin'){let p=await sb.from('profiles').select('id,full_name,role,is_active,school_name').order('created_at');C.profiles=p.data||[]}}
function shell(title,sub,body,actions=''){return `<div class="card"><div class="toolbar" style="justify-content:space-between"><div><h2 style="margin:0">${title}</h2><div class="muted">${sub||''}</div></div>${actions}</div></div>${body}`}
function dashboard(){let s=C.students.length,c=C.classes.length,a=C.assessments.length,sp=C.support.length;let weak=C.assessments.filter(x=>Number(x.score??x.result??0)<50).length;return shell(`مرحبا، ${esc(profile.full_name||user.email)}`,(profile.school_name||'')+' · 2026/2027',`<div class="grid stats"><div class="card"><div class="muted">التلاميذ</div><div class="num">${s}</div></div><div class="card"><div class="muted">الأقسام</div><div class="num">${c}</div></div><div class="card"><div class="muted">الروائز</div><div class="num">${a}</div></div><div class="card"><div class="muted">الدعم</div><div class="num">${sp}</div></div><div class="card"><div class="muted">تعثرات ظاهرة</div><div class="num">${weak}</div></div><div class="card"><div class="muted">الطلاقة</div><div class="num">${C.fluency.length}</div></div></div><div class="card"><h3>🚦 تنبيهات قابلة للتنفيذ</h3>${weak?`<div class="alert a-red">${weak} نتائج أقل من 50% — افتح الروائز وحدد مسار الدعم.</div>`:'<div class="alert a-green">لا توجد نتائج منخفضة ظاهرة في البيانات الحالية.</div>'}${C.students.length&&!C.assessments.length?'<div class="alert a-orange">أضف الرائز القبلي حتى يبدأ التشخيص الآلي.</div>':''}</div><div class="grid g3">${NAV.slice(1).filter(x=>!['arabic','french','math','fluency','tracking'].includes(x[0])).map(x=>`<div class="card module" onclick="go('${x[0]}')"><div class="ico">${x[1]}</div><h3>${T(x)}</h3><div class="muted small">فتح الوحدة والعمل مباشرة</div></div>`).join('')}</div>`)}
async function insert(table,payload){let r=await sb.from(table).insert({...payload,school_id:schoolId}).select().single();if(r.error)throw r.error;await refresh();render();toast('تم الحفظ في السحابة')}async function remove(table,id){if(!confirm('تأكيد الحذف؟'))return;let r=await sb.from(table).delete().eq('id',id);if(r.error)toast(r.error.message);else{await refresh();render();toast('تم الحذف')}}
function classesPage(){let rows=C.classes.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.school_year||'')}</td><td><button class="btn danger" onclick="remove('classes','${x.id}')">حذف</button></td></tr>`).join('');return shell('🏫 الأقسام','إدارة الأقسام سحابياً',`<div class="card"><form onsubmit="event.preventDefault();saveClass()" class="grid g3"><div class="field"><label>اسم القسم</label><input id="cn" required placeholder="المستوى الخامس 1"></div><div class="field"><label>السنة الدراسية</label><input id="cy" value="2026/2027"></div><div><button class="btn primary">➕ إضافة</button></div></form></div><div class="card tablewrap"><table class="table"><thead><tr><th>القسم</th><th>السنة</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="muted">لا توجد أقسام</td></tr>'}</tbody></table></div>`)}async function saveClass(){try{await insert('classes',{name:$('cn').value.trim(),school_year:$('cy').value.trim(),teacher_id:user.id})}catch(e){toast(e.message)}}
function studentsPage(){let rows=C.students.map(x=>`<tr><td><button class="btn light" onclick="student('${x.id}')">${esc((x.first_name||'')+' '+(x.last_name||''))}</button></td><td>${esc(x.student_code||'')}</td><td>${esc(x.gender||'')}</td><td>${esc(x.notes||'')}</td><td><button class="btn danger" onclick="remove('students','${x.id}')">حذف</button></td></tr>`).join('');return shell('👥 التلاميذ','ملف فردي تراكمي لكل متعلم',`<div class="card"><form onsubmit="event.preventDefault();saveStudent()" class="grid g3"><div class="field"><label>الاسم</label><input id="sf" required></div><div class="field"><label>النسب</label><input id="sl"></div><div class="field"><label>رمز التلميذ</label><input id="sc"></div><div class="field"><label>القسم</label><select id="sclass"><option value="">بدون قسم</option>${C.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>الجنس</label><select id="sg"><option value="">—</option><option>ذكر</option><option>أنثى</option></select></div><div class="field"><label>ملاحظات</label><input id="snote"></div><div><button class="btn primary">➕ إضافة التلميذ</button></div></form></div><div class="card tablewrap"><table class="table"><thead><tr><th>التلميذ</th><th>الرمز</th><th>الجنس</th><th>ملاحظات</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="muted">لا يوجد تلاميذ</td></tr>'}</tbody></table></div>`)}async function saveStudent(){try{await insert('students',{first_name:$('sf').value.trim(),last_name:$('sl').value.trim(),student_code:$('sc').value.trim(),class_id:$('sclass').value||null,gender:$('sg').value,notes:$('snote').value.trim()})}catch(e){toast(e.message)}}
function student(id){let s=C.students.find(x=>x.id===id);if(!s)return;let A=C.assessments.filter(x=>x.student_id===id),S=C.support.filter(x=>x.student_id===id),F=C.fluency.filter(x=>x.student_id===id),M=C.math.filter(x=>x.student_id===id),Tt=C.tracking.filter(x=>x.student_id===id);$('modalbox').innerHTML=`<h2>📁 ملف ${esc((s.first_name||'')+' '+(s.last_name||''))}</h2><p class="muted">رمز: ${esc(s.student_code||'—')}</p><div class="grid g3"><div class="card"><b>${A.length}</b><div class="muted">تقويمات</div></div><div class="card"><b>${S.length}</b><div class="muted">مسارات دعم</div></div><div class="card"><b>${F.length}</b><div class="muted">قياسات طلاقة</div></div></div><h3>التقويم</h3><div class="tablewrap"><table class="table"><tr><th>المادة</th><th>النتيجة</th><th>التاريخ</th></tr>${A.map(x=>`<tr><td>${esc(x.subject||'')}</td><td>${esc(x.score??x.result??'')}</td><td>${esc(x.assessed_at||'')}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد بيانات</td></tr>'}</table></div><h3>الدعم</h3><p>${S.map(x=>esc(x.path||x.level||x.status||'مسار دعم')).join(' · ')||'لا توجد بيانات'}</p><h3>الطلاقة</h3><p>${F.map(x=>`${esc(x.words_per_minute||'—')} كلمة/د · ${esc(x.accuracy||'—')}%`).join(' | ')||'لا توجد بيانات'}</p><h3>الرياضيات</h3><p>${M.map(x=>`${esc(x.domain||'')} ${esc(x.score??x.mastery??'')}`).join(' | ')||'لا توجد بيانات'}</p><h3>التتبع</h3><p>${Tt.map(x=>`${esc(x.skill||'')} — ${esc(x.mastery||'')}`).join(' | ')||'لا توجد بيانات'}</p><button class="btn dark" onclick="closeModal()">إغلاق</button>`;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function assessmentsPage(){return shell('📝 الروائز والتقويم','التشخيص القبلي، المرحلي والبعدي',`<div class="card"><form onsubmit="event.preventDefault();saveAssessment()" class="grid g3"><div class="field"><label>التلميذ</label><select id="ast">${C.students.map(s=>`<option value="${s.id}">${esc((s.first_name||'')+' '+(s.last_name||''))}</option>`).join('')}</select></div><div class="field"><label>المادة</label><select id="asub"><option>العربية</option><option>الفرنسية</option><option>الرياضيات</option></select></div><div class="field"><label>نوع الرائز</label><select id="atype"><option>قبلي</option><option>مرحلي</option><option>بعدي</option></select></div><div class="field"><label>النتيجة %</label><input id="ascore" type="number" min="0" max="100" required></div><div class="field"><label>ملاحظات</label><input id="anote"></div><div><button class="btn primary">➕ تسجيل النتيجة</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>المادة</th><th>النوع</th><th>النتيجة</th><th></th></tr>${C.assessments.map(x=>{let s=C.students.find(z=>z.id===x.student_id);return `<tr><td>${esc(s?(s.first_name+' '+s.last_name):x.student_id)}</td><td>${esc(x.subject||'')}</td><td>${esc(x.assessment_type||x.type||'')}</td><td>${esc(x.score??x.result??'')}</td><td><button class="btn danger" onclick="remove('assessments','${x.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="5">لا توجد نتائج</td></tr>'}</table></div>`)}async function saveAssessment(){try{await insert('assessments',{student_id:$('ast').value,subject:$('asub').value,assessment_type:$('atype').value,score:Number($('ascore').value),notes:$('anote').value,assessed_at:new Date().toISOString()})}catch(e){toast(e.message)}}
function supportPage(){let weak=C.assessments.filter(x=>Number(x.score??0)<50);return shell('🎯 TaRL والدعم','تحديد مسار المتعلم ومتابعة الدعم',`<div class="card"><div class="alert a-orange">القاعدة العملية: تشخيص فردي → مجموعات متجانسة → مسار أساس / متوسط / تحدي → دعم يومي → إعادة تقويم.</div><form onsubmit="event.preventDefault();saveSupport()" class="grid g3"><div class="field"><label>التلميذ</label><select id="sst">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>المسار</label><select id="spath"><option>أساس</option><option>متوسط</option><option>تحدي</option></select></div><div class="field"><label>المادة</label><select id="ssub"><option>العربية</option><option>الفرنسية</option><option>الرياضيات</option></select></div><div class="field"><label>الحالة</label><select id="sstatus"><option>مفتوح</option><option>قيد الدعم</option><option>تحقق</option></select></div><div class="field"><label>ملاحظة</label><input id="snote"></div><div><button class="btn primary">➕ إنشاء مسار</button></div></form></div><div class="card"><h3>🔴 حالات تحتاج الانتباه</h3>${weak.slice(0,12).map(x=>{let s=C.students.find(z=>z.id===x.student_id);return `<div class="alert a-red">${esc(s?.first_name||'تلميذ')} — ${esc(x.subject||'')} — ${esc(x.score)}%</div>`}).join('')||'<div class="a-green alert">لا توجد حالات أقل من 50% في البيانات الحالية.</div>'}</div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>المسار</th><th>المادة</th><th>الحالة</th><th></th></tr>${C.support.map(x=>{let s=C.students.find(z=>z.id===x.student_id);return `<tr><td>${esc(s?.first_name+' '+s?.last_name)}</td><td>${esc(x.path||x.level||'')}</td><td>${esc(x.subject||'')}</td><td>${esc(x.status||'')}</td><td><button class="btn danger" onclick="remove('support_paths','${x.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="5">لا توجد مسارات</td></tr>'}</table></div>`)}async function saveSupport(){try{await insert('support_paths',{student_id:$('sst').value,path:$('spath').value,subject:$('ssub').value,status:$('sstatus').value,notes:$('snote').value,created_at:new Date().toISOString()})}catch(e){toast(e.message)}}
function blocksPage(){return shell('🧩 اللبنات والإشهاد','تتبع التحكم في التعلمات',`<div class="grid g3">${C.blocks.map(x=>`<div class="card"><span class="badge">${esc(x.code||'لبنة')}</span><h3>${esc(x.title||x.name||'لبنة')}</h3><p class="muted">${esc(x.description||x.objective||'')}</p><button class="btn primary" onclick="toast('يمكن ربط الإشهاد بنتيجة الرائز عند التحقق من التحكم')">✓ تصديق</button></div>`).join('')||'<div class="card"><p>لا توجد لبنات محملة بعد. يمكن للمدير/الأستاذ إضافتها في قاعدة البيانات.</p></div>'}</div>`)}
function explicitPage(){return shell('🎓 التعليم الصريح','نموذج عملي: أشرح → نطبق معاً → تطبقون → تقويم → معالجة',`<div class="grid g2"><div class="card"><h3>1. أشرح وأمذجه</h3><textarea id="ex1" placeholder="خطوات الشرح والنمذجة"></textarea></div><div class="card"><h3>2. الممارسة الموجهة</h3><textarea id="ex2" placeholder="أسئلة وأنشطة موجهة"></textarea></div><div class="card"><h3>3. الممارسة المستقلة</h3><textarea id="ex3" placeholder="نشاط فردي"></textarea></div><div class="card"><h3>4. التحقق والمعالجة</h3><textarea id="ex4" placeholder="كيف ستتحقق من الفهم؟"></textarea></div></div><button class="btn primary" onclick="saveLesson()">💾 حفظ السيناريو</button><div class="card"><h3>السيناريوهات المحفوظة</h3>${C.explicit.map(x=>`<div class="alert a-green">${esc(x.title||'سيناريو تعليم صريح')} — ${esc(x.created_at||'')}</div>`).join('')||'<div class="muted">لا توجد سيناريوهات بعد.</div>'}</div>`)}async function saveLesson(){try{await insert('explicit_lessons',{title:'سيناريو التعليم الصريح',content:JSON.stringify({model:$('ex1').value,guided:$('ex2').value,independent:$('ex3').value,assessment:$('ex4').value}),teacher_id:user.id,created_at:new Date().toISOString()})}catch(e){toast(e.message)}}
function subjectPage(k){let title={arabic:'العربية',french:'الفرنسية',math:'الرياضيات',fluency:'الطلاقة',tracking:'التتبع'}[k];if(k==='fluency')return fluencyPage();if(k==='math')return mathPage();if(k==='tracking')return trackingPage();return shell(title,'تتبع تفصيلي للمهارات',`<div class="card"><p>هذه الوحدة مرتبطة ببيانات التلميذ والتقويم. استعمل الروائز والدعم ثم راقب التطور من ملف التلميذ.</p><div class="grid g3">${C.students.slice(0,12).map(s=>{let A=C.assessments.filter(a=>a.student_id===s.id&&a.subject===title);let avg=A.length?Math.round(A.reduce((n,a)=>n+Number(a.score||0),0)/A.length):0;return `<div class="card"><b>${esc(s.first_name+' '+s.last_name)}</b><div class="progress"><i style="width:${avg}%"></i></div><small>${avg}%</small></div>`}).join('')}</div></div>`)}
function fluencyPage(){return shell('⚡ الطلاقة','قياسات منتظمة مع كلمات/دقيقة والدقة',`<div class="card"><form onsubmit="event.preventDefault();saveFluency()" class="grid g3"><div class="field"><label>التلميذ</label><select id="fst">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>كلمة/دقيقة</label><input id="fw" type="number" min="0"></div><div class="field"><label>الدقة %</label><input id="fa" type="number" min="0" max="100"></div><div class="field"><label>المستوى</label><input id="fl"></div><div><button class="btn primary">➕ حفظ القياس</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>كلمة/د</th><th>الدقة</th><th></th></tr>${C.fluency.map(x=>{let s=C.students.find(z=>z.id===x.student_id);return `<tr><td>${esc(s?.first_name+' '+s?.last_name)}</td><td>${esc(x.words_per_minute||'')}</td><td>${esc(x.accuracy||'')}%</td><td><button class="btn danger" onclick="remove('fluency_records','${x.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="4">لا توجد قياسات</td></tr>'}</table></div>`)}async function saveFluency(){try{await insert('fluency_records',{student_id:$('fst').value,words_per_minute:Number($('fw').value)||null,accuracy:Number($('fa').value)||null,level:$('fl').value,mastery:'قيد التتبع',created_by:user.id,observed_at:new Date().toISOString()})}catch(e){toast(e.message)}}
function mathPage(){return shell('∑ الرياضيات','التشخيص، المهارات، التحقق والإشهاد',`<div class="card"><form onsubmit="event.preventDefault();saveMath()" class="grid g3"><div class="field"><label>التلميذ</label><select id="mst">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>المجال</label><select id="md"><option>الأعداد</option><option>العمليات</option><option>حل المسائل</option><option>الهندسة</option><option>القياس</option></select></div><div class="field"><label>النتيجة %</label><input id="ms" type="number" min="0" max="100"></div><div class="field"><label>حالة التحكم</label><select id="mm"><option>غير متحكم</option><option>في طور التحكم</option><option>متحكم</option></select></div><div><button class="btn primary">✓ تسجيل التصديق</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>المجال</th><th>النتيجة</th><th>التحكم</th><th></th></tr>${C.math.map(x=>{let s=C.students.find(z=>z.id===x.student_id);return `<tr><td>${esc(s?.first_name+' '+s?.last_name)}</td><td>${esc(x.domain||'')}</td><td>${esc(x.score??'')}%</td><td>${esc(x.mastery||'')}</td><td><button class="btn danger" onclick="remove('math_validations','${x.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="5">لا توجد بيانات</td></tr>'}</table></div>`)}async function saveMath(){try{await insert('math_validations',{student_id:$('mst').value,domain:$('md').value,score:Number($('ms').value)||0,mastery:$('mm').value,validated_at:new Date().toISOString(),created_by:user.id})}catch(e){toast(e.message)}}
function trackingPage(){return shell('📈 التتبع','شبكة متابعة دقيقة حسب المهارة',`<div class="card"><form onsubmit="event.preventDefault();saveTracking()" class="grid g3"><div class="field"><label>التلميذ</label><select id="tst">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>المادة</label><select id="tsub"><option>العربية</option><option>الفرنسية</option><option>الرياضيات</option></select></div><div class="field"><label>المهارة</label><input id="tskill" required></div><div class="field"><label>التحكم</label><select id="tm"><option>غير متحكم</option><option>في طور التحكم</option><option>متحكم</option></select></div><div class="field"><label>ملاحظة</label><input id="tn"></div><div><button class="btn primary">➕ حفظ التتبع</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>المادة</th><th>المهارة</th><th>التحكم</th><th></th></tr>${C.tracking.map(x=>{let s=C.students.find(z=>z.id===x.student_id);return `<tr><td>${esc(s?.first_name+' '+s?.last_name)}</td><td>${esc(x.subject||'')}</td><td>${esc(x.skill||'')}</td><td>${esc(x.mastery||'')}</td><td><button class="btn danger" onclick="remove('tracking_records','${x.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="5">لا توجد سجلات</td></tr>'}</table></div>`)}async function saveTracking(){try{await insert('tracking_records',{student_id:$('tst').value,subject:$('tsub').value,skill:$('tskill').value,mastery:$('tm').value,notes:$('tn').value,observed_at:new Date().toISOString(),created_by:user.id})}catch(e){toast(e.message)}}
function reportsPage(){let avg=C.assessments.length?Math.round(C.assessments.reduce((n,x)=>n+Number(x.score||0),0)/C.assessments.length):0;return shell('📄 التقارير والتصدير','ملخصات قابلة للطباعة والتصدير',`<div class="grid g3"><div class="card"><b>${C.students.length}</b><div class="muted">تلاميذ</div></div><div class="card"><b>${avg}%</b><div class="muted">متوسط التقويمات</div></div><div class="card"><b>${C.support.length}</b><div class="muted">مسارات دعم</div></div></div><div class="card"><button class="btn primary" onclick="downloadJSON()">⬇️ JSON</button> <button class="btn dark" onclick="downloadCSV()">⬇️ CSV</button> <button class="btn light" onclick="downloadWord()">⬇️ Word</button> <button class="btn success" onclick="printPage()">🖨️ PDF عبر الطباعة</button></div><div class="card" id="report"><h2>تقرير مؤسسة الريادة</h2><p>التاريخ: ${new Date().toLocaleDateString('ar-MA')}</p><p>عدد التلاميذ: ${C.students.length}</p><p>عدد الأقسام: ${C.classes.length}</p><p>عدد التقويمات: ${C.assessments.length}</p><p>متوسط النتائج: ${avg}%</p><p>عدد مسارات الدعم: ${C.support.length}</p></div>`)}
function aiPage(){let low=C.assessments.filter(x=>Number(x.score??0)<50);return shell('🤖 المساعد الذكي','مساعد تربوي مبني على بيانات المنصة',`<div class="card"><div class="field"><label>اكتب سؤالك</label><textarea id="aiq" placeholder="مثال: من يحتاج إلى دعم في الرياضيات؟ أو ما الإجراء المناسب؟"></textarea></div><button class="btn primary" onclick="askAI()">تحليل</button></div><div class="card" id="aiout"><div class="muted">المساعد ينتظر سؤالك.</div></div>`)}function askAI(){let q=$('aiq').value.toLowerCase(),out='';if(q.includes('رياض')||q.includes('math')){let a=C.math.filter(x=>Number(x.score??100)<50);out=`تم العثور على ${a.length} قياس/قياسات رياضيات تحت 50%. الإجراء المقترح: تحديد المهارة، إدراج المتعلم في مسار أساس، دعم يومي، ثم إعادة التقويم.`}else if(q.includes('طلاقة')||q.includes('fluency')){let a=C.fluency.filter(x=>Number(x.accuracy??100)<80);out=`هناك ${a.length} قياس/قياسات بدقة أقل من 80%. ركز على قراءة موجهة قصيرة ومتكررة وإعادة القياس.`}else if(q.includes('دعم')||q.includes('تعثر')){out=`المتعلمون ذوو النتائج الأقل من 50%: ${C.assessments.filter(x=>Number(x.score??0)<50).map(x=>{let s=C.students.find(z=>z.id===x.student_id);return s?.first_name||'تلميذ'}).join('، ')||'لا توجد حالات حالياً'}.`}else out=`المعطيات الحالية: ${C.students.length} تلميذاً، ${C.assessments.length} تقويماً، ${C.support.length} مسار دعم. اسأل عن الرياضيات أو الطلاقة أو التعثرات للحصول على تحليل مباشر.`;$('aiout').innerHTML='<div class="alert a-green">'+esc(out)+'</div>'}
function mindmapPage(){return shell('🧠 مولد الخريطة الذهنية','يدعم النصوص وملفات PPTX عبر استخراج نص الشرائح',`<div class="card"><div class="toolbar"><input id="ppt" type="file" accept=".pptx" onchange="readPPTX(this.files[0])"><button class="btn light" onclick="generateMap()">توليد من النص</button><button class="btn primary" onclick="downloadMap()">⬇️ تصدير الخريطة</button></div><div class="field" style="margin-top:10px"><label>نص الدرس</label><textarea id="maptext" placeholder="ضع العنوان ثم العناوين الفرعية، كل سطر يمثل فكرة..."></textarea></div></div><div class="card map" id="map"><div class="muted">ستظهر الخريطة هنا.</div></div>`)}async function readPPTX(file){if(!file)return;try{let zip=await JSZip.loadAsync(file),files=Object.keys(zip.files).filter(x=>/^ppt\/slides\/slide\d+\.xml$/.test(x));files.sort((a,b)=>Number(a.match(/slide(\d+)/)[1])-Number(b.match(/slide(\d+)/)[1]));let all=[];for(let f of files){let xml=await zip.file(f).async('text'),doc=new DOMParser().parseFromString(xml,'application/xml'),texts=[...doc.getElementsByTagName('a:t')].map(x=>x.textContent.trim()).filter(Boolean);all.push(...texts)}$('maptext').value=all.join('\n');generateMap();toast('تم استخراج نص الشرائح من PPTX')}catch(e){toast('تعذر قراءة الملف: '+e.message)}}function generateMap(){let lines=$('maptext').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!lines.length){toast('أدخل نصاً أو ملف PPTX');return}let root=lines[0],kids=lines.slice(1);$('map').innerHTML=`<div class="maproot"><div class="node">${esc(root)}</div><div class="children">${kids.map(x=>`<div class="child">${esc(x)}</div>`).join('')}</div></div>`}function downloadMap(){let el=$('map');if(!el||!el.innerText.trim()){toast('ولد الخريطة أولاً');return}let html='<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>خريطة ذهنية</title><style>body{font-family:Arial;padding:40px}.node{background:#eaf3ff;border:1px solid #1769d3;padding:15px;border-radius:12px;text-align:center;font-weight:bold}.children{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:25px}.child{border:1px solid #bbb;padding:12px;border-radius:10px}</style><div class="node">'+esc($('maptext').value.split(/\n+/)[0])+'</div><div class="children">'+$('maptext').value.split(/\n+/).slice(1).filter(Boolean).map(x=>'<div class="child">'+esc(x)+'</div>').join('')+'</div></html>';let b=new Blob([html],{type:'text/html;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mindmap.html';a.click();URL.revokeObjectURL(a.href)}
function resourcesPage(){return shell('📚 الموارد والجذاذات','مكان واحد للسيناريوهات والملفات',`<div class="grid g3"><div class="card"><h3>جذاذة ذكية</h3><p class="muted">أنشئها من أهداف الدرس والمرحلة.</p><button class="btn primary" onclick="go('explicit')">فتح مولد السيناريو</button></div><div class="card"><h3>خرائط ذهنية</h3><button class="btn primary" onclick="go('mindmap')">فتح المولد</button></div><div class="card"><h3>التقارير</h3><button class="btn primary" onclick="go('reports')">فتح التصدير</button></div></div>`)}
function parentsPage(){if(profile.role==='parent')return shell('👨‍👩‍👧 بوابة الأسرة','لا يظهر هنا إلا الأبناء المرتبطون بالحساب',`<div class="grid g2">${C.students.map(s=>`<div class="card"><h3>${esc(s.first_name+' '+s.last_name)}</h3><p>${esc(s.notes||'لا توجد ملاحظات')}</p><button class="btn primary" onclick="student('${s.id}')">فتح الملف المسموح</button></div>`).join('')||'<div class="card">لم يتم ربط أبناء بهذا الحساب بعد.</div>'}</div>`);return shell('👨‍👩‍👧 بوابة الأسرة','التواصل والمتابعة',`<div class="card"><p>يمكن للمدير ربط ولي الأمر بالتلميذ عبر parent_links. بعد الربط يرى الولي ابنه فقط.</p></div>`)}function inspectorPage(){return shell('🧭 المفتشة والتأطير','زيارات، ملاحظات وتوصيات',`<div class="card"><h3>مؤشرات التتبع</h3><div class="grid g3"><div class="card"><b>${C.students.length}</b><div class="muted">متعلمين</div></div><div class="card"><b>${C.assessments.length}</b><div class="muted">تقويمات</div></div><div class="card"><b>${C.support.length}</b><div class="muted">مسارات دعم</div></div></div><textarea id="irec" placeholder="توصيات الزيارة"></textarea><button class="btn primary" onclick="toast('تم حفظ التوصية محلياً في هذه الجلسة؛ يلزم جدول زيارات مخصص لتخزينها رسمياً')">حفظ التوصية</button></div>`)}function settingsPage(){return shell('⚙️ الإعدادات','الحساب والجلسة',`<div class="card"><p><b>الاسم:</b> ${esc(profile.full_name||'')}</p><p><b>الدور:</b> ${esc(profile.role)}</p><p><b>المؤسسة:</b> ${esc(profile.school_name||'')}</p><button class="btn danger" onclick="logout()">تسجيل الخروج</button></div>`)}function ownerPage(){if(user.id!=='b33ae385-7f09-498b-a080-6d07f0a8e502')return shell('غير متاح','', '<div class="card">غير مصرح.</div>');return shell('👑 مركز التطوير','خاص بمالك المنصة فقط',`<div class="card"><h3>مراقبة التطوير</h3><p>هذا الفضاء محصور في مالك المنصة. لا يظهر للأستاذ أو المفتش أو ولي الأمر.</p><div class="grid g3"><div class="card"><b>${C.students.length}</b><div class="muted">بيانات المتعلمين</div></div><div class="card"><b>${C.classes.length}</b><div class="muted">الأقسام</div></div><div class="card"><b>${C.assessments.length}</b><div class="muted">التقويمات</div></div></div></div>`)}
function render(){let p=active==='dashboard'?dashboard():active==='classes'?classesPage():active==='students'?studentsPage():active==='assessments'?assessmentsPage():active==='support'?supportPage():active==='blocks'?blocksPage():active==='explicit'?explicitPage():['arabic','french'].includes(active)?subjectPage(active):active==='math'?mathPage():active==='fluency'?fluencyPage():active==='tracking'?trackingPage():active==='reports'?reportsPage():active==='ai'?aiPage():active==='mindmap'?mindmapPage():active==='resources'?resourcesPage():active==='parents'?parentsPage():active==='inspector'?inspectorPage():active==='settings'?settingsPage():ownerPage();$('page').innerHTML=p}
function printPage(){window.print()}function downloadJSON(){let b=new Blob([JSON.stringify({students:C.students,classes:C.classes,assessments:C.assessments,support:C.support,tracking:C.tracking,fluency:C.fluency,math:C.math},null,2)],{type:'application/json'});downloadBlob(b,'riyadah-report.json')}function downloadCSV(){let rows=[['student','subject','score','type']];C.assessments.forEach(x=>{let s=C.students.find(z=>z.id===x.student_id);rows.push([s?.first_name+' '+s?.last_name,x.subject,x.score,x.assessment_type||x.type])});let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'riyadah-assessments.csv')}function downloadWord(){let html='<html lang="ar" dir="rtl"><meta charset="utf-8"><body>'+($('report')?.innerHTML||'تقرير رَوّاد')+'</body></html>';downloadBlob(new Blob([html],{type:'application/msword'}),'riyadah-report.doc')}function downloadBlob(b,n){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function logout(){sb.auth.signOut().then(()=>location.replace('/'))}window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});boot();
</script></body></html>
