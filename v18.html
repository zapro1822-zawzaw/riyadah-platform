.from(t).select('*').eq('school_id',schoolId).limit(2000);if(r.error){console.error(r.error);return[]}return r.data||[]}async function refresh(){if(!schoolId)return;C.classes=await q('classes');C.students=await q('students');C.assessments=await q('assessments');C.support=await q('support_paths');C.tracking=await q('tracking_records');C.fluency=await q('fluency_records');C.math=await q('math_validations');C.blocks=await q('learning_blocks');C.explicit=await q('explicit_lessons')}async function save(t,p){let r=await sb.from(t).insert({...p,school_id:schoolId}).select().single();if(r.error){toast('خطأ: '+r.error.message);return false}await refresh();render();toast('تم الحفظ بنجاح في السحابة');return true}async function del(t,id){if(!confirm('تأكيد الحذف؟'))return;let r=await sb.from(t).delete().eq('id',id).eq('school_id',schoolId);if(r.error)toast(r.error.message);else{await refresh();render();toast('تم الحذف')}}function shell(title,sub,body){return `<div class="card"><h2 style="margin:0">${title}</h2><div class="muted">${sub||''}</div></div>${body}`}function dashboard(){return shell('📊 لوحة القيادة',(profile.school_name||'')+' · 2026/2027',`<div class="grid stats"><div class="card"><div class="muted">التلاميذ</div><div class="num">${C.students.length}</div></div><div class="card"><div class="muted">الأقسام</div><div class="num">${C.classes.length}</div></div><div class="card"><div class="muted">الروائز</div><div class="num">${C.assessments.length}</div></div><div class="card"><div class="muted">مسارات الدعم</div><div class="num">${C.support.length}</div></div><div class="card"><div class="muted">قياسات الطلاقة</div><div class="num">${C.fluency.length}</div></div></div><div class="grid g3">${NAV.slice(1).map(x=>`<div class="card module" onclick="go('${x[0]}')"><div class="ico">${x[1]}</div><h3>${T(x)}</h3><div class="muted">فتح الوحدة</div></div>`).join('')}</div>`)}function classesPage(){return shell('🏫 الأقسام','إضافة وحذف الأقسام',`<div class="card"><form class="gri td>${esc(x.student_code||'')}</td><td>${esc(C.classes.find(c=>c.id===x.class_id)?.name||'')}</td><td><button class="btn danger" onclick="del('students','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="4">لا يوجد تلاميذ</td></tr>'}</table></div>`)}function student(id){let s=C.students.find(x=>x.id===id),a=C.assessments.filter(x=>x.student_id===id),sp=C.support.filter(x=>x.student_id===id),f=C.fluency.filter(x=>x.student_id===id),m=C.math.filter(x=>x.student_id===id),t=C.tracking.filter(x=>x.student_id===id);$('modalbox').innerHTML=`<h2>📁 ${esc((s?.first_name||'')+' '+(s?.last_name||''))}</h2><div class="grid g3"><div class="card"><b>${a.length}</b><div class="muted">روائز</div></div><div class="card"><b>${sp.length}</b><div class="muted">دعم</div></div><div class="card"><b>${f.length}</b><div class="muted">طلاقة</div></div></div><h3>الروائز</h3><div class="tablewrap"><table class="table">${a.map(x=>`<tr><td>${esc(x.subject||x.criteria?.subject||'')}</td><td>${esc(x.mastery||x.placement_threshold||'')}</td><td>${esc(x.assessed_at||'')}</td></tr>`).join('')||'<tr><td>لا توجد</td></tr>'}</table></div><h3>الدعم</h3><p>${sp.map(x=>esc((x.subject||'')+' — '+(x.path||'')+' — '+(x.status||''))).join('<br>')||'لا توجد'}</p><h3>الطلاقة</h3><p>${f.map(x=>esc((x.words_per_minute||'—')+' كلمة/د · '+(x.accuracy||'—')+'%')).join('<br>')||'لا توجد'}</p><h3>الرياضيات والتتبع</h3><p>${m.map(x=>esc((x.domain||'')+' — '+(x.mastery||'')+' — '+(x.score??'')+'%')).join('<br>')||'لا توجد'}</p><p>${t.map(x=>esc((x.subject||'')+' — '+(x.skill||'')+' — '+(x.mastery||''))).join('<br>')||'لا توجد'}</p><button class="btn dark" onclick="closeModal()">إغلاق</button>`;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function levels(sub){if(sub==='العربية')return ['حرف','كلمة','فقرة','أقصوصة'];if(sub==='الرياضيات')return ['رقم','جمع','طرح','ضرب','قسمة'];return ['Lettre','Mot simple','Mot avancé','Mot avec GC','Phrase DP','Texte']}function asse els(s).map(x=>`<option>${esc(x)}</option>`).join('')}function supportPage(){return shell('🎯 الدعم TaRL','تشخيص → مجموعة متجانسة → دعم → إعادة تحقق',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();save('support_paths',{student_id:$('sst').value,path:$('spath').value,subject:$('ssub').value,status:$('sstatus').value,notes:$('snote').value})"><div class="field"><label>التلميذ</label><select id="sst">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>المادة</label><select id="ssub"><option>العربية</option><option>الفرنسية</option><option>الرياضيات</option></select></div><div class="field"><label>المسار</label><select id="spath"><option>أساس</option><option>متوسط</option><option>تحدي</option></select></div><div class="field"><label>الحالة</label><select id="sstatus"><option>مفتوح</option><option>قيد الدعم</option><option>تحقق</option></select></div><div class="field"><label>ملاحظات</label><input id="snote"></div><div><button class="btn primary">➕ إنشاء مسار</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>المادة</th><th>المسار</th><th>الحالة</th><th></th></tr>${C.support.map(x=>`<tr><td>${esc(C.students.find(s=>s.id===x.student_id)?.first_name||x.student_id)}</td><td>${esc(x.subject||'')}</td><td>${esc(x.path||'')}</td><td>${esc(x.status||'')}</td><td><button class="btn danger" onclick="del('support_paths','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد مسارات</td></tr>'}</table></div>`)}function subjectPage(k){let title=k==='arabic'?'العربية':'الفرنسية';return shell(title,'تتبع التعلمات',`<div class="grid g3">${C.students.map(s=>{let a=C.assessments.filter(x=>x.student_id===s.id&&(x.subject===title||x.criteria?.subject===title));return `<div class="card"><b>${esc(s.first_name+' '+s.last_name)}</b><p>${a.map(x=>esc(x.placement_threshold||x.mastery||'')).join(' · ')||'لا يوجد رائز'}</p></div>`}).join('')||'<div class="card">أضف التلاميذ أولاً.</div>'}</div>`)}function fluencyPage(){return shell('⚡ الطلاقة','كلمات/دقيقة + دقة',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();save('fluency_records',{student_id:$('fst').value,words_per_minute:Number($('fw').value)||0,accuracy:Number($('fa').value)||0,level:$('fl').value,mastery:'قيد التتبع',observed_at:new Date().toISOString(),created_by:user.id})"><div class="field"><label>التلميذ</label><select id="fst">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>كلمة/دقيقة</label><input id="fw" type="number" min="0" required></div><div class="field"><label>الدقة %</label><input id="fa" type="number" min="0" max="100" required></div><div class="field"><label>المستوى</label><input id="fl"></div><div><button class="btn primary">➕ حفظ</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>كلمة/د</th><th>الدقة</th><th></th></tr>${C.fluency.map(x=>`<tr><td>${esc(C.students.find(s=>s.id===x.student_id)?.first_name||x.student_id)}</td><td>${x.words_per_minute}</td><td>${x.accuracy}%</td><td><button class="btn danger" onclick="del('fluency_records','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="4">لا توجد قياسات</td></tr>'}</table></div>`)}function mathPage(){return shell('∑ الرياضيات','شبكات التصديق على اللبنات',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();save('math_validations',{student_id:$('mst').value,domain:$('md').value,score:Number($('ms').value)||0,mastery:$('mm').value,validated_at:new Date().toISOString(),created_by:user.id})"><div class="field"><label>التلميذ</label><select id="mst">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>المجال</label><select id="md"><option>الأعداد</option><option>العمليات</option><option>حل المسائل</option><option>الهندسة</option><option>القياس</option></select></div><div class="field"><label>النتيجة %</label><input id="ms" type="number" min="0" max="100"></div><div class="field"><label>التحكم</label><select id="mm"><option>غير متحكم</option><option>في طور التحكم</option><option>متحكم</option></select></div><div><button class="btn primary">✓ تسجيل التصديق</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>المجال</th><th>النتيجة</th><th>التحكم</th><th></th></tr>${C.math.map(x=>`<tr><td>${esc(C.students.find(s=>s.id===x.student_id)?.first_name||x.student_id)}</td><td>${esc(x.domain||'')}</td><td>${esc(x.score??'')}%</td><td>${esc(x.mastery||'')}</td><td><button class="btn danger" onclick="del('math_validations','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد بيانات</td></tr>'}</table></div>`)}function trackingPage(){return shell('📈 التتبع','المادة + المهارة + حالة التحكم',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();save('tracking_records',{student_id:$('tst').value,subject:$('tsub').value,skill:$('tskill').value,mastery:$('tm').value,notes:$('tn').value,observed_at:new Date().toISOString(),created_by:user.id})"><div class="field"><label>التلميذ</label><select id="tst">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>المادة</label><select id="tsub"><option>العربية</option><option>الفرنسية</option><option>الرياضيات</option></select></div><div class="field"><label>المهارة</label><input id="tskill" required></div><div class="field"><label>التحكم</label><select id="tm"><option>غير متحكم</option><option>في طور التحكم</option><option>متحكم</option></select></div><div class="field"><label>ملاحظة</label><input id="tn"></div><div><button class="btn primary">➕ حفظ</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>المادة</th><th>المهارة</th><th>التحكم</th><th></th></tr>${C.tracking.map(x=>`<tr><td>${esc(C.students.find(s=>s.id===x.student_id)?.first_name||x.student_id)}</td><td>${esc(x.subject||'')}</td><td>${esc(x.skill||'')}</td><td>${esc(x.mastery||'')}</td><td><button class="btn danger" onclick="del('tracking_records','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد سجلات</td></tr>'}</table></div>`)}function blocksPage(){return shell('🧩 اللبنات والإشهاد','التصديق على التحكم في التعلمات',`<div class="grid g3">${C.blocks.map(x=>`<div class="card"><span class="badge">${esc(x.code||'لبنة')}</span><h3>${esc(x.title||x.name||'لبنة')}</h3><p>${esc(x.description||x.objective||'')}</p></div>`).join('')||'<div class="card">لا توجد لبنات محملة بعد.</div>'}</div>`)}function explicitPage(){return shell('🎓 التعليم الصريح','أشرح وأمذجه → نطبق معاً → ممارسة مستقلة → تحقق ومعالجة',`<div class="card"><form onsubmit="event.preventDefault();save('explicit_lessons',{title:$('ext').value||'سيناريو تعليم صريح',content:JSON.stringify({model:$('ex1').value,guided:$('ex2').value,independent:$('ex3').value,assessment:$('ex4').value}),teacher_id:user.id,created_at:new Date().toISOString()})"><div class="field"><label>عنوان السيناريو</label><input id="ext"></div><div class="grid g2"><div class="field"><label>أشرح وأمذجه</label><textarea id="ex1"></textarea></div><div class="field"><label>نطبق معاً</label><textarea id="ex2"></textarea></div><div class="field"><label>ممارسة مستقلة</label><textarea id="ex3"></textarea></div><div class="field"><label>تحقق ومعالجة</label><textarea id="ex4"></textarea></div></div><button class="btn primary">💾 حفظ السيناريو</button></form></div><div class="card">${C.explicit.map(x=>`<div class="alert a-green">${esc(x.title||'سيناريو')} — ${esc(x.created_at||'')}</div>`).join('')||'لا توجد سيناريوهات.'}</div>`)}function mindmapPage(){return shell('🧠 الخريطة الذهنية PPTX','استخراج كل فقرات الشرائح مع الحفاظ على مستويات العناوين قدر الإمكان',`<div class="card"><div class="drop" onclick="$('ppt').click()">📎 اختر ملف PPTX<br><small>يتم استخراج النص من كل الشرائح دون تلخيص</small><input id="ppt" type="file" accept=".pptx" hidden onchange="readPPTX(this.files[0])"></div><div class="field" style="margin-top:12px"><label>النص/العناوين المستخرجة</label><textarea id="maptext" style="min-height:180px" placeholder="يمكن أيضاً لصق النص يدوياً، كل سطر فكرة"></textarea></div><div class="toolbar"><button class="btn primary" onclick="generateMap()">🧠 توليد الخريطة</button><button class="btn dark" onclick="downloadMap()">⬇️ تصدير HTML</button><button class="btn light" onclick="clearMap()">مسح</button></div></div><div class="card mind" id="map"><div class="muted">الخريطة ستظهر هنا.</div></div>`)}async function readPPTX(file){if(!file)return;try{let zip=await JSZip.loadAsync(file),names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n));names.sort((a,b)=>+a.match(/slide(\d+)/)[1]-+b.match(/slide(\d+)/)[1]);let out=[];for(let name of names){let xml=await zip.file(name).async('text'),doc=new DOMParser().parseFromString(xml,'application/xml');for(let p of [...doc.getElementsByTagName('a:p')]){let text=[...p.getElementsByTagName('a:t')].map(t=>t.textContent).join('').trim();if(!text)continue;let pp=p.getElementsByTagName('a:pPr')[0],lvl=pp?.getAttribute('lvl');out.push({text,lvl:lvl===null?null:Number(lvl),slide:Number(name.match(/slide(\d+)/)[1])})}}window._pptNodes=out;$('maptext').value=out.map(x=>x.text).join('\n');generateMap(out);toast(`تم استخراج ${out.length} فقرة من ${names.length} شريحة`)}catch(e){toast('تعذر قراءة PPTX: '+e.message)}}function makeTree(nodes){let root={text:nodes[0]?.text||'الدرس',children:[]},stack=[{node:root,lvl:-1}];for(let i=1;i<nodes.length;i++){let n=nodes[i],lvl=n.lvl; if(lvl===null){lvl=/^[0-9٠-٩]+[.)]/.test(n.text)?1:2}let item={text:n.text,children:[],slide:n.slide};while(stack.length&&stack[stack.length-1].lvl>=lvl)stack.pop();stack[stack.length-1].node.children.push(item);stack.push({node:item,lvl})}return root}function renderTree(n){if(!n.children.length)return `<div class="subnode">${esc(n.text)}</div>`;return `<div class="branch"><div class="node">${esc(n.text)}</div><div class="sub">${n.children.map(renderTree).join('')}</div></div>`}function generateMap(nodes){let text=$('maptext').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!text.length){toast('أدخل نصاً أو اختر PPTX');return}if(!nodes)nodes=text.map((text,i)=>({text,lvl:i===0?-1:1,slide:0}));let tree=makeTree(nodes);$('map').innerHTML=`<div class="root"><div class="node">${esc(tree.text)}</div><div class="tree">${tree.children.map(renderTree).join('')}</div></div>`}function clearMap(){$('maptext').value='';$('map').innerHTML='<div class="muted">الخريطة ستظهر هنا.</div>';window._pptNodes=[]}function downloadMap(){let html='<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>خريطة ذهنية - رُوَّاد</title><style>body{font-family:Arial;padding:30px;direction:rtl}.node{background:#eaf3ff;border:1px solid #1769d3;border-radius:10px;padding:10px;font-weight:bold;text-align:center}.tree{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}.branch{border:1px solid #ccd6df;border-radius:10px;padding:10px;min-width:180px}.sub{display:flex;flex-direction:column;gap:6px;margin-top:8px}.subnode{background:#f7fafc;border:1px solid #ddd;border-radius:7px;padding:7px}</style><h1>رُوَّاد — خريطة ذهنية</h1>${$('map').innerHTML}</html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download='riyadah-mindmap.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function reportsPage(){return shell('📄 التقارير والتصدير','تقرير المؤسسة',`<div class="grid g3"><div class="card"><div class="num">${C.students.length}</div>تلاميذ</div><div class="card"><div class="num">${C.assessments.length}</div>روائز</div><div class="card"><div class="num">${C.support.length}</div>مسارات دعم</div></div><div class="card" id="report"><h2>تقرير رُوَّاد</h2><p>عدد التلاميذ: ${C.students.length}</p><p>عدد الأقسام: ${C.classes.length}</p><p>عدد الروائز: ${C.assessments.length}</p><p>عدد مسارات الدعم: ${C.support.length}</p><p>عدد قياسات الطلاقة: ${C.fluency.length}</p></div><button class="btn primary" onclick="printPage()">🖨️ طباعة / حفظ PDF</button> <button class="btn dark" onclick="downloadJSON()">⬇️ JSON</button>`)}function aiPage(){return shell('🤖 المساعد الذكي','تحليل مباشر لبيانات المؤسسة',`<div class="card"><textarea id="aiq" placeholder="مثال: ما عدد مسارات الدعم؟ من لديهم قياسات طلاقة؟"></textarea><button class="btn primary" onclick="askAI()">تحليل</button></div><div class="card" id="aiout">اكتب سؤالك.</div>`)}function askAI(){let q=$('aiq').value.toLowerCase(),o=`المؤسسة تضم ${C.students.length} تلميذاً و${C.classes.length} أقسام و${C.assessments.length} روائز و${C.support.length} مسارات دعم و${C.fluency.length} قياسات طلاقة.`;if(q.includes('دعم')||q.includes('soutien'))o+=` عدد مسارات الدعم الحالي: ${C.support.length}.`;if(q.includes('طلاقة')||q.includes('fluency'))o+=` عدد قياسات الطلاقة: ${C.fluency.length}.`;if(q.includes('رائز')||q.includes('évaluation'))o+=` عدد الروائز: ${C.assessments.length}.`;$('aiout').innerHTML='<div class="alert a-green">'+esc(o)+'</div>'}function inspectorPage(){return shell('🧭 المفتشة والتأطير','مؤشرات قابلة للطباعة',`<div class="grid g3"><div class="card"><b>${C.students.length}</b><div>متعلمين</div></div><div class="card"><b>${C.assessments.length}</b><div>روائز</div></div><div class="card"><b>${C.support.length}</b><div>دعم</div></div></div><textarea id="irec" placeholder="ملاحظات وتوصيات الزيارة"></textarea><button class="btn primary" onclick="printPage()">طباعة التقرير</button>`)}function settingsPage(){return shell('⚙️ الإعدادات','الحساب الحالي',`<div class="card"><p><b>الاسم:</b> ${esc(profile.full_name||'')}</p><p><b>الدور:</b> ${esc(profile.role||'')}</p><p><b>المؤسسة:</b> ${esc(profile.school_name||'')}</p></div>`)}function render(){let h=active==='dashboard'?dashboard():active==='classes'?classesPage():active==='students'?studentsPage():active==='assessments'?assessmentPage():active==='support'?supportPage():['arabic','french'].includes(active)?subjectPage(active):active==='fluency'?fluencyPage():active==='math'?mathPage():active==='tracking'?trackingPage():active==='blocks'?blocksPage():active==='explicit'?explicitPage():active==='mindmap'?mindmapPage():active==='reports'?reportsPage():active==='ai'?aiPage():active==='inspector'?inspectorPage():settingsPage();$('page').innerHTML=h}function printPage(){window.print()}function downloadJSON(){let b=new Blob([JSON.stringify(C,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='riyadah-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function logout(){sb.auth.signOut().then(()=>location.replace('/'))}window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});boot();</script></body></html>
