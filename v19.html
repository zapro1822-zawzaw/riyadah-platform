<header class="top"><div class="bar"><div class="brand"><div class="logo">ر</div><div><h1>رُوَّاد V19</h1><div class="muted">منصة مؤسسات الريادة — مع محرّك الخطاطات الذهنية</div></div></div><div class="toolbar"><button class="btn light" onclick="cycleLang()">عربي / FR / EN</button><button class="btn light" onclick="printPage()">🖨️ طباعة</button><button class="btn danger" onclick="logout()">خروج</button></div></div></header>
<main class="wrap"><div class="layout"><aside class="side" id="side"></aside><section id="page"></section></div></main><div id="toast" class="toast"></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script>
const U='https://bnqbavlkvrpcbhqxctda.supabase.co',K='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q',sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let user,profile,schoolId,lang='ar',active='dashboard';let C={classes:[],students:[],assessments:[],support:[],tracking:[],fluency:[],math:[],blocks:[],explicit:[]};
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const NAV=[['dashboard','📊','لوحة القيادة','Tableau de bord','Dashboard'],['classes','🏫','الأقسام','Classes','Classes'],['students','👥','التلاميذ','Élèves','Students'],['assessments','📝','الروائز','Évaluations','Assessments'],['support','🎯','الدعم TaRL','Soutien TaRL','TaRL Support'],['arabic','ع','العربية','Arabe','Arabic'],['french','Fr','الفرنسية','Français','French'],['math','∑','الرياضيات','Mathématiques','Mathematics'],['fluency','⚡','الطلاقة','Fluidité','Fluency'],['tracking','📈','التتبع','Suivi','Tracking'],['blocks','🧩','اللبنات والإشهاد','Blocs et certification','Learning blocks'],['explicit','🎓','التعليم الصريح','Enseignement explicite','Explicit teaching'],['mindmap','🧠','الخطاطات الذهنية PPTX','Cartes mentales PPTX','PPTX Mind Maps'],['reports','📄','التقارير والتصدير','Rapports','Reports'],['ai','🤖','المساعد الذكي','Assistant IA','AI Assistant'],['inspector','🧭','المفتشة والتأطير','Inspection','Inspection'],['settings','⚙️','الإعدادات','Paramètres','Settings']];
function T(x){return lang==='ar'?x[2]:lang==='fr'?x[3]:x[4]}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').style.display='none',2800)}function cycleLang(){lang=lang==='ar'?'fr':lang==='fr'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';nav();render()}function go(k){active=k;nav();render()}function nav(){let a=NAV;if(profile?.role==='parent')a=NAV.filter(x=>['dashboard','students','assessments','settings'].includes(x[0]));if(profile?.role==='inspector')a=NAV.filter(x=>['dashboard','students','assessments','support','blocks','tracking','reports','inspector','settings'].includes(x[0]));$('side').innerHTML=a.map(x=>`<button class="nav ${active===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} ${T(x)}</button>`).join('')}
async function boot(){let r=await sb.auth.getUser();if(r.error||!r.data?.user){location.replace('/');return}user=r.data.user;let p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.error||!p.data||p.data.is_active===false){await sb.auth.signOut({scope:'local'});location.replace('/');return}profile=p.data;let m=await sb.from('school_memberships').select('school_id').eq('user_id',user.id).eq('status','active').limit(1).maybeSingle();schoolId=m.data?.school_id||null;if(!schoolId&&profile.role!=='parent'){let s=await sb.from('schools').select('id').eq('created_by',user.id).limit(1).maybeSingle();schoolId=s.data?.id||null}nav();await refresh();render()}
async function q(t){if(!schoolId)return[];let r=await sb.from(t).select('*').eq('school_id',schoolId).limit(2000);if(r.error){console.error(r.error);return[]}return r.data||[]}async function refresh(){if(!schoolId)return;C.classes=await q('classes');C.students=await q('students');C.assessments=await q('assessments');C.support=await q('support_paths');C.tracking=await q('tracking_records');C.fluency=await q('fluency_records');C.math=await q('math_validations');C.blocks=await q('learning_blocks');C.explicit=await q('explicit_lessons')}async function save(t,p){let r=await sb.from(t).insert({...p,school_id:schoolId}).select().single();if(r.error){toast('خطأ: '+r.error.message);return false}await refresh();render();toast('تم الحفظ في السحابة');return true}async function del(t,id){if(!confirm('تأكيد الحذف؟'))return;let r=await sb.from(t).delete().eq('id',id).eq('school_id',schoolId);if(r.error)toast(r.error.message);else{await refresh();render();toast('تم الحذف')}}
function shell(title,sub,body){return `<div class="card"><h2 style="margin:0">${title}</h2><div class="muted">${sub||''}</div></div>${body}`}
function dashboard(){return shell('📊 لوحة القيادة',(profile.school_name||'')+' · 2026/2027',`<div class="grid stats"><div class="card"><div class="muted">التلاميذ</div><div class="num">${C.students.length}</div></div><div class="card"><div class="muted">الأقسام</div><div class="num">${C.classes.length}</div></div><div class="card"><div class="muted">الروائز</div><div class="num">${C.assessments.length}</div></div><div class="card"><div class="muted">مسارات الدعم</div><div class="num">${C.support.length}</div></div><div class="card"><div class="muted">قياسات الطلاقة</div><div class="num">${C.fluency.length}</div></div></div><div class="grid g3">${NAV.slice(1).map(x=>`<div class="card module" onclick="go('${x[0]}')"><div class="ico">${x[1]}</div><h3>${T(x)}</h3><div class="muted">فتح الوحدة</div></div>`).join('')}</div>`)}
function classesPage(){return shell('🏫 الأقسام','إضافة وحذف الأقسام',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();save('classes',{name:$('cn').value.trim(),school_year:$('cy').value.trim(),teacher_id:user.id})"><div class="field"><label>اسم القسم</label><input id="cn" required placeholder="المستوى الخامس 1"></div><div class="field"><label>السنة الدراسية</label><input id="cy" value="2026/2027"></div><div><button class="btn primary">➕ إضافة</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>القسم</th><th>السنة</th><th></th></tr>${C.classes.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.school_year||'')}</td><td><button class="btn danger" onclick="del('classes','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="3">لا توجد أقسام</td></tr>'}</table></div>`)}
function studentsPage(){return shell('👥 التلاميذ','ملف فردي لكل متعلم',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();save('students',{first_name:$('sf').value.trim(),last_name:$('sl').value.trim(),student_code:$('sc').value.trim(),class_id:$('sclass').value||null,gender:$('sg').value,notes:$('snote').value.trim()})"><div class="field"><label>الاسم</label><input id="sf" required></div><div class="field"><label>النسب</label><input id="sl"></div><div class="field"><label>رمز التلميذ</label><input id="sc"></div><div class="field"><label>القسم</label><select id="sclass"><option value="">بدون قسم</option>${C.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>الجنس</label><select id="sg"><option value="">—</option><option>ذكر</option><option>أنثى</option></select></div><div class="field"><label>ملاحظات</label><input id="snote"></div><div><button class="btn primary">➕ إضافة التلميذ</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>الرمز</th><th>القسم</th><th></th></tr>${C.students.map(x=>`<tr><td><button class="btn light" onclick="student('${x.id}')">${esc((x.first_name||'')+' '+(x.last_name||''))}</button></td><td>${esc(x.student_code||'')}</td><td>${esc(C.classes.find(c=>c.id===x.class_id)?.name||'')}</td><td><button class="btn danger" onclick="del('students','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="4">لا يوجد تلاميذ</td></tr>'}</table></div>`)}
function student(id){let s=C.students.find(x=>x.id===id),a=C.assessments.filter(x=>x.student_id===id),sp=C.support.filter(x=>x.student_id===id),f=C.fluency.filter(x=>x.student_id===id),m=C.math.filter(x=>x.student_id===id),t=C.tracking.filter(x=>x.student_id===id);$('modalbox').innerHTML=`<h2>📁 ${esc((s?.first_name||'')+' '+(s?.last_name||''))}</h2><div class="grid g3"><div class="card"><b>${a.length}</b><div class="muted">روائز</div></div><div class="card"><b>${sp.length}</b><div class="muted">دعم</div></div><div class="card"><b>${f.length}</b><div class="muted">طلاقة</div></div></div><h3>الروائز</h3><p>${a.map(x=>esc((x.subject||'')+' — '+(x.placement_threshold||x.mastery||''))).join('<br>')||'لا توجد'}</p><h3>الدعم</h3><p>${sp.map(x=>esc((x.subject||'')+' — '+(x.path||'')+' — '+(x.status||''))).join('<br>')||'لا توجد'}</p><h3>الطلاقة</h3><p>${f.map(x=>esc((x.words_per_minute||'—')+' كلمة/د · '+(x.accuracy||'—')+'%')).join('<br>')||'لا توجد'}</p><h3>الرياضيات والتتبع</h3><p>${m.map(x=>esc((x.domain||'')+' — '+(x.mastery||'')+' — '+(x.score??'')+'%')).join('<br>')||'لا توجد'}</p><p>${t.map(x=>esc((x.subject||'')+' — '+(x.skill||'')+' — '+(x.mastery||''))).join('<br>')||'لا توجد'}</p><button class="btn dark" onclick="closeModal()">إغلاق</button>`;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function levels(sub){if(sub==='العربية')return ['حرف','كلمة','فقرة','أقصوصة'];if(sub==='الرياضيات')return ['رقم','جمع','طرح','ضرب','قسمة'];return ['Lettre','Mot simple','Mot avancé','Mot avec GC','Phrase DP','Texte']}
function assessmentPage(){return shell('📝 الروائز','رائز الموضعة: المادة + عتبة الوصول فقط',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();save('assessments',{student_id:$('ast').value,kind:'placement',title:'رائز الموضعة',subject:$('asub').value,mastery:$('aplace').value,placement_threshold:$('aplace').value,score:null,criteria:{subject:$('asub').value,placement_threshold:$('aplace').value,notes:$('anote').value},assessed_at:$('adate').value,created_by:user.id})"><div class="field"><label>التلميذ</label><select id="ast">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>المادة</label><select id="asub" onchange="updateLevels()"><option>العربية</option><option>الفرنسية</option><option>الرياضيات</option></select></div><div class="field"><label>عتبة الموضعة</label><select id="aplace">${levels('العربية').map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input id="adate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>ملاحظات</label><input id="anote"></div><div><button class="btn primary">➕ تسجيل</button></div></form></div><div class="alert a-orange">يعتمد التسجيل على عتبة الموضعة التي وصل إليها المتعلم.</div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>المادة</th><th>العتبة</th><th>التاريخ</th><th></th></tr>${C.assessments.map(x=>`<tr><td>${esc(C.students.find(s=>s.id===x.student_id)?.first_name||x.student_id)}</td><td>${esc(x.subject||x.criteria?.subject||'')}</td><td><span class="badge">${esc(x.placement_threshold||x.mastery||'')}</span></td><td>${esc(x.assessed_at||'')}</td><td><button class="btn danger" onclick="del('assessments','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد روائز</td></tr>'}</table></div>`)}function updateLevels(){let s=$('asub').value;$('aplace').innerHTML=levels(s).map(x=>`<option>${esc(x)}</option>`).join('')}
function supportPage(){return shell('🎯 الدعم TaRL','تشخيص → مجموعة متجانسة → دعم → إعادة تحقق',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();save('support_paths',{student_id:$('sst').value,path:$('spath').value,subject:$('ssub').value,status:$('sstatus').value,notes:$('snote').value})"><div class="field"><label>التلميذ</label><select id="sst">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>المادة</label><select id="ssub"><option>العربية</option><option>الفرنسية</option><option>الرياضيات</option></select></div><div class="field"><label>المسار</label><select id="spath"><option>أساس</option><option>متوسط</option><option>تحدي</option></select></div><div class="field"><label>الحالة</label><select id="sstatus"><option>مفتوح</option><option>قيد الدعم</option><option>تحقق</option></select></div><div class="field"><label>ملاحظات</label><input id="snote"></div><div><button class="btn primary">➕ إنشاء مسار</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>المادة</th><th>المسار</th><th>الحالة</th><th></th></tr>${C.support.map(x=>`<tr><td>${esc(C.students.find(s=>s.id===x.student_id)?.first_name||x.student_id)}</td><td>${esc(x.subject||'')}</td><td>${esc(x.path||'')}</td><td>${esc(x.status||'')}</td><td><button class="btn danger" onclick="del('support_paths','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد مسارات</td></tr>'}</table></div>`)}
function subjectPage(k){let title=k==='arabic'?'العربية':'الفرنسية';return shell(title,'تتبع التعلمات',`<div class="grid g3">${C.students.map(s=>{let a=C.assessments.filter(x=>x.student_id===s.id&&(x.subject===title||x.criteria?.subject===title));return `<div class="card"><b>${esc(s.first_name+' '+s.last_name)}</b><p>${a.map(x=>esc(x.placement_threshold||x.mastery||'')).join(' · ')||'لا يوجد رائز'}</p></div>`}).join('')||'<div class="card">أضف التلاميذ أولاً.</div>'}</div>`)}
function fluencyPage(){return shell('⚡ الطلاقة','كلمات/دقيقة + دقة',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();save('fluency_records',{student_id:$('fst').value,words_per_minute:Number($('fw').value)||0,accuracy:Number($('fa').value)||0,level:$('fl').value,mastery:'قيد التتبع',observed_at:new Date().toISOString(),created_by:user.id})"><div class="field"><label>التلميذ</label><select id="fst">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>كلمة/دقيقة</label><input id="fw" type="number" min="0" required></div><div class="field"><label>الدقة %</label><input id="fa" type="number" min="0" max="100" required></div><div class="field"><label>المستوى</label><input id="fl"></div><div><button class="btn primary">➕ حفظ</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>كلمة/د</th><th>الدقة</th><th></th></tr>${C.fluency.map(x=>`<tr><td>${esc(C.students.find(s=>s.id===x.student_id)?.first_name||x.student_id)}</td><td>${x.words_per_minute}</td><td>${x.accuracy}%</td><td><button class="btn danger" onclick="del('fluency_records','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="4">لا توجد قياسات</td></tr>'}</table></div>`)}
function mathPage(){return shell('∑ الرياضيات','شبكات التصديق على اللبنات',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();save('math_validations',{student_id:$('mst').value,domain:$('md').value,score:Number($('ms').value)||0,mastery:$('mm').value,validated_at:new Date().toISOString(),created_by:user.id})"><div class="field"><label>التلميذ</label><select id="mst">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>المجال</label><select id="md"><option>الأعداد</option><option>العمليات</option><option>حل المسائل</option><option>الهندسة</option><option>القياس</option></select></div><div class="field"><label>النتيجة %</label><input id="ms" type="number" min="0" max="100"></div><div class="field"><label>التحكم</label><select id="mm"><option>غير متحكم</option><option>في طور التحكم</option><option>متحكم</option></select></div><div><button class="btn primary">✓ تسجيل التصديق</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>المجال</th><th>النتيجة</th><th>التحكم</th><th></th></tr>${C.math.map(x=>`<tr><td>${esc(C.students.find(s=>s.id===x.student_id)?.first_name||x.student_id)}</td><td>${esc(x.domain||'')}</td><td>${esc(x.score??'')}%</td><td>${esc(x.mastery||'')}</td><td><button class="btn danger" onclick="del('math_validations','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد بيانات</td></tr>'}</table></div>`)}
function trackingPage(){return shell('📈 التتبع','المادة + المهارة + حالة التحكم',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();save('tracking_records',{student_id:$('tst').value,subject:$('tsub').value,skill:$('tskill').value,mastery:$('tm').value,notes:$('tn').value,observed_at:new Date().toISOString(),created_by:user.id})"><div class="field"><label>التلميذ</label><select id="tst">${C.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div><div class="field"><label>المادة</label><select id="tsub"><option>العربية</option><option>الفرنسية</option><option>الرياضيات</option></select></div><div class="field"><label>المهارة</label><input id="tskill" required></div><div class="field"><label>التحكم</label><select id="tm"><option>غير متحكم</option><option>في طور التحكم</option><option>متحكم</option></select></div><div class="field"><label>ملاحظة</label><input id="tn"></div><div><button class="btn primary">➕ حفظ</button></div></form></div><div class="card tablewrap"><table class="table"><tr><th>التلميذ</th><th>المادة</th><th>المهارة</th><th>التحكم</th><th></th></tr>${C.tracking.map(x=>`<tr><td>${esc(C.students.find(s=>s.id===x.student_id)?.first_name||x.student_id)}</td><td>${esc(x.subject||'')}</td><td>${esc(x.skill||'')}</td><td>${esc(x.mastery||'')}</td><td><button class="btn danger" onclick="del('tracking_records','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد سجلات</td></tr>'}</table></div>`)}
function blocksPage(){return shell('🧩 اللبنات والإشهاد','التصديق على التحكم في التعلمات',`<div class="grid g3">${C.blocks.map(x=>`<div class="card"><span class="badge">${esc(x.code||'لبنة')}</span><h3>${esc(x.title||x.name||'لبنة')}</h3><p>${esc(x.description||x.objective||'')}</p></div>`).join('')||'<div class="card">لا توجد لبنات محملة بعد.</div>'}</div>`)}
function explicitPage(){return shell('🎓 التعليم الصريح','أشرح وأمذجه → نطبق معاً → ممارسة مستقلة → تحقق ومعالجة',`<div class="card"><form onsubmit="event.preventDefault();save('explicit_lessons',{title:$('ext').value||'سيناريو تعليم صريح',content:JSON.stringify({model:$('ex1').value,guided:$('ex2').value,independent:$('ex3').value,assessment:$('ex4').value}),teacher_id:user.id,created_at:new Date().toISOString()})"><div class="field"><label>عنوان السيناريو</label><input id="ext"></div><div class="grid g2"><div class="field"><label>أشرح وأمذجه</label><textarea id="ex1"></textarea></div><div class="field"><label>نطبق معاً</label><textarea id="ex2"></textarea></div><div class="field"><label>ممارسة مستقلة</label><textarea id="ex3"></textarea></div><div class="field"><label>تحقق ومعالجة</label><textarea id="ex4"></textarea></div></div><button class="btn primary">💾 حفظ السيناريو</button></form></div><div class="card">${C.explicit.map(x=>`<div class="alert a-green">${esc(x.title||'سيناريو')} — ${esc(x.created_at||'')}</div>`).join('')||'لا توجد سيناريوهات.'}</div>`)}
// ---------- Integrated PPTX Mind Map Engine ----------
let MM={slides:[],tree:null,nodes:[],theme:'school',mode:'slides'};const PAL=['#17aee5','#79b943','#ffbd16','#a9a9a9','#e58c2e','#8e7cc3','#d95f76','#36a39c'];
function mindmapPage(){return shell('🧠 الخطاطات الذهنية PPTX','محرك مدمج في رُوَّاد — العربية / الفرنسية / الرياضيات',`<div class="card"><div class="mind-settings"><div class="field"><label>المستوى</label><input id="mmlevel" placeholder="المستوى 5"></div><div class="field"><label>المرحلة</label><input id="mmphase" placeholder="المرحلة 1"></div><div class="field"><label>الأسبوع</label><input id="mmweek" placeholder="الأسبوع 4"></div><div class="field"><label>الحصة</label><input id="mmlesson" placeholder="الحصة 1"></div></div><div class="drop" id="drop" style="margin-top:12px" onclick="$('ppt').click()">📎 <b>اختر درساً PPTX</b><br><span class="small">يتم استخراج النص من الشرائح داخل المتصفح، مع محاولة احترام مستويات العناوين.</span><input id="ppt" type="file" accept=".pptx" hidden onchange="readPPTX(this.files[0])"></div><div class="mind-toolbar" style="margin-top:12px"><button class="btn primary" onclick="generateMindMap()">🧠 توليد الخطاطة</button><button class="btn dark" onclick="saveMindMap()">💾 حفظ الخطاطة</button><button class="btn light" onclick="downloadMindHTML()">⬇️ HTML</button><button class="btn light" onclick="downloadMindJSON()">JSON</button><button class="btn light" onclick="printMind()">🖨️ طباعة</button><button class="btn danger" onclick="clearMind()">مسح</button></div><div id="mmstatus" class="alert a-orange">لم يتم تحميل درس بعد.</div></div><div class="card"><div class="legend"><span style="background:#e8f5ff">العقدة المركزية = عنوان الدرس</span><span style="background:#edf8e9">الفروع = محاور / شرائح</span><span style="background:#fff6d9">العناصر = التفاصيل المستخرجة</span></div><div class="mind-stage" id="mindStage"><div class="mind-world" id="mindWorld"></div></div></div>`)}
async function readPPTX(file){if(!file)return;try{MM={slides:[],tree:null,nodes:[],theme:'school',mode:'slides'};let zip=await JSZip.loadAsync(file),names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n));names.sort((a,b)=>+a.match(/slide(\d+)/)[1]-+b.match(/slide(\d+)/)[1]);for(let name of names){let xml=await zip.file(name).async('text'),doc=new DOMParser().parseFromString(xml,'application/xml');let paras=[...doc.getElementsByTagName('a:p')];let blocks=[];for(let p of paras){let text=[...p.getElementsByTagName('a:t')].map(t=>t.textContent||'').join('').replace(/\s+/g,' ').trim();if(!text)continue;let pp=p.getElementsByTagName('a:pPr')[0],lvl=pp?.getAttribute('lvl');let runs=[...p.getElementsByTagName('a:rPr')];let sizes=runs.map(r=>Number(r.getAttribute('sz')||0)).filter(Boolean);blocks.push({text,lvl:lvl===null?null:Number(lvl):Number(lvl),font:sizes.length?Math.max(...sizes):0})}MM.slides.push({slide:+name.match(/slide(\d+)/)[1],blocks})}let total=MM.slides.reduce((n,s)=>n+s.blocks.length,0);$('mmstatus').className='alert a-green';$('mmstatus').textContent=`تم استخراج ${total} فقرة من ${MM.slides.length} شريحة. اضغط «توليد الخطاطة».`;generateMindMap()}catch(e){$('mmstatus').className='alert a-red';$('mmstatus').textContent='تعذر قراءة الملف: '+e.message}}
function inferLevel(block,index){if(block.lvl!==null)return block.lvl;let t=block.text;if(/^(المستوى|المرحلة|الأسبوع|الحصة|عنوان|الهدف|الأهداف|المراحل|المدة|التقويم|الممارسة|المنهجية|التمهيد|نشاط|ملاحظة|Conclusion|Objectif|Étape|Durée|Activité|Méthode|Évaluation)/i.test(t))return 1;if(block.font>=2200||t.length<70&&/[؟:：]$/.test(t))return 1;if(/^[•▪●\-–—]/.test(t))return 2;return index===0?0:2}
function buildMindTree(){let all=[];MM.slides.forEach(s=>s.blocks.forEach(b=>all.push({...b,slide:s.slide})));if(!all.length)return null;let root={text:all[0].text,slide:all[0].slide,children:[]},stack=[{node:root,lvl:0}];for(let i=1;i<all.length;i++){let b=all[i],lvl=inferLevel(b,i);if(lvl<=0)lvl=1;let item={text:b.text,slide:b.slide,children:[]};while(stack.length&&stack[stack.length-1].lvl>=lvl)stack.pop();(stack[stack.length-1]||{node:root}).node.children.push(item);stack.push({node:item,lvl})}return root}
function flattenBranches(tree){if(!tree)return[];let branches=[];tree.children.forEach((c,i)=>{let items=[];function walk(n,depth){if(depth>0)items.push(n);(n.children||[]).forEach(x=>walk(x,depth+1))}walk(c,0);branches.push({id:'b'+i,title:c.text,items:items.slice(0,18),slide:c.slide})});return branches}
function generateMindMap(){if(!MM.slides.length){let txt=prompt('ألصق نص الدرس، كل سطر عنصر:');if(!txt)return;MM.slides=[{slide:1,blocks:txt.split(/\n+/).filter(Boolean).map((text,i)=>({text,lvl:i===0?0:1,font:0}))}]}MM.tree=buildMindTree();renderMindMap();$('mmstatus').className='alert a-green';$('mmstatus').textContent=`تم توليد الخطاطة من ${MM.slides.length} شريحة. يمكن سحب الفروع والعناصر وتعديلها بالنقر المزدوج.`}
function renderMindMap(){let w=$('mindWorld');if(!w||!MM.tree)return;let branches=flattenBranches(MM.tree);w.innerHTML='';let center=document.createElement('div');center.className='mm-node mm-center';center.dataset.id='center';center.contentEditable='true';center.textContent=MM.tree.text;center.style.left='602px';center.style.top='415px';w.appendChild(center);let positions=[[80,100],[1070,100],[60,430],[1080,430],[120,750],[1020,750],[520,40],[520,800]];MM.nodes=[];branches.slice(0,8).forEach((b,i)=>{let d=document.createElement('div');d.className='mm-node';d.dataset.id=b.id;d.style.background=PAL[i%PAL.length];d.style.left=positions[i][0]+'px';d.style.top=positions[i][1]+'px';d.innerHTML=`<div class="mm-title" contenteditable="true">${esc(b.title)}</div><div class="mm-items">${b.items.map(x=>`<div contenteditable="true">• ${esc(x.text)}</div>`).join('')}</div><div class="mm-slide">الشريحة ${b.slide}</div>`;w.appendChild(d);MM.nodes.push({el:d,id:b.id});makeDraggable(d)});drawMindLines()}
function drawMindLines(){let w=$('mindWorld');if(!w)return;let old=w.querySelector('.mind-svg');old?.remove();let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('mind-svg');w.insertBefore(svg,w.firstChild);let center=w.querySelector('[data-id="center"]');if(!center)return;let cr=center.getBoundingClientRect(),wr=w.getBoundingClientRect();let c={x:cr.left-wr.left+cr.width/2,y:cr.top-wr.top+cr.height/2};w.querySelectorAll('.mm-node:not(.mm-center)').forEach(n=>{let r=n.getBoundingClientRect(),p={x:r.left-wr.left+r.width/2,y:r.top-wr.top+r.height/2};let mx=(c.x+p.x)/2;let line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d',`M ${c.x} ${c.y} C ${mx} ${c.y}, ${mx} ${p.y}, ${p.x} ${p.y}`);line.setAttribute('fill','none');line.setAttribute('stroke','#374151');line.setAttribute('stroke-width','3');svg.appendChild(line)})}
function makeDraggable(el){let sx,sy,ox,oy,drag=false;el.addEventListener('pointerdown',e=>{if(e.target.isContentEditable)return;drag=true;el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=parseFloat(el.style.left)||0;oy=parseFloat(el.style.top)||0});el.addEventListener('pointermove',e=>{if(!drag)return;el.style.left=Math.max(0,ox+e.clientX-sx)+'px';el.style.top=Math.max(0,oy+e.clientY-sy)+'px';drawMindLines()});el.addEventListener('pointerup',()=>drag=false)}
function saveMindMap(){if(!MM.tree){toast('ولّد الخطاطة أولاً');return}let payload={title:MM.tree.text,level:$('mmlevel')?.value||'',phase:$('mmphase')?.value||'',week:$('mmweek')?.value||'',lesson:$('mmlesson')?.value||'',slides:MM.slides,created_at:new Date().toISOString()};localStorage.setItem('riyadah_mindmap',JSON.stringify(payload));toast('تم حفظ الخطاطة على هذا الجهاز.')}function downloadMindJSON(){if(!MM.tree)return toast('ولّد الخطاطة أولاً');let b=new Blob([JSON.stringify({tree:MM.tree,meta:{level:$('mmlevel').value,phase:$('mmphase').value,week:$('mmweek').value,lesson:$('mmlesson').value}},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='riyadah-mindmap.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function downloadMindHTML(){let content=$('mindWorld')?.outerHTML||'';let html=`<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>رُوَّاد — خطاطة ذهنية</title><style>body{font-family:Arial;padding:20px}.mind-world{position:relative;width:1450px;height:1000px}.mm-node{position:absolute;width:300px;min-height:100px;border:2px solid #263746;border-radius:28px;padding:15px;background:#eee;box-shadow:0 7px 18px #0002}.mm-center{width:245px;min-height:135px;background:#16b85a;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:bold}.mm-title{font-size:18px;font-weight:bold}.mm-items{font-size:13px;line-height:1.6}</style><h1>رُوَّاد — خطاطة ذهنية</h1>${content}</html>`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download='riyadah-mindmap.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function printMind(){let content=$('mindWorld')?.outerHTML||'';let w=window.open('','_blank');w.document.write(`<html lang="ar" dir="rtl"><head><title>رُوَّاد — خطاطة ذهنية</title><style>body{font-family:Arial}.mind-world{position:relative;width:1450px;height:1000px}.mm-node{position:absolute;width:300px;min-height:100px;border:2px solid #263746;border-radius:28px;padding:15px;background:#eee}.mm-center{background:#16b85a;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:bold}.mm-title{font-size:18px;font-weight:bold}.mm-items{font-size:13px;line-height:1.6}</style></head><body>${content}</body></html>`);w.document.close();w.print()}function clearMind(){MM={slides:[],tree:null,nodes:[],theme:'school',mode:'slides'};if($('mindWorld'))$('mindWorld').innerHTML='';if($('mmstatus')){$('mmstatus').className='alert a-orange';$('mmstatus').textContent='لم يتم تحميل درس بعد.'}}
function reportsPage(){return shell('📄 التقارير والتصدير','تقرير المؤسسة',`<div class="grid g3"><div class="card"><div class="num">${C.students.length}</div>تلاميذ</div><div class="card"><div class="num">${C.assessments.length}</div>روائز</div><div class="card"><div class="num">${C.support.length}</div>مسارات دعم</div></div><div class="card"><h2>تقرير رُوَّاد</h2><p>عدد التلاميذ: ${C.students.length}</p><p>عدد الأقسام: ${C.classes.length}</p><p>عدد الروائز: ${C.assessments.length}</p><p>عدد مسارات الدعم: ${C.support.length}</p><p>عدد قياسات الطلاقة: ${C.fluency.length}</p></div><button class="btn primary" onclick="printPage()">🖨️ طباعة / حفظ PDF</button>`)}function aiPage(){return shell('🤖 المساعد الذكي','تحليل مباشر لبيانات المؤسسة',`<div class="card"><textarea id="aiq" placeholder="مثال: ما عدد مسارات الدعم؟"></textarea><button class="btn primary" onclick="askAI()">تحليل</button></div><div class="card" id="aiout">اكتب سؤالك.</div>`)}function askAI(){let o=`المؤسسة تضم ${C.students.length} تلميذاً و${C.classes.length} أقسام و${C.assessments.length} روائز و${C.support.length} مسارات دعم و${C.fluency.length} قياسات طلاقة.`;$('aiout').innerHTML='<div class="alert a-green">'+esc(o)+'</div>'}function inspectorPage(){return shell('🧭 المفتشة والتأطير','مؤشرات قابلة للطباعة',`<div class="grid g3"><div class="card"><b>${C.students.length}</b><div>متعلمين</div></div><div class="card"><b>${C.assessments.length}</b><div>روائز</div></div><div class="card"><b>${C.support.length}</b><div>دعم</div></div></div><textarea id="irec" placeholder="ملاحظات وتوصيات الزيارة"></textarea><button class="btn primary" onclick="printPage()">طباعة التقرير</button>`)}function settingsPage(){return shell('⚙️ الإعدادات','الحساب الحالي',`<div class="card"><p><b>الاسم:</b> ${esc(profile.full_name||'')}</p><p><b>الدور:</b> ${esc(profile.role||'')}</p><p><b>المؤسسة:</b> ${esc(profile.school_name||'')}</p></div>`)}function render(){let h=active==='dashboard'?dashboard():active==='classes'?classesPage():active==='students'?studentsPage():active==='assessments'?assessmentPage():active==='support'?supportPage():['arabic','french'].includes(active)?subjectPage(active):active==='fluency'?fluencyPage():active==='math'?mathPage():active==='tracking'?trackingPage():active==='blocks'?blocksPage():active==='explicit'?explicitPage():active==='mindmap'?mindmapPage():active==='reports'?reportsPage():active==='ai'?aiPage():active==='inspector'?inspectorPage():settingsPage();$('page').innerHTML=h}function printPage(){window.print()}function logout(){sb.auth.signOut().then(()=>location.replace('/'))}window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('resize',()=>drawMindLines());boot();
</script></body></html>
