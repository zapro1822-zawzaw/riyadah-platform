<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2038">
<title>رُوّاد — منصة مؤسسات الريادة</title>
<style>
html,body{margin:0;min-height:100%;background:#0b2038;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
.loading{min-height:100vh;display:grid;place-items:center;color:#fff;text-align:center;padding:24px}
.box{max-width:620px;padding:28px;border-radius:22px;background:#fff;color:#17212b;box-shadow:0 20px 70px #0005}
.spinner{width:34px;height:34px;border:4px solid #dce8f5;border-top-color:#1769d3;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root" class="loading"><div class="box"><div class="spinner"></div><b>جاري فتح منصة رُوّاد…</b><p>يتم تجهيز فضاء العمل السحابي.</p></div></div>
<script>
const root=document.getElementById('root');
const target='/platform.html';
function openPlatform(){location.replace(target)}
setTimeout(openPlatform,120);
setTimeout(()=>{root.innerHTML='<div class="box"><b>رُوّاد</b><p>إذا لم تُفتح المنصة تلقائياً، اضغط الزر التالي.</p><button onclick="openPlatform()" style="border:0;border-radius:10px;padding:11px 18px;background:#1769d3;color:#fff;font-weight:800;cursor:pointer">فتح المنصة</button></div>'},4000);
</script>
</body>
</html>
