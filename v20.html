<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رُوَّاد V20</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#14283d;font-family:system-ui,Tahoma,Arial}.top{background:linear-gradient(135deg,#071b31,#1769d3);color:#fff;position:sticky;top:0;z-index:20}.bar{max-width:1500px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:10px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;background:#fff;color:#1769d3;display:grid;place-items:center;font-size:25px;font-weight:900}.brand h1{margin:0;font-size:20px}.muted{color:#708296}.top .muted{color:#dce8f5}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(.96)}.primary{background:#1769d3;color:#fff}.light{background:#eef3f8;color:#17304b}.danger{background:#fff0f0;color:#a22}.success{background:#e8f7ef;color:#076e49}.wrap{max-width:1500px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:230px 1fr;gap:14px}.side{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:8px;height:max-content;position:sticky;top:75px}.nav{width:100%;border:0;background:transparent;padding:11px;border-radius:10px;text-align:right;font:inherit;font-weight:750;cursor:pointer}.nav:hover,.nav.active{background:#eaf3ff;color:#1259a5}.card{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 5px 18px #183b5d0b}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(5,1fr)}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd7e1;border-radius:10px;font:inherit}.field textarea{min-height:100px}.num{font-size:28px;font-weight:950}.module{cursor:pointer;min-height:125px}.module .ico{font-size:28px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e6edf3;text-align:right;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eaf3ff;color:#135aa5;font-size:12px;font-weight:800}.alert{padding:11px;border-radius:10px;margin:8px 0}.a-green{background:#e9f8f0;color:#08734d}.a-orange{background:#fff4df;color:#855a00}.a-red{background:#fff0f0;color:#9b2222}.toast{position:fixed;left:15px;bottom:15px;background:#10263d;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:100}.drop{border:2px dashed #9db1c2;border-radius:14px;padding:28px;text-align:center;background:#fbfdff;cursor:pointer}.mind{position:relative;min-height:620px;overflow:auto;border:1px solid #d6e1ea;border-radius:15px;background:#fff}.world{position:relative;width:1200px;height:900px;margin:auto}.node{position:absolute;width:270px;min-height:90px;padding:14px;border:2px solid #263746;border-radius:22px;background:#fff;box-shadow:0 5px 14px #0002}.center{width:250px;min-height:120px;display:grid;place-items:center;text-align:center;font-weight:900;font-size:19px;background:#dff7e9}.line{position:absolute;height:3px;background:#7c92a6;transform-origin:left center}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.nav{min-width:max-content}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.bar{align-items:flex-start}.brand h1{font-size:17px}.stats,.g2,.g3{grid-template-columns:1fr}.wrap{padding:8px}}
</style></head><body><header class="top"><div class="bar"><div class="brand"><div class="logo">ر</div><div><h1>رُوَّاد V20</h1><div class="muted">منصة مؤسسات الريادة — نسخة مستقرة وعاملة</div></div></div><div class="toolbar"><button class="btn light" id="langBtn">عربي / FR / EN</button><button class="btn light" onclick="window.print()">🖨️ طباعة</button><button class="btn danger" id="logoutBtn">خروج</button></div></div></header><main class="wrap"><div class="layout"><aside class="side" id="side"></aside><section id="page"></section></div></main><div id="toast" class="toast"></div><script>
const SUPA_URL='https://bnqbavlkvrpcbhqxctda.supabase.co',SUPA_KEY='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q';const sb=window.supabase?.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user=null,profile={role:'teacher',is_active:true,school_name:'مجموعة مدارس التقدم'},lang='ar',active='dashboard',cloud=false;const LANGS={ar:{dir:'rtl'},fr:{dir:'ltr'},en:{dir:'ltr'}};const KEY='riyadah_v20_data';const NAV=[['dashboard','📊','لوحة القيادة'],['classes','🏫','الأقسام'],['students','👥','التلاميذ'],['assessments','📝','الروائز'],['support','🎯','الدعم TaRL'],['arabic','ع','العربية'],['french','Fr','الفرنسية'],['math','∑','الرياضيات'],['fluency','⚡','الطلاقة'],['tracking','📈','التتبع'],['blocks','🧩','اللبنات والإشهاد'],['explicit','🎓','التعليم الصريح'],['mindmap','🧠','الخطاطات الذهنية PPTX'],['reports','📄','التقارير والتصدير'],['ai','🤖','المساعد الذكي'],['inspector','🧭','المفتشة والتأطير'],['settings','⚙️','الإعدادات']];let D={classes:[],students:[],assessments:[],support:[],arabic:[],french:[],math:[],fluency:[],tracking:[],blocks:[],explicit:[],inspection:[]};function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)D={...D,...x}}catch(e){}}function persist(){localStorage.setItem(KEY,JSON.stringify(D))}function toast(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>x.style.display='none',2600)}function go(k){active=k;nav();render()}function nav(){let list=NAV;if(profile.role==='parent')list=NAV.filter(x=>['dashboard','students','assessments','settings'].includes(x[0]));if(profile.role==='inspector')list=NAV.filter(x=>['dashboard','students','assessments','support','blocks','tracking','reports','inspector','settings'].includes(x[0]));$('side').innerHTML=list.map(x=>`<button class="nav ${active===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}function shell(title,sub,body){return `<div class="card"><h2 style="margin:0 0 4px">${title}</h2><div class="muted">${sub||''}</div></div>${body}`}function dashboard(){return shell('📊 لوحة القيادة',profile.school_name+' · 2026/2027',`<div class="grid stats">${[['التلاميذ','students'],['الأقسام','classes'],['الروائز','assessments'],['مسارات الدعم','support'],['الطلاقة','fluency']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${D[x[1]].length}</div></div>`).join('')}</div><div class="card"><div class="alert a-green">✅ النسخة V20 تعمل بنظام محلي أولاً. البيانات تحفظ على هذا الجهاز، بينما تسجيل الدخول بالسحابة متاح للحسابات المرتبطة.</div></div><div class="grid g3">${NAV.slice(1).map(x=>`<div class="card module" onclick="go('${x[0]}')"><div class="ico">${x[1]}</div><h3>${x[2]}</h3><div class="muted">فتح الوحدة</div></div>`).join('')}</div>`)}function classesPage(){return shell('🏫 الأقسام','إنشاء الأقسام وتتبعها',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();add('classes',{name:$('cn').value.trim(),year:$('cy').value.trim()});this.reset();$('cy').value='2026/2027'"> <div class="field"><label>اسم القسم</label><input id="cn" required placeholder="المستوى الخامس 1"></div><div class="field"><label>السنة الدراسية</label><input id="cy" value="2026/2027"></div><button class="btn primary">➕ إضافة القسم</button></form></div>${table('classes',['القسم','السنة'],x=>[x.name,x.year])}`)}function studentsPage(){return shell('👥 التلاميذ','ملف المتعلم',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();add('students',{name:$('sn').value.trim(),className:$('sc').value.trim(),code:$('sid').value.trim()});this.reset()"><div class="field"><label>الاسم الكامل</label><input id="sn" required></div><div class="field"><label>القسم</label><input id="sc" placeholder="المستوى الخامس 1"></div><div class="field"><label>رمز المتعلم</label><input id="sid"></div><button class="btn primary">➕ إضافة متعلم</button></form></div>${table('students',['الاسم','القسم','الرمز'],x=>[x.name,x.className,x.code])}`)}function assessmentsPage(){return shell('📝 الروائز','تقييم قبلي وبعدي',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();add('assessments',{student:$('as').value.trim(),subject:$('av').value,phase:$('ap').value,score:Number($('ac').value||0)});this.reset()"><div class="field"><label>المتعلم</label><input id="as" required></div><div class="field"><label>المادة</label><select id="av"><option>العربية</option><option>الفرنسية</option><option>الرياضيات</option></select></div><div class="field"><label>المرحلة</label><select id="ap"><option>قبلي</option><option>بعدي</option></select></div><div class="field"><label>النقطة</label><input id="ac" type="number" min="0" max="100" value="0"></div><button class="btn primary">💾 حفظ التقييم</button></form></div>${table('assessments',['المتعلم','المادة','المرحلة','النقطة'],x=>[x.student,x.subject,x.phase,x.score])}`)}function generic(key,title,fields){return shell(title,'وحدة قابلة للتسجيل والتتبع',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();const o={};${fields.map(f=>`o.${f.k}=$('${f.k}').value`).join(';')}add('${key}',o);this.reset()}">${fields.map(f=>`<div class="field"><label>${f.l}</label><input id="${f.k}" ${f.req?'required':''}></div>`).join('')}<button class="btn primary">💾 حفظ</button></form></div>${table(key,fields.map(f=>f.l),x=>fields.map(f=>x[f.k]))}`)}function table(key,heads,row){const rows=Array.isArray(D[key])?D[key]:[];return `<div class="card tablewrap"><table class="table"><tr>${heads.map(h=>`<th>${h}</th>`).join('')}<th>إجراء</th></tr>${rows.map((x,i)=>`<tr>${row(x).map(v=>`<td>${esc(v)}</td>`).join('')}<td><button class="btn danger" onclick="removeItem('${key}',${i})">حذف</button></td></tr>`).join('')||`<tr><td colspan="${heads.length+1}">لا توجد بيانات بعد</td></tr>`}</table></div>`}function add(key,o){if(!Array.isArray(D[key]))D[key]=[];D[key].push({id:Date.now()+Math.random(),...o});persist();render();toast('تم الحفظ بنجاح')}function removeItem(k,i){if(confirm('حذف هذا السجل؟')){D[k].splice(i,1);persist();render();toast('تم الحذف')}}function mindmapPage(){return shell('🧠 الخطاطات الذهنية من PPTX','تحميل درس ثم استخراج العناوين والفقرات كما وردت في الشرائح',`<div class="card"><label class="drop" for="pptx">📥 اضغط هنا لاختيار ملف PowerPoint (.pptx)<input id="pptx" class="hidden" type="file" accept=".pptx"></label><div id="mindStatus" class="alert a-orange">لم يتم تحميل ملف بعد.</div></div><div id="mindResult"></div>`)}async function handlePptx(file){$('mindStatus').textContent='⏳ جارٍ تحليل الملف...';try{if(!window.JSZip)throw Error('مكتبة قراءة PPTX لم تُحمّل بعد.');const zip=await JSZip.loadAsync(file);const slides=Object.keys(zip.files).filter(x=>/^ppt\/slides\/slide\d+\.xml$/.test(x)).sort((a,b)=>Number(a.match(/\d+/)[0])-Number(b.match(/\d+/)[0]));let all=[];for(const p of slides){const xml=await zip.files[p].async('text'),doc=new DOMParser().parseFromString(xml,'application/xml');const paras=[...doc.getElementsByTagNameNS('*','p')];paras.forEach((p)=>{const ts=[...p.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('').trim();if(ts)all.push({slide:Number((path.match(/slide(\d+)\.xml$/)||[])[1]||0),text:ts,level:Number(p.getElementsByTagNameNS('*','pPr')[0]?.getAttribute('lvl')||0)})})}if(!all.length)throw Error('لم يتم العثور على نص داخل الشرائح.');const groups=[];all.forEach(x=>{if(x.level<=0||groups.length===0)groups.push({title:x.text,slide:x.slide,items:[]});else groups[groups.length-1].items.push(x.text)});$('mindStatus').className='alert a-green';$('mindStatus').textContent=`✅ تم استخراج ${all.length} فقرة من ${slides.length} شريحة.`;$('mindResult').innerHTML=`<div class="card"><div class="actions"><button class="btn primary" onclick="window.print()">🖨️ طباعة الخطاطة</button><button class="btn light" onclick="downloadMap()">⬇️ تصدير HTML</button></div><div class="mind"><div class="world" id="world"></div></div></div>`;window.__map={name:file.name,all,groups};drawMap()}catch(e){$('mindStatus').className='alert a-red';$('mindStatus').textContent='❌ '+e.message}}function drawMap(){const w=$('world'),m=window.__map;if(!w)return;w.innerHTML='';const cx=600,cy=390;w.insertAdjacentHTML('beforeend',`<div class="node center" style="left:${cx-125}px;top:${cy-60}px">${esc(m.name.replace(/\.pptx$/i,''))}</div>`);const n=Math.min(m.groups.length,10);m.groups.forEach((g,i)=>{const a=(Math.PI*2*i/n)-Math.PI/2,x=cx+360*Math.cos(a)-135,y=cy+280*Math.sin(a)-55;w.insertAdjacentHTML('beforeend',`<div class="node" style="left:${x}px;top:${y}px"><b>${esc(g.title)}</b><div class="muted" style="margin-top:7px">${g.items.slice(0,12).map(esc).join(' · ')}</div><small>الشريحة ${g.slide}</small></div>`);const x1=cx,y1=cy,x2=x+135,y2=y+45,dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx)*180/Math.PI;w.insertAdjacentHTML('beforeend',`<div class="line" style="left:${x1}px;top:${y1}px;width:${len}px;transform:rotate(${ang}deg)"></div>`)})}function downloadMap(){const m=window.__map;if(!m)return;const html='<!doctype html><meta charset="utf-8"><title>خطاطة ذهنية</title><style>body{font-family:Arial;direction:rtl;padding:30px}h1{color:#1769d3}.g{margin:20px;padding:15px;border:1px solid #ccc;border-radius:12px}</style><h1>'+esc(m.name)+'</h1>'+m.groups.map(g=>'<div class="g"><h2>'+esc(g.title)+'</h2><p>'+g.items.map(esc).join(' — ')+'</p><small>الشريحة '+g.slide+'</small></div>').join('');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download='riyadah-mindmap.html';a.click();URL.revokeObjectURL(a.href)}function render(){const p=$('page');if(active==='dashboard')p.innerHTML=dashboard();else if(active==='classes')p.innerHTML=classesPage();else if(active==='students')p.innerHTML=studentsPage();else if(active==='assessments')p.innerHTML=assessmentsPage();else if(active==='mindmap')p.innerHTML=mindmapPage();else if(active==='support')p.innerHTML=generic('support','🎯 الدعم TaRL',[{k:'student',l:'المتعلم',req:true},{k:'level',l:'المستوى'},{k:'need',l:'الحاجة'}]);else if(active==='arabic')p.innerHTML=generic('arabic','ع العربية',[{k:'student',l:'المتعلم'},{k:'skill',l:'المهارة'},{k:'score',l:'النتيجة'}]);else if(active==='french')p.innerHTML=generic('french','Fr الفرنسية',[{k:'student',l:'المتعلم'},{k:'skill',l:'المهارة'},{k:'score',l:'النتيجة'}]);else if(active==='math')p.innerHTML=generic('math','∑ الرياضيات',[{k:'student',l:'المتعلم'},{k:'block',l:'اللبنة'},{k:'status',l:'الإشهاد'}]);else if(active==='fluency')p.innerHTML=generic('fluency','⚡ الطلاقة',[{k:'student',l:'المتعلم'},{k:'words',l:'الكلمات/الدقيقة'},{k:'accuracy',l:'الدقة'}]);else if(active==='tracking')p.innerHTML=generic('tracking','📈 التتبع',[{k:'student',l:'المتعلم'},{k:'skill',l:'المهارة'},{k:'status',l:'الحالة'}]);else if(active==='blocks')p.innerHTML=generic('blocks','🧩 اللبنات والإشهاد',[{k:'student',l:'المتعلم'},{k:'block',l:'اللبنة'},{k:'status',l:'الإشهاد'}]);else if(active==='explicit')p.innerHTML=generic('explicit','🎓 التعليم الصريح',[{k:'lesson',l:'الدرس'},{k:'objective',l:'الهدف'},{k:'status',l:'الحالة'}]);else if(active==='reports')p.innerHTML=shell('📄 التقارير والتصدير','تصدير بيانات المنصة',`<div class="card"><button class="btn primary" onclick="exportData()">⬇️ تصدير نسخة احتياطية JSON</button><button class="btn light" onclick="window.print()">🖨️ طباعة التقرير</button></div>`);else if(active==='ai')p.innerHTML=shell('🤖 المساعد الذكي','مساعد محلي لاقتراحات التدريس',`<div class="card"><div class="field"><label>اكتب طلبك</label><textarea id="aiq" placeholder="مثلاً: اقترح دعماً لتلميذ يعاني في القراءة..."></textarea></div><button class="btn primary" onclick="aiAnswer()">✨ اقتراح</button><div id="air" class="alert a-green hidden"></div></div>`);else if(active==='inspector')p.innerHTML=shell('🧭 المفتشة والتأطير','تسجيل ملاحظات التأطير والتتبع',generic('inspection','🧭 المفتشة والتأطير',[{k:'student',l:'المتعلم'},{k:'note',l:'الملاحظة'},{k:'action',l:'الإجراء المقترح'}]));else if(active==='settings')p.innerHTML=shell('⚙️ الإعدادات','الحساب والبيانات',`<div class="card"><p><b>الحساب:</b> ${esc(user?.email||'وضع محلي')}</p><p><b>الدور:</b> ${esc(profile.role)}</p><p><b>المدرسة:</b> ${esc(profile.school_name||'')}</p><button class="btn danger" onclick="clearLocal()">مسح بيانات هذا الجهاز</button></div>`)}function aiAnswer(){const q=$('aiq').value.trim();$('air').classList.remove('hidden');$('air').textContent=q?'اقتراح: حدّد المهارة المستهدفة، قدّم نشاطاً قصيراً متدرجاً، ثم أعد القياس بعد الدعم. يمكن تسجيل النتيجة في وحدة التتبع.':'اكتب طلباً أولاً.'}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='riyadah-v20-backup.json';a.click()}function clearLocal(){if(confirm('سيتم حذف بيانات المنصة المخزنة على هذا الجهاز. متابعة؟')){localStorage.removeItem(KEY);location.reload()}}async function logout(){try{if(sb)await sb.auth.signOut({scope:'local'})}catch(e){}location.replace('/')}$('langBtn').onclick=()=>{lang=lang==='ar'?'fr':lang==='fr'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=LANGS[lang].dir;toast(lang==='ar'?'العربية':lang==='fr'?'Français':'English')};$('logoutBtn').onclick=logout;$('page').addEventListener('change',e=>{if(e.target.id==='pptx'&&e.target.files[0])handlePptx(e.target.files[0])});load();async function boot(){if(sb){try{const r=await sb.auth.getUser();if(r.data?.user){user=r.data.user;cloud=true;const p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.data)profile=p.data;else if(user.email?.toLowerCase()==='zapro1822@gmail.com')profile={role:'admin',is_active:true,school_name:'مجموعة مدارس التقدم'};else if(user.user_metadata?.requested_role)profile={role:user.user_metadata.requested_role,is_active:true,school_name:''}}}catch(e){console.warn('Cloud unavailable; local mode',e)}}nav();render()}boot();
