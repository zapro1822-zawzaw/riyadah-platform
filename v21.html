<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رُوّاد V21</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#14283d;font-family:system-ui,Tahoma,Arial}.top{background:linear-gradient(135deg,#071b31,#1769d3);color:#fff;position:sticky;top:0;z-index:20}.bar{max-width:1500px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:10px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;background:#fff;color:#1769d3;display:grid;place-items:center;font-size:25px;font-weight:900}.brand h1{margin:0;font-size:20px}.muted{color:#708296}.top .muted{color:#dce8f5}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#1769d3;color:#fff}.light{background:#eef3f8;color:#17304b}.danger{background:#fff0f0;color:#a22}.wrap{max-width:1500px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:230px 1fr;gap:14px}.side{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:8px;height:max-content;position:sticky;top:75px}.nav{width:100%;border:0;background:transparent;padding:11px;border-radius:10px;text-align:right;font:inherit;font-weight:750;cursor:pointer}.nav.active,.nav:hover{background:#eaf3ff;color:#1259a5}.card{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 5px 18px #183b5d0b}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(5,1fr)}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd7e1;border-radius:10px;font:inherit}.field textarea{min-height:100px}.num{font-size:28px;font-weight:950}.module{cursor:pointer;min-height:120px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e6edf3;text-align:right;white-space:nowrap}.alert{padding:11px;border-radius:10px;margin:8px 0}.green{background:#e9f8f0;color:#08734d}.orange{background:#fff4df;color:#855a00}.red{background:#fff0f0;color:#9b2222}.drop{display:block;border:2px dashed #9db1c2;border-radius:14px;padding:28px;text-align:center;background:#fbfdff;cursor:pointer}.hidden{display:none!important}.mind{overflow:auto;border:1px solid #d6e1ea;border-radius:15px;background:#fff;padding:10px}.world{position:relative;width:1200px;height:850px;margin:auto}.node{position:absolute;width:270px;min-height:90px;padding:14px;border:2px solid #263746;border-radius:22px;background:#fff;box-shadow:0 5px 14px #0002}.center{width:250px;min-height:120px;display:grid;place-items:center;text-align:center;font-weight:900;font-size:19px;background:#dff7e9}.line{position:absolute;height:3px;background:#7c92a6;transform-origin:left center}.toast{position:fixed;left:15px;bottom:15px;background:#10263d;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:100}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.nav{min-width:max-content}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.bar{align-items:flex-start}.brand h1{font-size:17px}.stats,.g2,.g3{grid-template-columns:1fr}.wrap{padding:8px}}</style></head><body><header class="top"><div class="bar"><div class="brand"><div class="logo">ر</div><div><h1>رُوّاد V21</h1><div class="muted">منصة مؤسسات الريادة — نسخة مصححة</div></div></div><div class="toolbar"><button class="btn light" id="printBtn">🖨️ طباعة</button><button class="btn danger" id="logoutBtn">خروج</button></div></div></header><main class="wrap"><div class="layout"><aside class="side" id="side"></aside><section id="page"></section></div></main><div id="toast" class="toast"></div><script>
'use strict';
const U='https://bnqbavlkvrpcbhqxctda.supabase.co',K='sb_publishable_VdXBsOFWR1Y6N7GNm8lh_g_0Vl7319q';
const sb=window.supabase?.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,profile={role:'teacher',is_active:true,school_name:'مجموعة مدارس التقدم'},active='dashboard';
const KEY='riyadah_v21_data';
const NAV=[['dashboard','📊','لوحة القيادة'],['classes','🏫','الأقسام'],['students','👥','التلاميذ'],['assessments','📝','الروائز'],['support','🎯','الدعم TaRL'],['arabic','ع','العربية'],['french','Fr','الفرنسية'],['math','∑','الرياضيات'],['fluency','⚡','الطلاقة'],['tracking','📈','التتبع'],['blocks','🧩','اللبنات والإشهاد'],['explicit','🎓','التعليم الصريح'],['mindmap','🧠','الخطاطات الذهنية PPTX'],['reports','📄','التقارير والتصدير'],['ai','🤖','المساعد الذكي'],['inspector','🧭','المفتشة والتأطير'],['settings','⚙️','الإعدادات']];
let D={classes:[],students:[],assessments:[],support:[],arabic:[],french:[],math:[],fluency:[],tracking:[],blocks:[],explicit:[]};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)D={...D,...x}}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(D))}function toast(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display='none',2500)}
function go(k){active=k;nav();render()}function nav(){let list=NAV;if(profile.role==='parent')list=NAV.filter(x=>['dashboard','students','assessments','settings'].includes(x[0]));$('side').innerHTML=list.map(x=>`<button class="nav ${active===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}
function shell(t,s,b){return `<div class="card"><h2 style="margin:0 0 5px">${t}</h2><div class="muted">${s||''}</div></div>${b}`}function table(k,heads,row){return `<div class="card tablewrap"><table class="table"><tr>${heads.map(h=>`<th>${h}</th>`).join('')}<th>إجراء</th></tr>${D[k].map((x,i)=>`<tr>${row(x).map(v=>`<td>${esc(v)}</td>`).join('')}<td><button class="btn danger" onclick="del('${k}',${i})">حذف</button></td></tr>`).join('')||`<tr><td colspan="${heads.length+1}">لا توجد بيانات بعد</td></tr>`}</table></div>`}function add(k,o){D[k].push({id:Date.now()+Math.random(),...o});save();render();toast('تم الحفظ بنجاح')}function del(k,i){if(confirm('حذف هذا السجل؟')){D[k].splice(i,1);save();render()}}
function dashboard(){return shell('📊 لوحة القيادة',`${profile.school_name||'مجموعة مدارس التقدم'} · 2026/2027`,`<div class="grid stats">${[['التلاميذ','students'],['الأقسام','classes'],['الروائز','assessments'],['الدعم','support'],['الطلاقة','fluency']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${D[x[1]].length}</div></div>`).join('')}</div><div class="card"><div class="alert green">✅ المنصة تعمل محلياً. بياناتك تحفظ في هذا الجهاز.</div></div><div class="grid g3">${NAV.slice(1).map(x=>`<div class="card module" onclick="go('${x[0]}')"><div style="font-size:28px">${x[1]}</div><h3>${x[2]}</h3><div class="muted">فتح الوحدة</div></div>`).join('')}</div>`)}
function simple(k,t,fields){return shell(t,'تسجيل وتتبع',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();const o={};${fields.map(f=>`o.${f.k}=$('${f.k}').value`).join(';')}add('${k}',o);this.reset()}">${fields.map(f=>`<div class="field"><label>${f.l}</label><input id="${f.k}" ${f.req?'required':''}></div>`).join('')}<button class="btn primary">💾 حفظ</button></form></div>${table(k,fields.map(f=>f.l),x=>fields.map(f=>x[f.k]))}`)}
function classesPage(){return shell('🏫 الأقسام','إضافة الأقسام',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();add('classes',{name:$('cn').value,year:$('cy').value});this.reset()"><div class="field"><label>اسم القسم</label><input id="cn" required placeholder="المستوى الخامس 1"></div><div class="field"><label>السنة</label><input id="cy" value="2026/2027"></div><button class="btn primary">➕ إضافة</button></form></div>${table('classes',['القسم','السنة'],x=>[x.name,x.year])}`)}
function studentsPage(){return shell('👥 التلاميذ','ملف المتعلم',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();add('students',{name:$('sn').value,className:$('sc').value,code:$('sid').value});this.reset()"><div class="field"><label>الاسم الكامل</label><input id="sn" required></div><div class="field"><label>القسم</label><input id="sc"></div><div class="field"><label>رمز المتعلم</label><input id="sid"></div><button class="btn primary">➕ إضافة</button></form></div>${table('students',['الاسم','القسم','الرمز'],x=>[x.name,x.className,x.code])}`)}
function assessmentsPage(){return shell('📝 الروائز','قبلي / بعدي',`<div class="card"><form class="grid g3" onsubmit="event.preventDefault();add('assessments',{student:$('as').value,subject:$('av').value,phase:$('ap').value,score:$('ac').value});this.reset()"><div class="field"><label>المتعلم</label><input id="as" required></div><div class="field"><label>المادة</label><select id="av"><option>العربية</option><option>الفرنسية</option><option>الرياضيات</option></select></div><div class="field"><label>المرحلة</label><select id="ap"><option>قبلي</option><option>بعدي</option></select></div><div class="field"><label>النقطة</label><input id="ac" type="number" min="0" max="100"></div><button class="btn primary">💾 حفظ</button></form></div>${table('assessments',['المتعلم','المادة','المرحلة','النقطة'],x=>[x.student,x.subject,x.phase,x.score])}`)}
function mindmapPage(){return shell('🧠 الخطاطات الذهنية من PPTX','استخراج النصوص والعناوين من الدرس دون الخطأ السابق',`<div class="card"><label class="drop" for="pptx">📥 اضغط هنا لاختيار ملف PowerPoint (.pptx)<input id="pptx" class="hidden" type="file" accept=".pptx"></label><div id="mindStatus" class="alert orange">لم يتم تحميل ملف بعد.</div></div><div id="mindResult"></div>`)}
async function handlePptx(file){const status=$('mindStatus');status.className='alert orange';status.textContent='⏳ جارٍ تحليل الملف...';try{if(!window.JSZip)throw Error('مكتبة قراءة PPTX لم تُحمّل.');const zip=await JSZip.loadAsync(file);const paths=Object.keys(zip.files).filter(x=>/^ppt\/slides\/slide\d+\.xml$/.test(x)).sort((a,b)=>parseInt(a.match(/slide(\d+)\.xml$/)[1])-parseInt(b.match(/slide(\d+)\.xml$/)[1]));if(!paths.length)throw Error('لم توجد شرائح نصية في الملف.');const all=[];for(const slidePath of paths){const xml=await zip.files[slidePath].async('text');const doc=new DOMParser().parseFromString(xml,'application/xml');const paras=[...doc.getElementsByTagNameNS('*','p')];const slideNo=parseInt(slidePath.match(/slide(\d+)\.xml$/)[1]);paras.forEach(par=>{const text=[...par.getElementsByTagNameNS('*','t')].map(t=>t.textContent||'').join('').trim();if(!text)return;const ppr=par.getElementsByTagNameNS('*','pPr')[0];const lvl=ppr?parseInt(ppr.getAttribute('lvl')||'0'):0;all.push({slide:slideNo,text,level:Number.isFinite(lvl)?lvl:0})})}if(!all.length)throw Error('لم يتم العثور على نص داخل الشرائح.');const groups=[];for(const x of all){if(x.level===0||!groups.length)groups.push({title:x.text,slide:x.slide,items:[]});else groups[groups.length-1].items.push(x)}window.__map={name:file.name,all,groups};status.className='alert green';status.textContent=`✅ تم استخراج ${all.length} فقرة من ${paths.length} شريحة.`;renderMap()}catch(e){console.error(e);status.className='alert red';status.textContent='❌ '+e.message}}
function renderMap(){const m=window.__map;$('mindResult').innerHTML=`<div class="card"><div class="actions"><button class="btn primary" onclick="window.print()">🖨️ طباعة</button><button class="btn light" onclick="downloadMap()">⬇️ تصدير HTML</button></div><div class="mind"><div class="world" id="world"></div></div><div class="card"><h3>النص المستخرج كاملاً</h3>${m.all.map(x=>`<div><b>شريحة ${x.slide}:</b> ${esc(x.text)}</div>`).join('')}</div></div>`;const w=$('world'),cx=600,cy=370,n=Math.min(Math.max(m.groups.length,1),12);w.innerHTML=`<div class="node center" style="left:${cx-125}px;top:${cy-60}px">${esc(m.name.replace(/\.pptx$/i,''))}</div>`;m.groups.slice(0,12).forEach((g,i)=>{const a=2*Math.PI*i/n-Math.PI/2,x=cx+370*Math.cos(a)-135,y=cy+280*Math.sin(a)-50;w.insertAdjacentHTML('beforeend',`<div class="node" style="left:${x}px;top:${y}px"><b>${esc(g.title)}</b><div class="muted" style="margin-top:7px">${g.items.slice(0,15).map(v=>esc(v.text)).join(' · ')}</div><small>الشريحة ${g.slide}</small></div>`);const x1=cx,y1=cy,x2=x+135,y2=y+45,len=Math.hypot(x2-x1,y2-y1),ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;w.insertAdjacentHTML('beforeend',`<div class="line" style="left:${x1}px;top:${y1}px;width:${len}px;transform:rotate(${ang}deg)"></div>`)})}
function downloadMap(){const m=window.__map;if(!m)return;const html='<!doctype html><meta charset="utf-8"><title>خطاطة ذهنية</title><style>body{font-family:Arial;direction:rtl;padding:30px}.g{padding:15px;margin:15px;border:1px solid #ccc;border-radius:12px}</style><h1>'+esc(m.name)+'</h1>'+m.groups.map(g=>`<div class="g"><h2>${esc(g.title)}</h2>${g.items.map(x=>`<p>${esc(x.text)}</p>`).join('')}<small>الشريحة ${g.slide}</small></div>`).join('');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download='riyadah-mindmap.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){const p=$('page');if(active==='dashboard')p.innerHTML=dashboard();else if(active==='classes')p.innerHTML=classesPage();else if(active==='students')p.innerHTML=studentsPage();else if(active==='assessments')p.innerHTML=assessmentsPage();else if(active==='mindmap')p.innerHTML=mindmapPage();else if(active==='support')p.innerHTML=simple('support','🎯 الدعم TaRL',[{k:'student',l:'المتعلم',req:true},{k:'level',l:'المستوى'},{k:'need',l:'الحاجة'}]);else if(active==='arabic')p.innerHTML=simple('arabic','ع العربية',[{k:'student',l:'المتعلم'},{k:'skill',l:'المهارة'},{k:'score',l:'النتيجة'}]);else if(active==='french')p.innerHTML=simple('french','Fr الفرنسية',[{k:'student',l:'المتعلم'},{k:'skill',l:'المهارة'},{k:'score',l:'النتيجة'}]);else if(active==='math')p.innerHTML=simple('math','∑ الرياضيات',[{k:'student',l:'المتعلم'},{k:'block',l:'اللبنة'},{k:'status',l:'الإشهاد'}]);else if(active==='fluency')p.innerHTML=simple('fluency','⚡ الطلاقة',[{k:'student',l:'المتعلم'},{k:'words',l:'الكلمات/الدقيقة'},{k:'accuracy',l:'الدقة'}]);else if(active==='tracking')p.innerHTML=simple('tracking','📈 التتبع',[{k:'student',l:'المتعلم'},{k:'skill',l:'المهارة'},{k:'status',l:'الحالة'}]);else if(active==='blocks')p.innerHTML=simple('blocks','🧩 اللبنات والإشهاد',[{k:'student',l:'المتعلم'},{k:'block',l:'اللبنة'},{k:'status',l:'الإشهاد'}]);else if(active==='explicit')p.innerHTML=simple('explicit','🎓 التعليم الصريح',[{k:'lesson',l:'الدرس'},{k:'objective',l:'الهدف'},{k:'status',l:'الحالة'}]);else if(active==='reports')p.innerHTML=shell('📄 التقارير والتصدير','نسخة احتياطية',`<div class="card"><button class="btn primary" onclick="exportData()">⬇️ تصدير JSON</button></div>`);else if(active==='ai')p.innerHTML=shell('🤖 المساعد الذكي','مساعد محلي',`<div class="card"><textarea id="aiq" placeholder="اكتب طلبك"></textarea><button class="btn primary" onclick="aiAnswer()">✨ اقتراح</button><div id="air" class="alert green"></div></div>`);else if(active==='inspector')p.innerHTML=shell('🧭 المفتشة والتأطير','فضاء التأطير',`<div class="card"><textarea placeholder="ملاحظات التأطير"></textarea></div>`);else if(active==='settings')p.innerHTML=shell('⚙️ الإعدادات','الحساب',`<div class="card"><p><b>الحساب:</b> ${esc(user?.email||'وضع محلي')}</p><p><b>الدور:</b> ${esc(profile.role)}</p><button class="btn danger" onclick="localStorage.removeItem(KEY);location.reload()">مسح البيانات المحلية</button></div>`)}
function aiAnswer(){const q=$('aiq').value.trim();$('air').textContent=q?'اقتراح: حدد المهارة، قدم نشاطاً متدرجاً، ثم أعد القياس بعد الدعم.':'اكتب طلباً أولاً.'}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='riyadah-v21-backup.json';a.click()}
$('printBtn').onclick=()=>window.print();$('logoutBtn').onclick=async()=>{try{await sb?.auth.signOut({scope:'local'})}catch(e){}location.replace('/')};$('page').addEventListener('change',e=>{if(e.target.id==='pptx'&&e.target.files?.[0])handlePptx(e.target.files[0])});load();
async function boot(){try{const r=await sb?.auth.getUser();if(r?.data?.user){user=r.data.user;const p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.data)profile=p.data;else if(user.email?.toLowerCase()==='zapro1822@gmail.com')profile={role:'admin',is_active:true,school_name:'مجموعة مدارس التقدم'};else if(user.user_metadata?.requested_role)profile={role:user.user_metadata.requested_role,is_active:true,school_name:''}}}catch(e){console.warn(e)}nav();render()}window.addEventListener('error',e=>{console.error(e.error||e.message);const p=$('page');if(p&&!p.innerHTML)p.innerHTML='<div class="card"><div class="alert red">حدث خطأ في تشغيل الواجهة. أعد تحميل الصفحة.</div></div>'});boot();
</script></body></html>
